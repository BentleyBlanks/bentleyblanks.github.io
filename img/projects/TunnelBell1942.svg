<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="地道战·钟声：地表村庄与地下地道剖面">
  <defs>
    <linearGradient id="tbSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1524"/>
      <stop offset="1" stop-color="#1d2b3f"/>
    </linearGradient>
    <linearGradient id="tbEarth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3423"/>
      <stop offset="0.35" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#241a12"/>
    </linearGradient>
    <radialGradient id="tbLamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb066" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffb066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tbMoon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe0f5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfe0f5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="400" height="128" fill="url(#tbSky)"/>
  <circle cx="322" cy="40" r="34" fill="url(#tbMoon)"/>
  <circle cx="322" cy="40" r="12" fill="#e8f0fb" opacity="0.92"/>

  <!-- 远山 -->
  <path d="M0 108 L48 84 L92 100 L140 74 L196 102 L240 88 L300 106 L356 90 L400 104 L400 128 L0 128Z"
        fill="#16233a" opacity="0.9"/>

  <!-- 村舍剪影 -->
  <g fill="#0f1826">
    <path d="M22 128 V96 l26-16 26 16 v32Z"/>
    <path d="M96 128 V104 l20-13 20 13 v24Z"/>
    <path d="M232 128 V98 l24-15 24 15 v30Z"/>
    <path d="M300 128 V108 l16-11 16 11 v20Z"/>
  </g>
  <g fill="#e0a04a" opacity="0.75">
    <rect x="40" y="104" width="7" height="9"/>
    <rect x="250" y="106" width="7" height="9"/>
  </g>

  <!-- 老槐树与钟 -->
  <g stroke="#0b111c" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M168 128 V72"/>
    <path d="M168 84 L146 68 M168 78 L192 60 M168 94 L150 86"/>
  </g>
  <line x1="182" y1="66" x2="182" y2="80" stroke="#0b111c" stroke-width="2"/>
  <path d="M175 80 a7 7 0 0 1 14 0 v8 l3 4 h-20 l3 -4Z" fill="#c9903f"/>
  <circle cx="182" cy="94" r="2.6" fill="#c9903f"/>
  <g stroke="#e0a04a" stroke-width="2" fill="none" opacity="0.8">
    <path d="M198 76 a12 12 0 0 1 0 16"/>
    <path d="M206 70 a20 20 0 0 1 0 28"/>
    <path d="M166 76 a12 12 0 0 0 0 16"/>
  </g>

  <!-- 地面线 -->
  <rect y="128" width="400" height="4" fill="#2b3040"/>

  <!-- 土层剖面 -->
  <path d="M0 132 H400 V260 H0 Z" fill="url(#tbEarth)"/>
  <g stroke="#000" stroke-opacity="0.18" stroke-width="1">
    <path d="M0 152 H400 M0 186 H400 M0 222 H400"/>
  </g>

  <!-- 挖空的地道（浅层 + 竖井 + 干线） -->
  <g fill="#120c07">
    <path d="M28 150 q40 -6 78 2 v26 q-40 8 -78 0 Z"/>
    <rect x="96" y="152" width="26" height="62" rx="10"/>
    <path d="M60 206 q90 -10 190 4 t122 -2 v30 q-130 12 -204 -2 t-108 4 Z"/>
    <rect x="272" y="150" width="24" height="62" rx="10"/>
    <path d="M258 146 q40 -6 76 3 v24 q-40 7 -76 -1 Z"/>
  </g>

  <!-- 支撑木 -->
  <g fill="#5a3f27">
    <rect x="146" y="208" width="5" height="28"/>
    <rect x="140" y="205" width="18" height="5"/>
    <rect x="212" y="210" width="5" height="28"/>
    <rect x="206" y="207" width="18" height="5"/>
  </g>

  <!-- 马灯光 + 地道里的人 -->
  <circle cx="182" cy="222" r="52" fill="url(#tbLamp)"/>
  <g fill="#120c07">
    <path d="M170 234 v-14 a5 5 0 0 1 10 0 v14 Z"/>
    <circle cx="175" cy="212" r="5"/>
    <path d="M192 234 v-11 a4 4 0 0 1 8 0 v11 Z"/>
    <circle cx="196" cy="217" r="4"/>
  </g>
  <circle cx="186" cy="224" r="3.6" fill="#ffcf8a"/>

  <!-- 通气孔漏光 -->
  <path d="M300 132 l-10 74 h20 Z" fill="#a9c4e8" opacity="0.14"/>

  <!-- 敌军靴子（地表威胁） -->
  <g fill="#0f1826" opacity="0.9">
    <path d="M348 128 v-22 h9 v16 l7 6 Z"/>
    <path d="M366 128 v-18 h9 v12 l7 6 Z"/>
  </g>
</svg>
