        c.fillText("焚", 0, -k*1.1);
      }
      if(v.prog){
        c.fillStyle = "rgba(164,50,42,.9)";
        c.font = `${Math.round(s*0.26)}px system-ui`;
        c.textAlign="center";
        c.fillText("组织中…", 0, -k*1.15);
      }
      c.fillStyle = v.org>=2 ? "rgba(120,32,24,.95)" : "rgba(44,34,20,.85)";
      c.font = `${Math.round(Math.max(8,s*0.26))}px "Noto Serif SC",serif`;
      c.textAlign="center"; c.textBaseline="top";
      c.fillText(v.name, 0, k*1.0);
      c.restore();
    }
    if(t.fort){
      const f = t.fort;
      c.save(); c.translate(P.x,P.y);
      const k = s*0.38;
      const body = f.pOwned ? "#8d3a2c" : (f.jp ? "#46525c" : "#8a7a4a");
      c.fillStyle = body; c.strokeStyle = "#20272c"; c.lineWidth = Math.max(1,s*0.05);
      if(f.kind==="town"){
        c.fillRect(-k*1.05,-k*0.55,k*2.1,k*1.05);
        c.strokeRect(-k*1.05,-k*0.55,k*2.1,k*1.05);
        c.beginPath(); c.moveTo(-k*1.2,-k*0.55); c.lineTo(0,-k*1.15); c.lineTo(k*1.2,-k*0.55);
        c.closePath(); c.fill(); c.stroke();
        c.fillStyle = f.pOwned ? "#ffd95e" : "#dfe6ea";
        c.font = `600 ${Math.round(Math.max(9,s*0.32))}px "Noto Serif SC",serif`;
        c.textAlign="center"; c.textBaseline="middle";
        c.fillText(f.name, 0, -k*0.05);
      }else{
        c.fillRect(-k*0.6,-k*0.6,k*1.2,k*1.2);
        c.strokeRect(-k*0.6,-k*0.6,k*1.2,k*1.2);
        c.fillStyle = "#1b2126";
        c.fillRect(-k*0.2,-k*0.28,k*0.4,k*0.32);
      }
      // 旗帜
      if(f.jp && !f.pOwned){
        c.fillStyle = "#e8e2d4";
        c.fillRect(k*0.55,-k*1.3,k*0.62,k*0.44);
        c.fillStyle = "#c03028";
        c.beginPath(); c.arc(k*0.86,-k*1.08,k*0.13,0,Math.PI*2); c.fill();
      } else if(!f.pOwned){
        c.fillStyle = "rgba(230,210,140,.95)";
        c.font = `${Math.round(Math.max(8,s*0.26))}px "Noto Serif SC",serif`;
        c.textAlign="center";
        c.fillText("伪", 0, -k*1.1);
      } else {
        c.fillStyle = "#a4322a";
        c.fillRect(k*0.55,-k*1.35,k*0.6,k*0.4);
      }
      // 守备数字
      const bw = s*0.6, bh = s*0.3;
      c.fillStyle = "rgba(20,24,28,.86)";
      c.fillRect(-bw/2, k*0.7, bw, bh);
      c.fillStyle = f.g < f.gMax*0.55 ? "#ffcf6a" : "#dfe6ea";
      c.font = `600 ${Math.round(Math.max(8,s*0.26))}px system-ui`;
      c.textAlign="center"; c.textBaseline="middle";
      c.fillText(String(Math.max(0,Math.round(f.g))), 0, k*0.7+bh/2);
      if(f.kind!=="town"){
        c.fillStyle = "rgba(44,34,20,.8)";
        c.font = `${Math.round(Math.max(7,s*0.2))}px "Noto Serif SC",serif`;
        c.textBaseline="top";
        c.fillText(f.name, 0, k*1.06);
      }
      c.restore();
    }
  }
}
function DrawEnemies(c,s){
  for(const e of G.eUnits){
    const t = T(e.q,e.r);
    if(!t || t.fog!==2) continue;
    const D = EUNITS[e.type];
    const p = hexToPix(e.q,e.r,s);
    e.ax*=0.76; e.ay*=0.76;
    const P = W2S(p.x+e.ax, p.y+e.ay);
    c.save(); c.translate(P.x,P.y);
    const k = s*0.36;
    c.fillStyle = D.color; c.strokeStyle="#12171c"; c.lineWidth=Math.max(1,s*0.05);
    c.beginPath();
    c.moveTo(0,-k*0.95); c.lineTo(k*0.9,k*0.55); c.lineTo(-k*0.9,k*0.55);
    c.closePath(); c.fill(); c.stroke();
    if(D.jp){
      c.fillStyle = "#e8e2d4"; c.beginPath(); c.arc(0,-k*0.05,k*0.3,0,Math.PI*2); c.fill();
      c.fillStyle = "#c03028"; c.beginPath(); c.arc(0,-k*0.05,k*0.15,0,Math.PI*2); c.fill();
    }else{
      c.fillStyle = "#f0e8c8";
      c.font = `600 ${Math.round(Math.max(8,s*0.3))}px "Noto Serif SC",serif`;
      c.textAlign="center"; c.textBaseline="middle";
      c.fillText("伪", 0, 0);
    }
    const tag = e.task.kind==="sweep" ? "讨" : (e.task.kind==="hunt" ? "骑" : (e.task.kind==="withdraw" ? "退" : ""));
    if(tag){
      c.fillStyle = "#ffb090";
      c.font = `${Math.round(Math.max(8,s*0.26))}px "Noto Serif SC",serif`;
      c.textAlign="center";
      c.fillText(tag, 0, -k*1.25);
    }
    const bw = s*0.8;
    c.fillStyle = "rgba(20,14,10,.72)"; c.fillRect(-bw/2, k*0.75, bw, s*0.11);
    c.fillStyle = "#7d99c8"; c.fillRect(-bw/2, k*0.75, bw*Math.max(0,e.hp)/100, s*0.11);
    c.restore();
  }
}
function DrawUnits(c,s){
  for(const u of G.units){
    const p = hexToPix(u.q,u.r,s);
    u.ax*=0.74; u.ay*=0.74;
    const P = W2S(p.x+u.ax, p.y+u.ay);
    const D = UNITS[u.type];
    c.save(); c.translate(P.x,P.y);
    const k = s*0.36;
    const spent = u.acted || u.mp<=0;
    if(SEL===u){
      c.strokeStyle = "#ffd05e"; c.lineWidth=2.4;
      c.beginPath(); c.arc(0,0,s*0.7,0,Math.PI*2); c.stroke();
    }
    c.globalAlpha = spent ? 0.62 : 1;
    c.fillStyle = D.color; c.strokeStyle = "#2a1410"; c.lineWidth = Math.max(1,s*0.055);
    c.beginPath();
    c.moveTo(-k*0.9,-k*0.7); c.lineTo(k*0.9,-k*0.7); c.lineTo(k*0.9,k*0.45); c.lineTo(0,k*0.92); c.lineTo(-k*0.9,k*0.45);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = "#ffe6c0";
    c.font = `600 ${Math.round(Math.max(9,s*0.32))}px "Noto Serif SC",serif`;
    c.textAlign="center"; c.textBaseline="middle";
    c.fillText(D.label[0], 0, -k*0.1);
    for(let i=0;i<u.lvl;i++){
      c.fillStyle = "#ffd95e";
      c.font = `${Math.round(s*0.22)}px system-ui`;
      c.fillText("★", -k*0.5+i*k*0.5, -k*1.0);
    }
    if(u.stance==="fortify"){
      c.fillStyle = "#a8c8e8";
      c.font = `${Math.round(Math.max(8,s*0.24))}px "Noto Serif SC",serif`;
      c.fillText("垒", k*1.05, -k*0.8);
    }
    const bw = s*0.84;
    c.fillStyle = "rgba(20,14,10,.72)"; c.fillRect(-bw/2, k*1.0, bw, s*0.12);
    c.fillStyle = "#e0743c"; c.fillRect(-bw/2, k*1.0, bw*Math.max(0,u.hp)/100, s*0.12);
    c.globalAlpha = 1;
    c.restore();
  }
}
function DrawFXAll(c){
  for(let i=FX.length-1;i>=0;i--){
    const f = FX[i];
    f.x+=f.vx; f.y+=f.vy; f.vy+=0.07; f.life-=f.decay;
    if(f.life<=0){ FX.splice(i,1); continue; }
    const P = W2S(f.x,f.y);
    c.globalAlpha = Math.max(0,f.life);
    c.fillStyle = f.color;
    c.fillRect(P.x-f.size/2, P.y-f.size/2, f.size, f.size);
  }
  c.globalAlpha = 1;
  for(let i=FLOATS.length-1;i>=0;i--){
    const f = FLOATS[i];
    f.y -= 0.5; f.life -= 0.012;
    if(f.life<=0){ FLOATS.splice(i,1); continue; }
    const P = W2S(f.x,f.y);
    c.globalAlpha = Math.min(1, f.life*2);
    c.fillStyle = "rgba(20,14,8,.75)";
    c.font = `600 ${Math.round(view.s*0.4)}px "Noto Serif SC",serif`;
    c.textAlign = "center";
    c.fillText(f.text, P.x+1, P.y+1);
    c.fillStyle = f.color;
    c.fillText(f.text, P.x, P.y);
  }
  c.globalAlpha = 1;
}
function DrawSweepArrow(c,s){
  const S = G.sweep;
  if(S.state!=="warn" || !S.target || !S.srcs) return;
  const time = performance.now()/1000;
  for(const src of S.srcs){
    const a = hexToPix(src.q,src.r,s), A = W2S(a.x,a.y);
    const b = hexToPix(S.target.q,S.target.r,s), B = W2S(b.x,b.y);
    c.save();
    c.strokeStyle = `rgba(226,90,54,${0.4+0.3*Math.sin(time*3)})`;
    c.lineWidth = 3.5; c.setLineDash([12,9]); c.lineDashOffset = -time*24;
    c.beginPath(); c.moveTo(A.x,A.y); c.lineTo(B.x,B.y); c.stroke();
    c.setLineDash([]);
    const ang = Math.atan2(B.y-A.y,B.x-A.x);
    c.fillStyle = "rgba(226,90,54,.85)";
    c.translate(B.x,B.y); c.rotate(ang);
    c.beginPath(); c.moveTo(0,0); c.lineTo(-14,-7); c.lineTo(-14,7); c.closePath(); c.fill();
    c.restore();
  }
}

/* ── 21. 输入（NightRaid 加固版：10px 容差 / click 兜底 / 缩放平移）── */
let ptr = { down:false, id:null, sx:0, sy:0, lx:0, ly:0, moved:false, t0:0 };
let pinch = null;
const TAP_SLOP = 10;
let pendingAtk = null;   // 触屏二次确认

function CanvasPoint(ev){
  const r = cv.getBoundingClientRect();
  return { x:ev.clientX-r.left, y:ev.clientY-r.top };
}
function HexAt(sx,sy){
  const w = S2W(sx,sy);
  const h = pixToHex(w.x,w.y,view.s);
  return T(h.q,h.r) ? h : null;
}
function OnDown(ev){
  if(!cv) return;
  if(!AC) Sfx("click");
  if(G.phase==="enemy"){ fastAnim = true; return; }
  const p = CanvasPoint(ev);
  ptr = { down:true, id:ev.pointerId, sx:p.x, sy:p.y, lx:p.x, ly:p.y, moved:false, t0:Date.now() };
  if(cv.setPointerCapture && ev.pointerId!=null){ try{ cv.setPointerCapture(ev.pointerId); }catch(e){} }
}
function OnMove(ev){
  if(!cv) return;
  const p = CanvasPoint(ev);
  if(ptr.down){
    const dx = p.x-ptr.sx, dy = p.y-ptr.sy;
    if(!ptr.moved && Math.hypot(dx,dy)>TAP_SLOP) ptr.moved = true;
    if(ptr.moved){ view.ox += p.x-ptr.lx; view.oy += p.y-ptr.ly; terrainDirty = true; }
    ptr.lx = p.x; ptr.ly = p.y;
  }else{
    hoverHex = HexAt(p.x,p.y);
    ShowTip(hoverHex, ev.clientX, ev.clientY);
    ShowForecastCard(hoverHex, ev.clientX, ev.clientY);
  }
}
function OnUp(ev){
  if(!cv) return;
  const wasDown = ptr.down, moved = ptr.moved;
  ptr.down = false; ptr.moved = false;
  if(!wasDown || moved) return;
  const p = CanvasPoint(ev);
  TapHex(p.x, p.y, ev.pointerType||"mouse");
}
function OnClickFallback(ev){
  if(ptr.down || ptr.moved) return;
  if(Date.now()-ptr.t0 < 350) return;
  const p = CanvasPoint(ev);
  TapHex(p.x, p.y, "mouse");
}
function OnWheel(ev){
  ev.preventDefault();
  view.s = Math.max(12, Math.min(52, view.s*(ev.deltaY<0?1.12:0.89)));
  terrainDirty = true;
}
function TapHex(sx, sy, ptype){
  if(G.over || G.busy || G.phase!=="player") return;
  const h = HexAt(sx,sy);
  if(!h) return;
  const t = T(h.q,h.r);
  // 招兵放置模式
  if(recruitMode){
    if(!PlaceRecruit(t)) return;
    return;
  }
  // 点自己人 → 选中
  const own = UnitAt(h.q,h.r);
  if(own && own!==SEL){ SelectUnit(own); return; }
  // 点可攻击目标
  if(SEL && ATK && ATK.has(K(h.q,h.r))){
    const tgt = ATK.get(K(h.q,h.r));
    if(ptype!=="mouse"){
      if(pendingAtk===K(h.q,h.r)){ pendingAtk=null; HideForecastCard(); DoAttack(SEL,tgt); }
      else{ pendingAtk = K(h.q,h.r); ShowForecastCard(h, sx, sy, true); Toast("再点一次发起进攻"); }
      return;
    }
    HideForecastCard(); DoAttack(SEL, tgt); return;
  }
  pendingAtk = null;
  // 点可达格 → 移动
  if(SEL && REACH && REACH.cost.has(K(h.q,h.r))){ DoMove(SEL,h.q,h.r); return; }
  // 反馈
  if(SEL){
    if(t.fog===0) Toast("未侦察区域");
    else if(EnemyAt(h.q,h.r)||(t.fort&&!t.fort.pOwned)) Toast("够不着：先移动到目标旁");
    else if(SEL.mp<=0||SEL.acted) Toast(`${SEL.name}本月已行动`);
    else if(t.terr==="water") Toast("过不去：河流");
    else Toast("机动力不够");
    Sfx("fail");
  }
}
function SelectUnit(u){
  if(!u) return;
  SEL = u; recruitMode = null; pendingAtk = null;
  RefreshOrders(); Sfx("click"); Sync();
  if(G.hintStep===0 && G.turn===1) SetHint(1);
}
function CycleIdle(){
  const idle = G.units.filter(u=>!u.acted && u.mp>0);
  if(!idle.length) return false;
  const i = idle.indexOf(SEL);
  const nxt = idle[(i+1)%idle.length];
  SelectUnit(nxt); CenterOn(nxt.q,nxt.r);
  return true;
}

/* ── 22. UI 同步 ─────────────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function Sync(){
  if(!$("dateNum")) return;
  $("dateNum").textContent = DateStr(G.turn);
  $("eraTag").textContent = CurEra().name;
  const inc = Income();
  $("rFood").textContent = Math.round(G.res.food);
  $("dFood").textContent = (inc.food-inc.upkeep>=0?"+":"")+(inc.food-inc.upkeep);
  $("dFood").style.color = inc.food-inc.upkeep>=0 ? "#8a9a6a" : "#e08a6a";
  $("rMan").textContent = Math.round(G.res.man);
  $("dMan").textContent = "+"+inc.man;
  $("rArms").textContent = Math.round(G.res.arms);
  $("rPol").textContent = Math.round(G.res.pol);
  $("rHeat").textContent = Math.round(G.heat);
  $("heatFill").style.width = Math.min(100,G.heat)+"%";
  $("btnPolicy").classList.toggle("flash", !!G.polOffer);
  // 任务横幅
  const m = ActiveMission();
  $("missionBar").innerHTML = m ? `任务【<b>${m.name}</b>】${m.desc}` : "";
  // 下一回合按钮
  const bn = $("btnNext"), sub = $("nextSub");
  if(G.phase==="enemy"){ bn.className="busy"; bn.disabled=true; bn.childNodes[0].textContent="敌军行动中"; sub.textContent="点击地图可加速"; }
  else{
    bn.disabled = G.over;
    const idle = G.units.filter(u=>!u.acted && u.mp>0).length;
    if(idle>0){ bn.className="idle"; bn.childNodes[0].textContent=`待命部队 ${idle}`; sub.textContent="点击切换 · 再点结束回合"; }
    else{ bn.className=""; bn.childNodes[0].textContent="下一回合"; sub.textContent=DateStr(G.turn+1); }
  }
  // 招兵栏
  const rb = $("recruitBar");
  rb.innerHTML = "";
  for(const k of RecruitTypes()){
    const D = UNITS[k], b = document.createElement("button");
    b.className = "rbtn" + (recruitMode===k?" on":"");
    b.innerHTML = `${D.label}<small>兵${D.cost.man} 械${D.cost.arms}</small>`;
    b.title = D.tip;
    b.disabled = !CanAfford(k) || G.phase!=="player" || G.over;
    b.onclick = ()=>{ recruitMode===k ? (recruitMode=null,Sync()) : StartRecruit(k); };
    rb.appendChild(b);
  }
  // 队伍名册
  const ros = $("roster");
  ros.innerHTML = "";
  for(const u of G.units){
    const d = document.createElement("div");
    d.className = "ucard"+(SEL===u?" sel":"")+((u.acted||u.mp<=0)?" spent":"");
    d.style.borderLeftColor = UNITS[u.type].color;
    d.innerHTML = `<div class="un">${u.name}${"★".repeat(u.lvl)}<em>${UNITS[u.type].label}</em></div>
      <div class="um"><span>兵力 ${Math.max(0,Math.round(u.hp))}</span><span>机动 ${u.mp}</span></div>
      <div class="hpbar"><i style="width:${Math.max(0,u.hp)}%"></i></div>`;
    d.onclick = ()=>{ SelectUnit(u); CenterOn(u.q,u.r); };
    ros.appendChild(d);
  }
  SyncActions();
}
function SyncActions(){
  const title = $("actTitle"), acts = $("acts");
  if(!title || !acts) return;
  acts.innerHTML = "";
  if(G.over){ title.textContent = "战争结束"; return; }
  if(G.phase!=="player"){ title.textContent = "敌军行动中……（点击地图加速）"; return; }
  if(recruitMode){ title.innerHTML = `<b>${UNITS[recruitMode].label}成军</b><span>点击高亮的堡垒村/县城放置（Esc 取消）</span>`; return; }
  if(!SEL){ title.textContent = "— 点队伍下令；点敌人看战报；空格结束回合 —"; return; }
  const u = SEL, D = UNITS[u.type], t = T(u.q,u.r);
  title.innerHTML = `<b>${u.name}${"★".repeat(u.lvl)} · ${u.cmd}</b>
    <span>${D.label}</span><span>兵力 ${Math.max(0,Math.round(u.hp))}/100</span><span>机动 ${u.mp}/${D.mp}</span>
    <span>${PlaceName(t)}</span>`;
  const mk = (label,cost,cls,enabled,fn,tip)=>{
    const b = document.createElement("button");
    b.className = "abtn"+(cls?" "+cls:"");
    b.innerHTML = label+(cost?`<span class="cost">${cost}</span>`:"");
    b.disabled = !enabled;
    if(tip) b.title = tip;
    if(enabled) b.onclick = fn;
    acts.appendChild(b);
    return b;
  };
  if(u.type==="wt" && t.vill){
    const need = G.policies.includes("jianzu")?1:2;
    mk("发动群众", `${need}月/级`, "gold", CanOrganize(u), ()=>DoOrganize(u),
      CanOrganize(u)?"组织度+1：1级入会 2级出粮出兵 3级堡垒村":"该村已巩固或被焚");
  }
  if(CanSabotage(u)){
    mk("破袭铁路", SaboRisk(u)?"⚠敌据点火力下":"", "hot", true, ()=>DoSabotage(u),
      "扒轨炸桥：中断行车，牵制记分"+(CurEra().key==="baituan"?"（百团大战×2）":""));
  }
  for(const ft of FlipTargets(u)){
    mk(`策反 ${ft.fort.name}`, "", "gold", true, ()=>DoFlip(u,ft), "白皮红心，不放一枪");
  }
  if(!u.acted) mk("休整驻防", "防+4·回血", "", true, ()=>DoRest(u), "原地设防，下月回血更多");
  if(!u.acted || u.mp>0) mk("待命", "", "", true, ()=>{ u.acted=true; u.mp=0; RefreshOrders(); Sync(); }, "本月不再行动");
}

function ShowTip(h, cx, cy){
  const el = $("tip"); if(!el) return;
  if(!h || G.phase!=="player"){ el.style.display="none"; return; }
  const t = T(h.q,h.r);
  if(!t){ el.style.display="none"; return; }
  if(t.fog===0){ el.innerHTML = `<div class="th">未侦察</div>派部队前出，或组织村庄扩大耳目`; }
  else{
    let s = `<div class="th">${PlaceName(t)}</div><span class="ty">${TERR[t.terr].name}</span> · 机动${TERR[t.terr].cost<0?"—":TERR[t.terr].cost}${TERR[t.terr].def?` · 防+${TERR[t.terr].def}`:""}`;
    if(t.rail) s += `<br>铁路${t.railCut?'<span class="tw">（已破坏）</span>':""}`;
    else if(t.road) s += `<br>公路`;
    if(t.mine) s += `<br><span class="tg">已布雷</span>`;
    if(t.site) s += `<br><span class="tw">敌炮楼工地（${t.site.left}月建成，上去捣毁）</span>`;
    if(t.vill){
      const lv = ["未组织","已组织","根据地村","堡垒村"][t.vill.org];
      s += `<br>${t.vill.burn?'<span class="tw">被焚的</span>':""}${lv} · 人丁${t.vill.pop}`;
      if(t.vill.org>=2) s += `<span class="tg"> 产粮${t.vill.pop}</span>`;
    }
    if(t.fort){
      s += `<br><span class="${t.fort.pOwned?"tg":"tw"}">${t.fort.name}</span> 守备${Math.round(t.fort.g)}`;
      if(!t.fort.jp && !t.fort.pOwned) s += `（伪军·可策反）`;
    }
    const e = EnemyAt(h.q,h.r);
    if(e && t.fog===2) s += `<br><span class="tw">${EUNITS[e.type].label}</span> 兵力${Math.max(0,Math.round(e.hp))} 强度${EUNITS[e.type].str+EnemyStrMod()}`;
    el.innerHTML = s;
  }
  el.style.display = "block";
  el.style.left = Math.min(window.innerWidth-240, cx+16)+"px";
  el.style.top  = Math.min(window.innerHeight-130, cy+14)+"px";
}
function ShowForecastCard(h, cx, cy, force){
  const el = $("fcCard"); if(!el) return;
  if(!h || !SEL || !ATK || !ATK.has(K(h.q,h.r)) || G.phase!=="player"){ el.style.display="none"; return; }
  const tgt = ATK.get(K(h.q,h.r));
  const fc = Forecast(SEL, tgt);
  el.innerHTML = `
    <div class="fh"><span>${SEL.name}</span><span style="color:#8fb4d8">${fc.ti.label}</span></div>
    <div class="fvs">
      <div><div class="v">${Math.round(fc.a)}</div><div class="lb">我军战力</div></div>
      <div style="color:#8a765a">对</div>
      <div><div class="v e">${Math.round(fc.d)}</div><div class="lb">敌军战力</div></div>
    </div>
    <div class="fmods">${fc.mods.map(m=>`${m[0]} <span>${m[1]}</span>`).join("<br>")}<br>${fc.dmods.map(m=>`敌·${m[0]} <span>${m[1]}</span>`).join("<br>")}</div>
    <div class="fdmg">敌承伤 <b class="g">${fc.dmg[0]}~${fc.dmg[1]}</b> · 我承伤 <b>${fc.ret[0]}~${fc.ret[1]}</b>${fc.kill?'<br><span style="color:#ffd95e">有望全歼！</span>':""}</div>
    ${tgt.from?`<div class="fcap">将先机动至侧翼再进攻</div>`:""}
    <div class="fcap">${force?"再点一次执行":"点击目标即进攻"}</div>`;
  el.style.display = "block";
  el.style.left = Math.min(window.innerWidth-270, cx+18)+"px";
  el.style.top  = Math.max(50, cy-160)+"px";
}
function HideForecastCard(){ const el=$("fcCard"); if(el) el.style.display="none"; }

/* ── 23. 弹层 ────────────────────────────────────────────────────── */
function Modal(opt){
  const root = $("modalRoot"); if(!root) return;
  root.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "modal";
  const box = document.createElement("div");
  box.className = "mbox";
  box.innerHTML = `<h2>${opt.title}</h2><h3>${opt.sub||""}</h3>${opt.body||""}`;
  const row = document.createElement("div");
  row.className = "mrow";
  (opt.btns||[{t:"知道了",cls:"pri"}]).forEach(b=>{
    const btn = document.createElement("button");
    btn.className = "mbtn "+(b.cls||"");
    btn.textContent = b.t;
    btn.onclick = ()=>{ if(b.fn) b.fn(); else CloseModal(); };
    row.appendChild(btn);
  });
  box.appendChild(row); wrap.appendChild(box); root.appendChild(wrap);
}
function CloseModal(){ const r=$("modalRoot"); if(r) r.innerHTML=""; }

function ShowPolicyModal(){
  if(!G.polOffer){
    const owned = G.policies.map(k=>`<p><span class="hl">${POLICIES[k].name}</span> — ${POLICIES[k].desc}</p>`).join("") || "<p>尚未颁布政策。政治点攒够后会送来三选一。</p>";
    Modal({ title:"根据地政策", sub:`政治点 ${Math.round(G.res.pol)}`, body:owned });
    return;
  }
  const cards = G.polOffer.map(k=>{
    const P = POLICIES[k];
    const can = G.res.pol>=P.cost;
    return `<div class="polCard" data-k="${k}" style="${can?"":"opacity:.45"}">
      <div class="pn">${P.name}</div><div class="pd">${P.desc}</div>
      <div class="pc">政治 ${P.cost}${can?"":"（不足）"}</div></div>`;
  }).join("");
  Modal({
    title:"政 策 三 选 一", sub:"根据地建设方向 · 选定即生效（所见即所得）",
    body:`<div class="polRow">${cards}</div>`,
    btns:[{ t:"稍后再定", cls:"", fn:()=>CloseModal() }]
  });
  setTimeout(()=>{
    document.querySelectorAll(".polCard").forEach(el=>{
      el.onclick = ()=>PickPolicy(el.dataset.k);
    });
  },0);
}
function ShowMissionModal(){
  const rows = G.missions.map(m=>{
    const st = m.done?'<span class="gd">✔ 完成</span>':m.fail?'<span class="rd">✘ 过期</span>':(m.from&&G.turn<m.from?`<span style="color:#8a765a">未开启</span>`:'<span class="hl">进行中</span>');
    return `<p>${st}【${m.name}】${m.desc}</p>`;
  }).join("");
  Modal({ title:"总部任务", sub:"完成即时兑奖", body:rows });
}

/* ── 24. 提示 ────────────────────────────────────────────────────── */
const HINTS = [
  null,
  { text:"点一支<b>部队</b>（地图上或左侧名册）。", sel:"#roster" },
  { text:"蓝格=本月可到，<b>红圈=可以打</b>。悬停敌人看战报——去把家门口那座炮楼干了！", sel:"#cv" },
  { text:"让<b>工作队</b>走进村庄，点【发动群众】——根据地就是这么一格格开出来的。", sel:"#actWrap" },
  { text:"都安排完就点<b>【下一回合】</b>，看日军怎么动。它敢进山，你就伏击它。", sel:"#btnNext" }
];
function SetHint(step){
  G.hintStep = step;
  const el = $("hint"); if(!el) return;
  const h = HINTS[step];
  if(!h){ el.style.display="none"; return; }
  el.innerHTML = h.text;
  el.style.display = "block";
  const anchor = document.querySelector(h.sel);
  if(anchor){
    const r = anchor.getBoundingClientRect();
    el.style.left = Math.max(8, Math.min(window.innerWidth-276, r.left))+"px";
    el.style.top  = Math.max(52, r.top - el.offsetHeight - 12)+"px";
  }
}

/* ── 25. 说明 / 标题 ─────────────────────────────────────────────── */
function Brief(){
  Modal({
    title:"敌 后 · 1939—1945", sub:"华北敌后战场 · 一回合一个月 · 80回合打完八年",
    body:`
      <p><span class="hl">你是敌后军区的指挥员。</span>日军握着铁路、县城和炮楼（点线），你有山、村庄和人民（面）。
      八年里把根据地从三个村发展成半壁河山——胜负在1945年8月结算。</p>
      <div class="rule"></div>
      <p style="font-size:12.5px;line-height:2">
      <span class="hl">操作＝文明</span>：点部队亮蓝格移动；红圈敌人悬停看战报、点击就打；右下【下一回合】。<br>
      <span class="hl">根据地</span>：工作队进村【发动群众】三级：组织→根据地村(出粮出兵)→堡垒村(能招兵有民兵)。<br>
      <span class="hl">缴获养兵</span>：军械几乎全靠打——歼灭巡逻队、拔炮楼、缴县城。没有枪没有炮，敌人给我们造。<br>
      <span class="rd">警备度</span>：破袭杀敌都涨，满了招来<span class="rd">大扫荡</span>（提前两月预警，红箭头指向目标）。
      扫荡的兵是从据点抽的——<span class="hl">敌进我进</span>，趁虚拔点破路！<br>
      <span class="hl">政策三选一</span>：减租减息/地雷战/地道战/精兵简政……攒政治点开一张，立即生效。<br>
      <span class="hl">时代</span>：40年百团大战窗口 → 41-42最困难(蚕食修炮楼+大扫荡) → 43恢复 → 44末战略反攻夺县城。</p>
      <p style="color:#9a8a62;font-size:12px">评级看：歼敌、拔点、光复县城、铁路瘫痪、根据地村数。根据地不足8村，评级封顶C——中心任务不是打仗，是建根据地。</p>`,
    btns:[{ t:"出 发", cls:"pri", fn:()=>{ CloseModal(); if(G.turn===1) SetHint(1); } }]
  });
}
function Title(){
  const hasSave = HasSave();
  const btns = [];
  if(hasSave) btns.push({ t:"继续战局", cls:"pri", fn:()=>{ CloseModal(); if(!LoadGame()){ Toast("存档损坏，已开新局"); NewGame((Math.random()*1e9)|0); } Sync(); } });
  btns.push({ t: hasSave?"新战役":"开始战役", cls: hasSave?"":"pri", fn:()=>{ CloseModal(); NewGame((Math.random()*1e9)|0); Sync(); Brief(); } });
  btns.push({ t:"玩法说明", cls:"", fn:()=>Brief() });
  Modal({
    title:"敌 后 · 1939—1945", sub:"华北敌后战场 类4X · 玩法白盒",
    body:`<p>正太路的火车还在跑，平汉线的炮楼一眼望不到头。<br>
      你手里有三个村、两支队伍、一支工作队。<br>
      八年之后，这片土地是谁的？</p>
      <p style="color:#9a8a62;font-size:12px">自动存档每月一次，关掉页面随时回来。40-60分钟一局。</p>`,
    btns
  });
}

/* ── 26. 启动 ────────────────────────────────────────────────────── */
function Boot(){
  if(!cv) return;
  NewGame((Math.random()*1e9)|0);
  FitView(); Sync();
  cv.addEventListener("pointerdown", OnDown);
  cv.addEventListener("pointermove", OnMove);
  cv.addEventListener("pointerup", OnUp);
  cv.addEventListener("pointercancel", ()=>{ ptr.down=false; });
  cv.addEventListener("click", OnClickFallback);
  cv.addEventListener("wheel", OnWheel, { passive:false });
  cv.addEventListener("pointerleave", ()=>{ hoverHex=null; const el=$("tip"); if(el) el.style.display="none"; HideForecastCard(); });
  window.addEventListener("resize", ()=>{ FitView(); SetHint(G.hintStep); });
  $("btnNext").onclick = ()=>{
    if(G.phase!=="player" || G.over) return;
    const now = Date.now();
    const idle = G.units.some(u=>!u.acted && u.mp>0);
    if(idle && now-G.lastNextTs>1400){ G.lastNextTs = now; CycleIdle(); Sync(); return; }
    G.lastNextTs = now;
    if(G.hintStep===4) SetHint(0);
    EndTurn();
  };
  $("btnPolicy").onclick = ()=>ShowPolicyModal();
  $("btnMission").onclick = ()=>ShowMissionModal();
  $("btnHelp").onclick = ()=>Brief();
  window.addEventListener("keydown",(e)=>{
    if(e.key===" "){ e.preventDefault(); $("btnNext").click(); }
    else if(e.key==="Tab"){ e.preventDefault(); CycleIdle(); }
    else if(e.key==="Escape"){ recruitMode=null; SEL=null; RefreshOrders(); Sync(); }
    else if((e.key==="f"||e.key==="F") && SEL && !SEL.acted){ DoRest(SEL); }
  });
  requestAnimationFrame(Render);
  Title();
}

/* 测试钩子 */
window.DH = {
  G, CFG, UNITS, EUNITS, TERR, FORTS, POLICIES, ERAS,
  NewGame, LoadGame, SaveGame, HasSave, EndTurn, EnemyPhase, Resolution, ScorePts,
  Reachable, RefreshOrders, ComputeAttack, DoMove, DoAttack, Forecast,
  DoOrganize, DoSabotage, DoRest, DoFlip, FlipTargets, CanOrganize, CanSabotage,
  StartRecruit, PlaceRecruit, RecruitSpots, RecruitTypes, CanAfford,
  PickPolicy, MaybeOffer, AvailPolicies, TickMissions, ActiveMission,
  Income, OrgVills, CurEra, DateStr, EraEvents, SweepTick, LaunchSweep,
  ComputeVision, EnemyVisible, UnitAt, EnemyAt, tileAt, MkUnit, MkEnemy,
  hexToPix, pixToHex, hexDist, K, T, NB, EndGame, Defeat,
  SelectUnit, TapHex, HexAt, Sync, FitView, CenterOn, Title, Brief,
  get SEL(){ return SEL; }, set SEL(v){ SEL=v; },
  get REACH(){ return REACH; },
  get ATK(){ return ATK; },
  get recruitMode(){ return recruitMode; }, set recruitMode(v){ recruitMode=v; },
  get view(){ return view; },
  setSkipAnim(v){ skipAll=!!v; fastAnim=!!v; },
  setMuted(v){ muted=!!v; }
};

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", Boot);
else Boot();
</script>
