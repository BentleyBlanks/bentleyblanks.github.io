<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>夜袭 · 正太路 — 太行 1941</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:#171310;color:#e6d9b8;
  font-family:"Noto Serif SC","Songti SC",system-ui,serif;
  font-size:14px;user-select:none;
}
button{font-family:inherit;cursor:pointer}
.hidden{display:none !important}

#cv{position:absolute;inset:0;display:block;touch-action:none}

/* ── 顶栏 ─────────────────────────────────────── */
#top{
  position:fixed;top:0;left:0;right:0;height:46px;z-index:12;
  display:flex;align-items:center;gap:14px;padding:0 12px;
  background:linear-gradient(180deg,rgba(24,19,14,.96),rgba(24,19,14,.80));
  border-bottom:1px solid #4a3c26;backdrop-filter:blur(3px);
}
#dayBox{display:flex;align-items:baseline;gap:7px;min-width:118px}
#dayNum{font-size:19px;color:#f0dfae;letter-spacing:.5px}
#phaseTag{font-size:12px;padding:1px 7px;border-radius:3px;border:1px solid}
.ph-night{color:#9fc4e8;border-color:#3f5f80;background:#1b2534}
.ph-day{color:#f0c46a;border-color:#7d5c24;background:#332711}

.stat{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#bda87e;white-space:nowrap}
.stat b{color:#f2e3ba;font-size:15px;font-weight:600}
.bar{width:74px;height:7px;border:1px solid #5a4a2c;border-radius:2px;overflow:hidden;background:#221b12}
.bar i{display:block;height:100%;transition:width .35s}
#expFill{background:linear-gradient(90deg,#8d5f2a,#d4562f)}
#railFill{background:linear-gradient(90deg,#6b8f4a,#a8cf5e)}
#top .grow{flex:1}
.tbtn{
  background:#2c2416;border:1px solid #6d5730;color:#e8d5a6;
  border-radius:5px;padding:6px 11px;font-size:13px;transition:.15s
}
.tbtn:hover{background:#3b3120;border-color:#9a7a3e}
.tbtn.on{background:#33401f;border-color:#7fa544;color:#cfe89a}
#btnDawn{
  background:linear-gradient(180deg,#7d2f22,#5a2016);border-color:#b6512f;
  color:#ffe9c8;font-size:14px;padding:7px 16px;letter-spacing:2px;font-weight:600;
  box-shadow:0 0 0 0 rgba(214,110,60,.55)
}
#btnDawn:hover{background:linear-gradient(180deg,#94382a,#6d281a)}
#btnDawn.urge{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,110,60,.5)}70%{box-shadow:0 0 0 9px rgba(214,110,60,0)}100%{box-shadow:0 0 0 0 rgba(214,110,60,0)}}

/* ── 左侧队伍列表 ─────────────────────────────── */
#roster{
  position:fixed;left:8px;top:54px;z-index:11;width:176px;
  display:flex;flex-direction:column;gap:5px
}
.ucard{
  background:linear-gradient(180deg,rgba(38,31,21,.95),rgba(28,23,16,.95));
  border:1px solid #4e4028;border-left:3px solid #8d3a2c;
  border-radius:4px;padding:5px 8px;cursor:pointer;transition:.13s;position:relative;overflow:hidden
}
.ucard:hover{border-color:#8a7040;transform:translateX(2px)}
.ucard.sel{border-color:#d9a441;background:linear-gradient(180deg,rgba(66,52,28,.97),rgba(44,35,22,.97));box-shadow:0 0 10px rgba(217,164,65,.25)}
.ucard.spent{opacity:.5}
.ucard.dead{opacity:.32;border-left-color:#4a4a4a;cursor:default}
.ucard .un{font-size:13px;color:#f0e0b6;display:flex;justify-content:space-between;align-items:baseline}
.ucard .un em{font-style:normal;font-size:10.5px;color:#9e8c62}
.ucard .um{font-size:11px;color:#a89772;margin-top:2px;display:flex;gap:8px}
.ucard .um s{text-decoration:none;color:#d8b168}
.hpbar{height:4px;background:#2a2117;border-radius:2px;margin-top:3px;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#a03528,#d06a3a)}
.ucard .flag{position:absolute;right:4px;top:16px;font-size:10px;color:#7fc46a}

/* ── 底部行动条 ───────────────────────────────── */
#bottom{
  position:fixed;left:8px;right:8px;bottom:8px;z-index:11;
  display:flex;gap:8px;align-items:flex-end;pointer-events:none
}
#actWrap{
  pointer-events:auto;flex:1;min-height:52px;
  background:linear-gradient(180deg,rgba(30,25,17,.93),rgba(22,18,12,.95));
  border:1px solid #4e4028;border-radius:5px;padding:7px 9px
}
#actTitle{font-size:12px;color:#bda87e;margin-bottom:5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#actTitle b{color:#f0e0b6;font-size:13.5px}
#actTitle .cover{padding:1px 6px;border-radius:3px;font-size:11px;border:1px solid}
.cov-safe{color:#a4d68a;border-color:#4d7a38;background:#1e2a17}
.cov-risk{color:#e8a07a;border-color:#8a4a2c;background:#2e1c12}
#acts{display:flex;gap:6px;flex-wrap:wrap}
.abtn{
  background:#33291a;border:1px solid #7a6134;color:#f0dcae;border-radius:4px;
  padding:6px 12px;font-size:13px;transition:.13s;position:relative
}
.abtn:hover{background:#4a3b22;border-color:#c09a4c;transform:translateY(-1px)}
.abtn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.abtn .cost{font-size:10.5px;color:#c08a5a;margin-left:5px}
.abtn.hot{border-color:#c4552e;background:#42221a;color:#ffd6ae}
.abtn.gold{border-color:#c99a3a;background:#3d3116}
#logBox{
  pointer-events:auto;width:290px;max-height:132px;overflow:hidden;
  background:linear-gradient(180deg,rgba(22,18,12,.90),rgba(18,15,10,.94));
  border:1px solid #43371f;border-radius:5px;padding:6px 9px;font-size:11.5px;line-height:1.65;color:#b0a07c
}
#logBox div{opacity:.55}
#logBox div:last-child{opacity:1;color:#e3d3a6}
.lg-good{color:#a8d47e !important}
.lg-bad{color:#e08a6a !important}
.lg-key{color:#f0c860 !important}

/* ── 弹层 ─────────────────────────────────────── */
.modal{
  position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:rgba(10,8,5,.72);backdrop-filter:blur(2px);padding:16px
}
.mbox{
  width:min(560px,94vw);max-height:88vh;overflow-y:auto;
  background:linear-gradient(175deg,#2b2317,#1e180f);
  border:1px solid #6d5730;border-radius:7px;padding:22px 26px;
  box-shadow:0 14px 50px rgba(0,0,0,.7)
}
.mbox h2{font-size:21px;color:#f2dda6;letter-spacing:3px;margin-bottom:4px;font-weight:600}
.mbox h3{font-size:13px;color:#a08c5e;letter-spacing:1px;margin-bottom:16px;font-weight:400}
.mbox p{font-size:13.5px;line-height:1.95;color:#c9b98e;margin-bottom:11px}
.mbox .hl{color:#f0c860}
.mbox .rd{color:#e08a6a}
.rule{border-top:1px solid #4a3c26;margin:16px 0}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mbtn{
  background:#3a2f1c;border:1px solid #8a6f38;color:#f0dcae;border-radius:5px;
  padding:9px 20px;font-size:14px;letter-spacing:1px
}
.mbtn:hover{background:#4d3e24;border-color:#c09a4c}
.mbtn.pri{background:linear-gradient(180deg,#7d2f22,#5a2016);border-color:#b6512f;color:#ffe9c8}
.mbtn.pri:hover{background:linear-gradient(180deg,#94382a,#6d281a)}

/* 战斗预览 */
.fc{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:14px 0}
.fcSide{background:rgba(0,0,0,.25);border:1px solid #4a3c26;border-radius:5px;padding:10px 12px}
.fcSide .nm{font-size:14px;color:#f0e0b6;margin-bottom:5px}
.fcSide .vl{font-size:26px;color:#e8b04a;line-height:1.1}
.fcSide .sb{font-size:11px;color:#9a8a62;margin-top:3px;line-height:1.6}
.fcVs{font-size:13px;color:#8a765a;letter-spacing:2px}
.odds{text-align:center;margin:14px 0 6px}
.odds .big{font-size:38px;letter-spacing:1px}
.odds .lb{font-size:11.5px;color:#9a8a62;letter-spacing:2px}
.oGood{color:#9fd47a}.oMid{color:#e8c04a}.oBad{color:#e07a5a}
.oddsBar{height:9px;border:1px solid #5a4a2c;border-radius:2px;overflow:hidden;background:#241d13;margin:8px auto;width:78%}
.oddsBar i{display:block;height:100%;background:linear-gradient(90deg,#7d3020,#c4713a,#9fd47a)}
.fcList{font-size:12.5px;color:#b5a37a;line-height:2.05;margin-top:10px;border-top:1px solid #40331e;padding-top:9px}
.fcList span{color:#f0c860}

/* 结算 */
.grade{font-size:76px;line-height:1;text-align:center;letter-spacing:4px;margin:6px 0 2px}
.gS{color:#ffd95e;text-shadow:0 0 24px rgba(255,217,94,.5)}
.gA{color:#a8d47e}.gB{color:#8fb4d8}.gC{color:#c0a878}.gD{color:#a07868}
.stats{display:grid;grid-template-columns:1fr auto;gap:3px 14px;font-size:13px;margin:14px 0;color:#b5a37a}
.stats b{color:#f0dcae;text-align:right;font-weight:500}
.martyr{border-top:1px solid #4a3c26;margin-top:14px;padding-top:11px;font-size:12.5px;color:#9a8a62;line-height:1.95}
.martyr .mn{color:#d8b8a0}

/* 横幅 */
#banner{
  position:fixed;left:0;right:0;top:38%;z-index:25;text-align:center;pointer-events:none;
  opacity:0;transition:opacity .3s
}
#banner.show{opacity:1}
#banner .bt{
  display:inline-block;padding:12px 46px;font-size:34px;letter-spacing:14px;
  border-top:2px solid;border-bottom:2px solid;
  text-shadow:0 3px 18px rgba(0,0,0,.85)
}
#banner .bs{display:block;font-size:13px;letter-spacing:5px;margin-top:9px;opacity:.85}

/* 提示气泡 */
#hint{
  position:fixed;z-index:20;max-width:250px;padding:9px 13px;font-size:12.5px;line-height:1.75;
  background:linear-gradient(180deg,#4a3a1c,#332714);border:1px solid #c09a4c;border-radius:5px;
  color:#ffe9b8;box-shadow:0 5px 20px rgba(0,0,0,.6);pointer-events:none;display:none
}
#hint b{color:#ffd05e}
#hint:after{content:"";position:absolute;left:22px;bottom:-7px;border:7px solid transparent;border-top-color:#c09a4c;border-bottom:0}

/* 悬停信息 */
#tip{
  position:fixed;z-index:19;padding:7px 11px;font-size:12px;line-height:1.7;display:none;
  background:rgba(26,21,14,.97);border:1px solid #6d5730;border-radius:4px;color:#d8c8a0;
  pointer-events:none;max-width:230px;box-shadow:0 5px 18px rgba(0,0,0,.6)
}
#tip .th{color:#f0dcae;font-size:13px}
#tip .ty{color:#c09a4c}
#tip .tw{color:#e08a6a}

#toast{
  position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:26;
  padding:8px 18px;background:rgba(60,26,18,.95);border:1px solid #b6512f;border-radius:4px;
  color:#ffd8b8;font-size:13px;display:none;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.5)
}

@media (max-width:760px){
  #top{height:auto;flex-wrap:wrap;padding:5px 8px;gap:7px 10px}
  #dayBox{min-width:auto}
  .stat{font-size:11.5px}
  .bar{width:52px}
  #roster{width:130px;top:auto;bottom:96px;left:6px;max-height:44vh;overflow-y:auto}
  .ucard{padding:4px 6px}
  .ucard .un{font-size:12px}
  #logBox{display:none}
  #bottom{left:6px;right:6px;bottom:6px}
  .mbox{padding:18px 16px}
  .grade{font-size:58px}
  #banner .bt{font-size:24px;letter-spacing:8px;padding:9px 24px}
}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="top">
  <div id="dayBox"><span id="dayNum">第 1 夜</span><span id="phaseTag" class="ph-night">夜</span></div>
  <div class="stat" title="累计中断行车（每夜结算被破坏的路段数）">正太路
    <div class="bar"><i id="railFill" style="width:0%"></i></div><b id="railVal">0</b></div>
  <div class="stat" title="日军对你的注意程度，满 100 触发扫荡">暴露
    <div class="bar"><i id="expFill" style="width:0%"></i></div><b id="expVal">0</b></div>
  <div class="stat" title="弹药：战斗与破袭的硬通货">弹药 <b id="ammoVal">0</b></div>
  <div class="stat" title="民心：村庄产出与征兵的根">民心 <b id="heartVal">0</b></div>
  <div class="grow"></div>
  <button class="tbtn" id="btnCover" title="标出天亮时会暴露的格子">隐蔽图</button>
  <button class="tbtn" id="btnHelp">说明</button>
  <button class="tbtn" id="btnDawn">天 亮</button>
</div>

<div id="roster"></div>

<div id="bottom">
  <div id="actWrap">
    <div id="actTitle">— 点左侧队伍，或直接点地图上的红色部队 —</div>
    <div id="acts"></div>
  </div>
  <div id="logBox"></div>
</div>

<div id="banner"><span class="bt" id="bannerT"></span><span class="bs" id="bannerS"></span></div>
<div id="hint"></div>
<div id="tip"></div>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* =====================================================================
   夜袭 · 正太路 —— 太行 1941
   非对称根据地作战白盒 Demo（单文件 / 零外部依赖 / 程序化 Canvas）

   设计三支柱：
     1) 主动权 —— 打不打由你选。弹药有限，战斗前必给预览，决策在开火之前。
     2) 根据地循环 —— 扩张自带惩罚。暴露度是一本明账，满则招来扫荡。
     3) 面孔与代价 —— 队伍具名、可永久失去，阵亡进烈士名单。

   核心节奏：夜里出击，天亮前回家。
   ===================================================================== */

/* ── 0. 配置 ───────────────────────────────────────────────────────── */
const CFG = {
  totalTurns: 16,
  mapW: 14, mapH: 9,
  railRow: 6,               // 铁路所在行
  startAmmo: 26, startHeart: 45,
  expSab: 4, expAssaultFort: 12, expAssaultStation: 16, expAssaultColumn: 6,
  expMassWork: 2, expTurncoat: 1, expCaught: 8, expDecay: 3,
  // 扫荡是本作的压力心跳，必须在 16 天里真的打得到玩家身上：
  // 阈值定在 55，激进的玩家(每夜 3-4 次破袭)第 6-8 天就会招来第一次，
  // 缩着不动的玩家可以躲掉，但也拿不到分 —— 这就是代价本身。
  sweepThreshold: 55, sweepWarn: 2, sweepDuration: 4, sweepResetExp: 15,
  nightBonus: 1.45,
  saveKey: "nightraid_v1"
};

/* 机动力必须撑得起一个完整的"下山→动手→回山"往返：
   跳板带(丘陵/林地) → 铁路 1 点 → 动手 1 点 → 退回跳板 2 点 = 4 点。
   低于这个数，破袭专业户就永远只能有去无回。 */
const ROLES = {
  main:     { label:"主力营", mp:5, atk:1.00, sab:1.0, mass:1.0, alwaysHidden:false, color:"#a4322a" },
  recon:    { label:"特务连", mp:7, atk:0.72, sab:1.0, mass:1.0, alwaysHidden:false, color:"#b2543a" },
  sapper:   { label:"工兵排", mp:5, atk:0.38, sab:2.2, mass:1.0, alwaysHidden:false, color:"#8a6a2c" },
  workteam: { label:"武工队", mp:6, atk:0.34, sab:1.0, mass:2.2, alwaysHidden:true,  color:"#6d4a7a" }
};

const TERR = {
  mountain:{ name:"山地", cost:3, hide:true,  fill:"#a89578", ink:"#5e5240" },
  hill:    { name:"丘陵", cost:2, hide:true,  fill:"#c2b189", ink:"#6d6046" },
  forest:  { name:"林地", cost:2, hide:true,  fill:"#94a473", ink:"#4f5c3a" },
  plain:   { name:"平原", cost:1, hide:false, fill:"#ddd0a6", ink:"#7a6d4c" },
  water:   { name:"河流", cost:-1,hide:false, fill:"#7d99a6", ink:"#4d6672" }
};

const FORTS = {
  block:  { name:"碉堡",   mult:1.55, base:22, loot:9,  score:14 },
  strong: { name:"据点",   mult:1.90, base:34, loot:14, score:26 },
  station:{ name:"车站",   mult:2.15, base:46, loot:22, score:40 },
  bridge: { name:"铁桥",   mult:1.40, base:20, loot:8,  score:52 }
};

/* ── 1. 确定性随机 ─────────────────────────────────────────────────── */
function Imul32(a,b){ return Math.imul(a,b)|0; }
function Mulberry32(seed){
  let t = seed >>> 0;
  return function(){
    t = (t + 0x6D2B79F5) >>> 0;
    let x = t;
    x = Imul32(x ^ (x >>> 15), x | 1);
    x ^= x + Imul32(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
let RND = Mulberry32(1);
const rnd  = ()=>RND();
const rint = (a,b)=>a + Math.floor(RND()*(b-a+1));
const rpick= (arr)=>arr[Math.floor(RND()*arr.length)];
const rvar = (lo,hi)=>lo + RND()*(hi-lo);

/* ── 2. 六边形数学（pointy-top 轴向坐标） ───────────────────────────── */
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const K  = (q,r)=>q+","+r;
const T  = (q,r)=>G.map.get(K(q,r));
const NB = (q,r)=>DIRS.map(d=>[q+d[0], r+d[1]]);
function hexDist(aq,ar,bq,br){
  return Math.max(Math.abs(aq-bq), Math.abs(ar-br), Math.abs((-aq-ar)-(-bq-br)));
}
function hexToPix(q,r,s){ return { x:s*Math.sqrt(3)*(q + r/2), y:s*1.5*r }; }
function pixToHex(x,y,s){
  const fq = (Math.sqrt(3)/3*x - y/3)/s;
  const fr = (2/3*y)/s;
  let s3 = -fq-fr;
  let rq=Math.round(fq), rr=Math.round(fr), rs=Math.round(s3);
  const dq=Math.abs(rq-fq), dr=Math.abs(rr-fr), ds=Math.abs(rs-s3);
  if(dq>dr && dq>ds) rq = -rr-rs; else if(dr>ds) rr = -rq-rs;
  return {q:rq, r:rr};
}
const offToAxial = (col,row)=>({ q: col - ((row - (row&1))>>1), r: row });

/* ── 3. 游戏状态 ───────────────────────────────────────────────────── */
const G = {
  seed:1, turn:1, phase:"night", map:new Map(), tiles:[],
  units:[], columns:[], forts:[],
  ammo:0, heart:0, exposure:0,
  sweep:{ state:"none", timer:0, from:null, target:null, drained:[] },
  score:{ railDays:0, forts:0, fortScore:0, villagesSaved:0, sabCount:0 },
  martyrs:[], log:[], colSeq:0,
  over:false, busy:false, hintStep:0, started:false
};
let SEL = null;          // 选中的单位
let REACH = null;        // {cost:Map, prev:Map}
let coverMode = false;
let hoverHex = null;

const VILL_NAMES = ["王家峪","砖壁","麻田","云头底","石拐","下武村","蟠龙","关家垴","西营","窑上","黄崖洞","苏亭"];
const UNIT_DEFS = [
  { name:"一营",   cmd:"赵大川", role:"main",     str:100 },
  { name:"三营",   cmd:"李振海", role:"main",     str:88  },
  { name:"特务连", cmd:"孙铁头", role:"recon",    str:52  },
  { name:"工兵排", cmd:"陈石匠", role:"sapper",   str:32  },
  { name:"武工队", cmd:"韩秀英", role:"workteam", str:26  }
];

/* ── 4. 地图生成 ───────────────────────────────────────────────────── */
/* 地理即玩法：山在北（你的根据地，隐蔽），铁路在南（日军的动脉，暴露）。
   你从山上下来打路，天亮前必须回山。 */
function GenMap(){
  G.map.clear(); G.tiles.length = 0; G.forts.length = 0;
  const W = CFG.mapW, H = CFG.mapH, RR = CFG.railRow;
  const riverCol = 7;

  for(let row=0; row<H; row++){
    for(let col=0; col<W; col++){
      const { q,r } = offToAxial(col,row);
      /* 地形分带即节奏设计：
         0-1 深山（后方） · 2-3 根据地 · 4-5 跳板带（保证有隐蔽） · 6 铁路谷地 · 7-8 敌占平原 */
      let terr;
      if(row <= 1)        terr = rnd()<0.80 ? "mountain" : "hill";
      else if(row <= 3)   terr = rnd()<0.46 ? "mountain" : (rnd()<0.55 ? "hill" : "forest");
      else if(row <= RR-1) terr = rnd()<0.48 ? "forest" : "hill";   // 跳板带：一律藏得住人
      else                terr = rnd()<0.86 ? "plain" : "hill";

      // 河：自北向南蜿蜒，在铁路处架桥
      const meander = Math.round(Math.sin(row*0.85)*1.15);
      const isRiver = (col === riverCol + meander) && row >= 2 && row !== RR;
      if(isRiver) terr = "water";

      const t = {
        q, r, col, row, terr,
        rail: row === RR, railBroken: 0, railWreck: false,
        road: false, vill: null, fort: null,
        burn: 0, wob: Math.floor(rnd()*1e6)
      };
      G.map.set(K(q,r), t); G.tiles.push(t);
    }
  }

  // 公路：铁路南侧一行贯通 + 三条向北伸进山区的"囚笼触手"
  for(let col=0; col<W; col++) tileAt(col, RR+1).road = true;
  for(const c of [2,7,11]) for(let row=RR; row>=3; row--){
    const t = tileAt(c,row); if(t.terr !== "water") t.road = true;
  }
  for(let col=0; col<W; col++) tileAt(col, RR).road = true;

  // 日军设施
  const place = (col,row,type,extra)=>{
    const t = tileAt(col,row); if(!t) return null;
    if(t.terr === "water") t.terr = "plain";
    const d = FORTS[type];
    t.fort = Object.assign({
      type, name:"", garrison:d.base + rint(-4,6), max:0, alert:0, puppet:false, id:G.forts.length
    }, extra||{});
    t.fort.max = t.fort.garrison;
    t.vill = null;
    G.forts.push(t);
    return t;
  };
  place(1,  RR, "block",   { name:"乱柳碉堡" });
  place(4,  RR, "strong",  { name:"寿阳据点" });
  place(riverCol + Math.round(Math.sin(RR*0.85)*1.15), RR, "bridge", { name:"洺水铁桥" });
  place(10, RR, "station", { name:"阳泉车站" });
  place(13, RR, "block",   { name:"测鱼碉堡" });
  place(2,  RR-2,"strong", { name:"落魔寺据点", puppet:true, garrison:26 });  // 伸进跳板带的囚笼触手
  place(11, RR-3,"strong", { name:"张庄据点" });
  place(7,  RR+1,"block",  { name:"路南岗楼" });
  for(const f of G.forts) f.fort.max = f.fort.garrison;

  /* 可玩性保证（不能交给概率）：每段无设施的铁路，北侧一格之内必须留一处藏得住人的地方。
     否则这一段的"夜出昼归"根本走不通 —— 玩家会以为是自己不会玩。
     必须放在据点落位之后跑，因为隐蔽判定要看据点邻接。 */
  for(const t of G.tiles){
    if(!t.rail || t.fort) continue;
    const nbs = NB(t.q,t.r).map(([q,r])=>T(q,r)).filter(Boolean);
    if(nbs.some(n => IsConcealed(n, null))) continue;
    const cand = nbs.filter(n => n.row < t.row && !n.fort && !n.rail && !n.road && n.terr !== "water");
    if(cand.length) cand[0].terr = "forest";
  }

  // 村庄：山区与过渡带，尽量不挨着据点
  const names = VILL_NAMES.slice(); let vi = 0;
  const cand = G.tiles.filter(t =>
    t.row >= 1 && t.row <= RR-1 && t.terr !== "water" && !t.fort &&
    !NB(t.q,t.r).some(([q,r]) => T(q,r) && T(q,r).fort));
  for(let i=cand.length-1; i>0; i--){ const j=Math.floor(rnd()*(i+1)); [cand[i],cand[j]]=[cand[j],cand[i]]; }
  const chosen = [];
  for(const t of cand){
    if(chosen.length >= 8) break;
    if(chosen.some(c => hexDist(c.q,c.r,t.q,t.r) < 2)) continue;
    t.vill = { name:names[vi++ % names.length], side:"neutral", pop:rint(2,4), base:false, worked:false };
    if(t.terr === "water") t.terr = "hill";
    chosen.push(t);
  }
  // 总部村：挑最靠前的那个（离铁路 2-3 格），让玩家第一夜就能下手，不必先跋涉三天
  chosen.sort((a,b)=> b.row - a.row);
  const hq = chosen.find(t => t.row <= RR-2) || chosen[0];
  hq.vill.side = "ours"; hq.vill.base = true; hq.vill.name = "王家峪";
  return hq;
}
function tileAt(col,row){ const {q,r} = offToAxial(col,row); return T(q,r); }

/* ── 5. 开局 ───────────────────────────────────────────────────────── */
function NewGame(seed){
  G.seed = seed>>>0 || 1;
  RND = Mulberry32(G.seed);
  G.turn = 1; G.phase = "night"; G.over = false; G.busy = false;
  G.units.length = 0; G.columns.length = 0; G.martyrs.length = 0; G.log.length = 0;
  G.ammo = CFG.startAmmo; G.heart = CFG.startHeart; G.exposure = 0; G.colSeq = 0;
  G.sweep = { state:"none", timer:0, from:null, target:null, drained:[] };
  G.score = { railDays:0, forts:0, fortScore:0, villagesSaved:0, sabCount:0 };
  G.hintStep = 0;

  const hq = GenMap();

  // 部队全部落在总部村周围的可通行格；找不到空位就放同格（绝不静默丢单位）
  const spots = SpawnSpots(hq, UNIT_DEFS.length);
  UNIT_DEFS.forEach((d,i)=>{
    const sp = spots[i] || hq;
    G.units.push({
      id:i, name:d.name, cmd:d.cmd, role:d.role,
      q:sp.q, r:sp.r, str:d.str, maxStr:d.str,
      mp:ROLES[d.role].mp, maxMp:ROLES[d.role].mp,
      exp:0, ambush:false, alive:true, dug:false, ax:0, ay:0
    });
  });

  SpawnPatrol(3, CFG.railRow+1, 20);
  SpawnPatrol(9, CFG.railRow+1, 22);

  SEL = G.units[0]; RefreshReach();
  Log("八路军 XXX 团进入正太路北侧山地。任务：瘫痪铁路，保住根据地。", "key");
  G.started = true;
  return hq;
}
/* 起始布点：BFS 向外找可通行空格，保证每支队伍都真的落地 */
function SpawnSpots(center, n){
  const out = [], seen = new Set([K(center.q,center.r)]);
  const queue = [center]; out.push(center);
  while(queue.length && out.length < n){
    const cur = queue.shift();
    for(const [q,r] of NB(cur.q,cur.r)){
      const t = T(q,r); if(!t) continue;
      const kk = K(q,r); if(seen.has(kk)) continue;
      seen.add(kk);
      if(t.terr === "water" || t.fort) continue;
      out.push(t); queue.push(t);
      if(out.length >= n) break;
    }
  }
  return out;
}
function SpawnPatrol(col,row,str){
  const t = tileAt(col,row); if(!t) return;
  const route = G.tiles.filter(x => x.road && x.row === row).sort((a,b)=>a.col-b.col);
  G.columns.push({
    id:"p"+(G.colSeq++), q:t.q, r:t.r, str, max:str, kind:"patrol",
    name:"巡逻队", route, ri:Math.max(0, route.findIndex(x=>x===t)), dir:1, path:null, ax:0, ay:0
  });
}

/* ── 6. 隐蔽与移动 ─────────────────────────────────────────────────── */
/* 天亮判定：这一格藏得住人吗？——玩家在地图上必须能一眼看出来。 */
function IsConcealed(t, unit){
  if(!t) return false;
  if(unit && ROLES[unit.role].alwaysHidden) return true;       // 武工队着便衣
  if(unit && unit.ambush) return true;                         // 设伏即隐蔽
  if(t.vill && t.vill.side === "ours" && !t.burn) return true; // 堡垒村有地道
  if(t.fort) return false;
  if(t.rail || t.road) return false;                           // 路上就是靶子
  if(!TERR[t.terr].hide) return false;
  // 据点眼皮底下：山地林地这种实打实的遮蔽仍藏得住，光秃秃的丘陵藏不住
  if(t.terr === "hill" && NB(t.q,t.r).some(([q,r]) => { const n = T(q,r); return n && n.fort; })) return false;
  return true;
}
function MoveCost(unit, from, to){
  if(!to) return -1;
  if(to.terr === "water") return -1;
  if(to.fort) return -1;                                       // 据点要打，不能走进去
  if(G.columns.some(c => c.q===to.q && c.r===to.r)) return -1;
  let c = TERR[to.terr].cost;
  if(from.road && to.road) c = 1;                              // 沿路快，但天亮暴露
  if(to.vill) c = 1;
  return c;
}
function Reachable(unit){
  const cost = new Map([[K(unit.q,unit.r), 0]]), prev = new Map();
  const open = [[0, unit.q, unit.r]];
  while(open.length){
    open.sort((a,b)=>a[0]-b[0]);
    const [c,q,r] = open.shift();
    if(c > (cost.get(K(q,r)) ?? Infinity)) continue;
    const from = T(q,r);
    for(const [nq,nr] of NB(q,r)){
      const to = T(nq,nr); if(!to) continue;
      const mc = MoveCost(unit, from, to); if(mc < 0) continue;
      const nc = c + mc; if(nc > unit.mp) continue;
      if(nc < (cost.get(K(nq,nr)) ?? Infinity)){
        cost.set(K(nq,nr), nc); prev.set(K(nq,nr), K(q,r));
        open.push([nc,nq,nr]);
      }
    }
  }
  cost.delete(K(unit.q,unit.r));
  return { cost, prev };
}
function RefreshReach(){
  REACH = (SEL && SEL.alive && !SEL.ambush && SEL.mp > 0 && !G.over && G.phase === "night")
    ? Reachable(SEL) : null;
}
function DoMove(unit, tq, tr){
  if(!REACH) return false;
  const kk = K(tq,tr);
  if(!REACH.cost.has(kk)) return false;
  const spent = REACH.cost.get(kk);
  const px = hexToPix(unit.q, unit.r, view.s), nx = hexToPix(tq, tr, view.s);
  unit.ax = px.x - nx.x; unit.ay = px.y - nx.y;      // 供渲染做位移插值
  unit.q = tq; unit.r = tr; unit.mp -= spent; unit.ambush = false;
  const t = T(tq,tr);
  if(t.rail || t.road) AddExp(1, "进入路区");
  Alert(t, 1);
  Sfx("move"); RefreshReach(); Sync();
  if(G.hintStep === 1) SetHint(2);
  return true;
}
function Alert(t, amt){
  for(const f of G.forts) if(hexDist(f.q,f.r,t.q,t.r) <= 2) f.fort.alert = Math.min(3, f.fort.alert + amt);
}

/* ── 7. 暴露账本 ───────────────────────────────────────────────────── */
function AddExp(n, why){
  G.exposure = Math.max(0, Math.min(160, G.exposure + n));
  if(n > 0 && why) G.log.expNote = why;
}

/* ── 8. 动作：破袭 / 夜袭 / 设伏 / 群众工作 / 策反 / 休整 ────────────── */
function SabCost(unit){ return unit.role === "sapper" ? 2 : 3; }
function CanSabotage(u){
  const t = T(u.q,u.r);
  return t && t.rail && !t.fort && t.railBroken < 3 && u.mp >= 1 && G.ammo >= SabCost(u);
}
function DoSabotage(u){
  if(!CanSabotage(u)) return false;
  const t = T(u.q,u.r);
  const power = ROLES[u.role].sab >= 2 ? 2 : 1;
  t.railBroken = Math.min(3, t.railBroken + power);
  G.ammo -= SabCost(u); u.mp -= 1; u.exp += 3;
  G.score.sabCount++;
  AddExp(CFG.expSab, "破袭铁路");
  Alert(t, 2);
  Boom(t, "#e8a04a", 16);
  Log(`【${u.name}】扒开路轨、炸毁枕木 —— 该段中断 ${t.railBroken} 昼夜。`, "good");
  Sfx("boom");
  if(G.hintStep === 2) SetHint(3);
  RefreshReach(); Sync(); return true;
}

/* 战斗预览：所有修正当场摊开，绝不留黑箱 */
function Forecast(u, target){
  const R = ROLES[u.role];
  const isFort = !!target.fort;
  const def = isFort ? target.fort : target;
  const dStr = isFort ? def.garrison : def.str;
  const fm = isFort ? FORTS[def.type].mult : 1.0;
  const alert = isFort ? def.alert : 0;

  const ammoCost = Math.max(2, Math.ceil(dStr/7)) - (isFort ? 0 : 1);
  const ammoOk = G.ammo >= ammoCost;

  const mods = [];
  let atk = u.str * R.atk;
  mods.push(["兵力 × 兵种", `${Math.round(atk)}`]);
  atk *= CFG.nightBonus;      mods.push(["夜战突袭", "×1.45"]);
  if(u.exp > 0){ const e = 1 + u.exp*0.004; atk *= e; mods.push(["实战经验", "×"+e.toFixed(2)]); }
  if(!ammoOk){ atk *= 0.55;   mods.push(["弹药不足", "×0.55"]); }

  let dfp = dStr * fm;
  const dmods = [[isFort ? "守备 × 工事" : "野外无工事", `${Math.round(dfp)}`]];
  if(alert > 0){ const a = 1 + alert*0.09; dfp *= a; dmods.push(["警戒提升", "×"+a.toFixed(2)]); }

  const ratio = atk / (dfp + 1);
  const rp = Math.pow(ratio, 1.6);
  const p = Math.max(0.05, Math.min(0.95, rp/(1+rp)));
  const loLoss = Math.round(u.str * (0.09 + 0.30*(1-p)) * 0.7);
  const hiLoss = Math.round(u.str * (0.09 + 0.30*(1-p)) * 1.35);
  const loot = isFort ? FORTS[def.type].loot + Math.round(dStr/4) : Math.round(dStr/3);

  return { p, atk, dfp, mods, dmods, ammoCost, ammoOk, loLoss, hiLoss, loot,
           isFort, dStr, name: isFort ? def.name : def.name,
           label: isFort ? FORTS[def.type].name : "行军纵队", target };
}
function DoAssault(u, target){
  const fc = Forecast(u, target);
  G.ammo = Math.max(0, G.ammo - fc.ammoCost);
  u.mp = 0;
  const win = rnd() < fc.p;
  const isFort = fc.isFort;

  let myLoss = Math.round(u.str * (0.09 + 0.30*(1-fc.p)) * rvar(0.7,1.35));
  if(!win) myLoss = Math.round(myLoss * 1.45);
  myLoss = Math.min(myLoss, u.str);
  u.str -= myLoss; u.exp += win ? 12 : 6;

  if(isFort){
    const f = target.fort;
    AddExp(f.type === "station" ? CFG.expAssaultStation : CFG.expAssaultFort, "夜袭"+f.name);
    if(win){
      G.ammo += fc.loot;
      G.score.forts++; G.score.fortScore += FORTS[f.type].score;
      G.heart = Math.min(100, G.heart + 5);
      Boom(target, "#ffd06a", 30);
      if(f.type === "bridge"){ target.railBroken = 3; target.railWreck = true; }
      Log(`【${u.name}】拿下${f.name}！缴获弹药 ${fc.loot}，我伤亡 ${myLoss}。`, "key");
      target.fort = null;
      G.forts = G.forts.filter(x => x !== target);
      Sfx("win");
    }else{
      f.garrison = Math.max(6, f.garrison - Math.round(f.garrison * rvar(0.10,0.28)));
      f.alert = 3;
      Boom(target, "#c05030", 18);
      Log(`【${u.name}】强攻${f.name}未克，伤亡 ${myLoss}，撤出战斗。`, "bad");
      Sfx("fail");
    }
  }else{
    AddExp(CFG.expAssaultColumn, "袭击纵队");
    if(win){
      G.ammo += fc.loot;
      Boom(T(target.q,target.r), "#ffd06a", 22);
      Log(`【${u.name}】伏杀${target.name}于野外，缴获弹药 ${fc.loot}，我伤亡 ${myLoss}。`, "good");
      G.columns = G.columns.filter(c => c !== target);
      Sfx("win");
    }else{
      target.str = Math.max(5, target.str - Math.round(target.str * rvar(0.15,0.35)));
      Log(`【${u.name}】袭击${target.name}受挫，伤亡 ${myLoss}。`, "bad");
      Sfx("fail");
    }
  }
  CheckUnitDeath(u);
  RefreshReach(); Sync();
}

function CanAmbush(u){
  const t = T(u.q,u.r);
  if(!t || u.mp < 1 || u.ambush) return false;
  if(!IsConcealed(t, { role:u.role, ambush:false })) return false;
  return NB(t.q,t.r).some(([q,r]) => { const n=T(q,r); return n && (n.road || n.rail); });
}
function DoAmbush(u){
  if(!CanAmbush(u)) return false;
  u.ambush = true; u.mp = 0;
  Log(`【${u.name}】就地设伏，等敌人自己走进来。`, "");
  Sfx("click"); RefreshReach(); Sync(); return true;
}

function CanMassWork(u){
  const t = T(u.q,u.r);
  return t && t.vill && !t.burn && !t.vill.worked && u.mp >= 2;
}
function DoMassWork(u){
  if(!CanMassWork(u)) return false;
  const t = T(u.q,u.r), v = t.vill, m = ROLES[u.role].mass;
  u.mp -= 2; v.worked = true;
  const gain = Math.round(6 * m);
  G.heart = Math.min(100, G.heart + gain);
  if(v.side !== "ours"){ v.side = "ours"; Log(`【${u.name}】在${v.name}开出减租减息，全村归拢过来。民心 +${gain}`, "good"); }
  else { v.pop++; Log(`【${u.name}】在${v.name}扩兵征粮，民心 +${gain}`, "good"); }
  AddExp(CFG.expMassWork, "群众工作");
  Sfx("click"); RefreshReach(); Sync(); return true;
}

function TurncoatTargets(u){
  if(u.role !== "workteam" || u.mp < 2) return [];
  return NB(u.q,u.r).map(([q,r])=>T(q,r)).filter(t => t && t.fort && t.fort.puppet);
}
function DoTurncoat(u, t){
  u.mp -= 2;
  AddExp(CFG.expTurncoat, "策反");
  const chance = Math.min(0.9, 0.22 + G.heart*0.006 + u.exp*0.003);
  if(rnd() < chance){
    const f = t.fort;
    G.ammo += Math.round(f.garrison/2);
    G.score.forts++; G.score.fortScore += FORTS[f.type].score;
    G.heart = Math.min(100, G.heart + 8);
    u.exp += 10;
    Boom(t, "#c08adf", 24);
    Log(`【${u.name}】策反成功！${f.name}整队反正，白皮红心。弹药 +${Math.round(f.garrison/2)}`, "key");
    t.fort = null; G.forts = G.forts.filter(x => x !== t);
    Sfx("win");
  }else{
    t.fort.alert = Math.min(3, t.fort.alert + 1);
    Log(`【${u.name}】接头未成，${t.fort.name}的伪军还在观望。`, "");
    Sfx("fail");
  }
  RefreshReach(); Sync();
}

function CanRest(u){
  const t = T(u.q,u.r);
  return t && t.vill && t.vill.side === "ours" && !t.burn && u.mp >= 2 && u.str < u.maxStr;
}
function DoRest(u){
  if(!CanRest(u)) return false;
  const heal = Math.min(u.maxStr - u.str, 10 + Math.round(G.heart/10));
  u.str += heal; u.mp = 0;
  Log(`【${u.name}】在${T(u.q,u.r).vill.name}休整补充，兵力 +${heal}。`, "good");
  Sfx("click"); RefreshReach(); Sync(); return true;
}

function CheckUnitDeath(u){
  if(u.str > 0) return;
  u.alive = false; u.str = 0;
  G.martyrs.push({ name:u.name, cmd:u.cmd, turn:G.turn, where:PlaceName(T(u.q,u.r)) });
  G.heart = Math.max(0, G.heart - 4);
  Log(`【${u.name}】${u.cmd} 部全体阵亡于${PlaceName(T(u.q,u.r))}。`, "bad");
  if(SEL === u){ SEL = G.units.find(x=>x.alive) || null; RefreshReach(); }
}
function PlaceName(t){
  if(!t) return "不明";
  if(t.vill) return t.vill.name;
  if(t.fort) return t.fort.name;
  return TERR[t.terr].name + `(${t.col+1},${t.row+1})`;
}

/* ── 9. 天亮：昼间结算 ─────────────────────────────────────────────── */
let skipAnim = false;
const sleep = (ms)=>new Promise(res=>setTimeout(res, skipAnim ? 0 : ms));

async function Dawn(){
  if(G.busy || G.over) return;
  // 出击容易回家难 —— 暴露的队伍先给一次明确警告
  const exposed = G.units.filter(u => u.alive && !IsConcealed(T(u.q,u.r), u));
  if(exposed.length && !Dawn._confirmed){
    Modal({
      title:"天亮前最后确认", sub:"这些队伍藏不住",
      body:`<p>下列队伍天亮时仍在<span class="rd">暴露地形</span>，日军搜索队会咬上来：</p>
            <p class="hl">${exposed.map(u=>`${u.name}（${PlaceName(T(u.q,u.r))}）`).join("、")}</p>
            <p style="font-size:12.5px;color:#9a8a62">山地、丘陵、林地、我方村庄可以藏人；公路、铁路、平原、据点旁不行。</p>`,
      btns:[{ t:"再想想", cls:"" }, { t:"就这样，天亮", cls:"pri", fn:()=>{ Dawn._confirmed = true; Dawn(); } }]
    });
    return;
  }
  Dawn._confirmed = false;
  G.busy = true; SEL = null; REACH = null; G.phase = "day"; Sync();
  Sfx("dawn");
  await Banner("天 亮 了", `第 ${G.turn} 日 · 日军开始行动`, "#f0c46a");
  await sleep(260);

  await StepExposedUnits();
  await StepColumns();
  await StepRepair();
  await StepSweepLogic();
  StepScore();

  // 入夜
  G.turn++;
  if(G.turn > CFG.totalTurns){ EndGame(); return; }
  G.phase = "night";
  for(const u of G.units){ if(u.alive){ u.mp = u.maxMp; u.dug = false; } }
  for(const t of G.tiles){ if(t.vill) t.vill.worked = false; if(t.burn > 0) t.burn--; }
  AddExp(-CFG.expDecay);
  // 民心产出
  const bases = G.tiles.filter(t => t.vill && t.vill.side === "ours" && !t.burn);
  const ammoGain = bases.reduce((s,t)=>s + (t.vill.base ? 3 : 1), 0);
  G.ammo += ammoGain;
  if(ammoGain) Log(`根据地兵工与群众送来弹药 +${ammoGain}（${bases.length} 个堡垒村）。`, "good");

  SEL = G.units.find(u=>u.alive) || null; RefreshReach();
  await Banner(`第 ${G.turn} 夜`, DateStr(G.turn), "#9fc4e8");
  Sfx("night");
  G.busy = false; Sync();
  if(G.hintStep === 0 && G.turn === 2) SetHint(0);
}

async function StepExposedUnits(){
  for(const u of G.units){
    if(!u.alive) continue;
    const t = T(u.q,u.r);
    if(IsConcealed(t,u)) continue;
    const loss = Math.round(u.str * rvar(0.12,0.26)) + 3;
    u.str = Math.max(0, u.str - loss);
    AddExp(CFG.expCaught, "白日被咬住");
    Boom(t, "#d05030", 14);
    Log(`【${u.name}】在${PlaceName(t)}被日军搜索队咬住，伤亡 ${loss}。`, "bad");
    Sfx("gun");
    CheckUnitDeath(u); Sync();
    await sleep(420);
  }
}

async function StepColumns(){
  for(const c of G.columns.slice()){
    if(!G.columns.includes(c)) continue;
    const steps = c.kind === "sweep" ? 2 : 3;
    for(let i=0; i<steps; i++){
      const nxt = NextColumnHex(c);
      if(!nxt) break;
      const from = hexToPix(c.q,c.r,view.s), to = hexToPix(nxt.q,nxt.r,view.s);
      c.ax = from.x-to.x; c.ay = from.y-to.y;
      c.q = nxt.q; c.r = nxt.r;
      Sync(); await sleep(150);
      if(await TriggerAmbush(c)) break;
      if(c.kind === "sweep" && await BurnVillage(c)) { /* 继续走 */ }
      const hit = G.units.find(u => u.alive && u.q===c.q && u.r===c.r);
      if(hit){ await ColumnFight(c, hit); break; }
    }
  }
}
function NextColumnHex(c){
  if(c.kind === "patrol"){
    if(!c.route || !c.route.length) return null;
    c.ri += c.dir;
    if(c.ri >= c.route.length){ c.ri = c.route.length-2; c.dir = -1; }
    if(c.ri < 0){ c.ri = 1; c.dir = 1; }
    return c.route[c.ri] || null;
  }
  if(!c.path || !c.path.length) return null;
  return c.path.shift() || null;
}
async function TriggerAmbush(c){
  const amb = G.units.find(u => u.alive && u.ambush && hexDist(u.q,u.r,c.q,c.r) === 1);
  if(!amb) return false;
  const R = ROLES[amb.role];
  const power = amb.str * R.atk * 1.9 * (1 + amb.exp*0.004);
  const p = Math.max(0.35, Math.min(0.96, power/(power + c.str*0.85)));
  const cost = 2;
  G.ammo = Math.max(0, G.ammo - cost);
  Boom(T(c.q,c.r), "#ffd06a", 26); Sfx("boom");
  if(rnd() < p){
    const myLoss = Math.round(amb.str * rvar(0.02,0.09));
    amb.str = Math.max(0, amb.str - myLoss); amb.exp += 14;
    G.ammo += Math.round(c.str/3);
    Log(`伏击得手！【${amb.name}】在${PlaceName(T(c.q,c.r))}打垮${c.name}，缴获 ${Math.round(c.str/3)}，我伤亡 ${myLoss}。`, "key");
    G.columns = G.columns.filter(x => x !== c);
    CheckUnitDeath(amb);
  }else{
    const myLoss = Math.round(amb.str * rvar(0.10,0.22));
    amb.str = Math.max(0, amb.str - myLoss);
    c.str = Math.max(6, c.str - Math.round(c.str*0.25));
    Log(`【${amb.name}】伏击${c.name}未能吃掉，我伤亡 ${myLoss}。`, "bad");
    CheckUnitDeath(amb);
  }
  amb.ambush = false;
  Sync(); await sleep(700);
  return true;
}
async function BurnVillage(c){
  const t = T(c.q,c.r);
  if(!t || !t.vill || t.burn > 0) return false;
  t.burn = 3;
  const drop = t.vill.side === "ours" ? 9 : 5;
  G.heart = Math.max(0, G.heart - drop);
  if(t.vill.side === "ours") t.vill.side = "neutral";
  Boom(t, "#e04a28", 26); Sfx("boom");
  Log(`${t.vill.name}被${c.name}烧了。民心 -${drop}。`, "bad");
  Sync(); await sleep(520);
  return true;
}
async function ColumnFight(c, u){
  const R = ROLES[u.role];
  const atk = c.str * 1.25;
  const dfp = u.str * R.atk * (IsConcealed(T(u.q,u.r),u) ? 1.5 : 1.0);
  const p = atk/(atk+dfp);
  const loss = Math.round(u.str * (0.10 + 0.30*p) * rvar(0.8,1.2));
  u.str = Math.max(0, u.str - loss);
  c.str = Math.max(5, c.str - Math.round(c.str * (0.10 + 0.22*(1-p))));
  Boom(T(u.q,u.r), "#d05030", 18); Sfx("gun");
  Log(`【${u.name}】在${PlaceName(T(u.q,u.r))}与${c.name}遭遇，伤亡 ${loss}。`, "bad");
  CheckUnitDeath(u); Sync(); await sleep(620);
}

async function StepRepair(){
  // 修路要靠附近还活着、还有兵的据点 —— 拔了据点，路就修不起来
  if(G.sweep.state === "sweeping"){
    const broken = G.tiles.filter(t => t.rail && t.railBroken > 0).length;
    if(broken) Log("日军主力外出扫荡，沿线无人修路。", "good");
    return;
  }
  let fixed = 0;
  for(const t of G.tiles){
    if(!t.rail || t.railBroken <= 0 || t.railWreck) continue;
    const near = G.forts.some(f => hexDist(f.q,f.r,t.q,t.r) <= 3 && f.fort.garrison >= 12);
    if(near){ t.railBroken--; fixed++; }
  }
  if(fixed){ Log(`日军工兵抢修 ${fixed} 段路轨。`, ""); Sync(); await sleep(300); }
}

async function StepSweepLogic(){
  const S = G.sweep;
  if(S.state === "none" && G.exposure >= CFG.sweepThreshold){
    S.state = "warned"; S.timer = CFG.sweepWarn;
    const entry = G.forts.filter(f => f.fort.type !== "bridge");
    S.from = entry.length ? entry[entry.length-1] : G.tiles[G.tiles.length-1];
    const vs = G.tiles.filter(t => t.vill && t.vill.side === "ours");
    S.target = vs.length ? vs[0] : G.tiles[0];
    Log(`情报：日军第 36 师团一部在${PlaceName(S.from)}集结，${CFG.sweepWarn} 日后向根据地扫荡。`, "key");
    Banner("敌 情 通 报", `${CFG.sweepWarn} 日后 · 大扫荡`, "#e07a4a");
    await sleep(900);
    return;
  }
  if(S.state === "warned"){
    S.timer--;
    if(S.timer <= 0){ await LaunchSweep(); }
    else Log(`日军集结继续，还有 ${S.timer} 日。趁现在疏散、设伏，或者反过来去打空虚的铁路。`, "key");
    return;
  }
  if(S.state === "sweeping"){
    S.timer--;
    if(S.timer <= 0){
      S.state = "none";
      G.columns = G.columns.filter(c => c.kind !== "sweep");
      for(const d of S.drained){ if(d.tile.fort) d.tile.fort.garrison += d.amt; }
      S.drained = [];
      G.exposure = CFG.sweepResetExp;
      Log("扫荡结束，日军回窜据点。根据地又活过来了。", "good");
      await Banner("扫 荡 结 束", "队伍归建 · 暴露度回落", "#a8d47e");
    }
  }
}
async function LaunchSweep(){
  const S = G.sweep;
  S.state = "sweeping"; S.timer = CFG.sweepDuration; S.drained = [];
  // 关键：扫荡的兵是从据点里抽出来的 —— 抽走多少，地图上看得见
  const donors = G.forts.filter(f => f.fort.garrison >= 18).sort((a,b)=>b.fort.garrison-a.fort.garrison).slice(0,3);
  const targets = G.tiles.filter(t => t.vill && t.vill.side === "ours");
  let n = 0;
  for(const f of donors){
    const amt = Math.round(f.fort.garrison * 0.55);
    f.fort.garrison -= amt;
    S.drained.push({ tile:f, amt });
    const tgt = targets[n % Math.max(1,targets.length)] || G.tiles[0];
    G.columns.push({
      id:"s"+(G.colSeq++), q:f.q, r:f.r, str:amt + 20, max:amt+20, kind:"sweep",
      name:`讨伐队${"甲乙丙"[n]||""}`, path:PathTo(f, tgt), ax:0, ay:0
    });
    n++;
  }
  Log(`大扫荡开始！${n} 路讨伐队进山。注意——沿线据点已被抽空。`, "key");
  await Banner("大 扫 荡", "沿线据点空虚 · 敌进我进", "#e04a28");
  Sfx("alarm");
  await sleep(500);
}
function PathTo(from, to){
  const prev = new Map(), seen = new Set([K(from.q,from.r)]);
  const q = [from];
  while(q.length){
    const cur = q.shift();
    if(cur === to) break;
    for(const [nq,nr] of NB(cur.q,cur.r)){
      const t = T(nq,nr); if(!t || seen.has(K(nq,nr))) continue;
      if(t.terr === "water") continue;
      seen.add(K(nq,nr)); prev.set(K(nq,nr), cur); q.push(t);
    }
  }
  const path = []; let cur = to;
  while(cur && cur !== from){ path.unshift(cur); cur = prev.get(K(cur.q,cur.r)); }
  return path;
}
function StepScore(){
  const broken = G.tiles.filter(t => t.rail && t.railBroken > 0).length;
  G.score.railDays += broken;
  if(broken) Log(`本日正太路中断 ${broken} 段（累计 ${G.score.railDays} 段·日）。`, broken >= 3 ? "good" : "");
}
function DateStr(turn){
  const d = new Date(Date.UTC(1941, 7, 17 + turn));
  return `1941年 ${d.getUTCMonth()+1}月${d.getUTCDate()}日`;
}

/* ── 10. 结局评级 ──────────────────────────────────────────────────── */
function EndGame(){
  G.over = true; G.busy = false;
  const s = G.score;
  const alive = G.units.filter(u=>u.alive);
  const villages = G.tiles.filter(t => t.vill && t.vill.side === "ours" && !t.burn).length;
  /* 计分必须让"缩起来不打"变成一个坏选择：
     铁路是主目标且权重最大；保存实力只是副项，单靠躲是拿不到好评级的。 */
  const pts =
      s.railDays * 4
    + s.fortScore
    + villages * 8
    + alive.length * 10
    + Math.round(G.heart * 0.3)
    - G.martyrs.length * 12;

  // 评级上限闸门：任务没完成，保存得再好也只是"没打亏"，不是"打赢了"
  let cap = "S";
  if(s.railDays < 8)       cap = "C";
  else if(s.railDays < 16) cap = "B";

  let g = "D", cls = "gD", verdict = "";
  if(pts >= 310){ g="S"; verdict="正太路瘫痪、囚笼被撕开，根据地反而更大了。军区通令嘉奖。"; }
  else if(pts >= 235){ g="A"; verdict="铁路屡遭中断，据点被拔，敌人被迫收缩。一次漂亮的破袭战。"; }
  else if(pts >= 165){ g="B"; verdict="牵制住了敌人，根据地保住了，但铁路很快就恢复了通车。"; }
  else if(pts >= 100){ g="C"; verdict="打了几下，代价不小。队伍还在，路也还在。"; }
  else { verdict="部队被拖垮，根据地被犁了一遍。这一仗打亏了。"; }

  const order = ["D","C","B","A","S"];
  if(order.indexOf(g) > order.indexOf(cap)){
    g = cap;
    verdict = `队伍保存得不错，但正太路只中断了 ${s.railDays} 段·日 —— 上级要的是这条路瘫掉，不是你完好无损。`;
  }
  cls = "g" + g;

  const martyrHtml = G.martyrs.length
    ? `<div class="martyr">烈士名录<br>` + G.martyrs.map(m =>
        `<span class="mn">${m.name} · ${m.cmd}</span> —— 1941年，牺牲于${m.where}（第 ${m.turn} 日）`).join("<br>") + `</div>`
    : `<div class="martyr" style="color:#a8d47e">全建制归建，无一支队伍打光。</div>`;

  Modal({
    title:"战 役 总 结", sub:`第 ${CFG.totalTurns} 日 · ${DateStr(CFG.totalTurns)}`,
    body:`
      <div class="grade ${cls}">${g}</div>
      <p style="text-align:center;color:#c9b98e;font-size:13.5px;margin-bottom:4px">${verdict}</p>
      <div class="stats">
        <span>正太路累计中断</span><b>${s.railDays} 段·日</b>
        <span>拔除 / 策反据点</span><b>${s.forts} 处</b>
        <span>保住的堡垒村</span><b>${villages} 个</b>
        <span>建制完好的队伍</span><b>${alive.length} / ${UNIT_DEFS.length}</b>
        <span>最终民心</span><b>${G.heart}</b>
        <span style="color:#f0c860">综合评分</span><b style="color:#f0c860">${pts}</b>
      </div>
      ${martyrHtml}`,
    btns:[{ t:"再打一仗", cls:"pri", fn:()=>{ CloseModal(); NewGame((Math.random()*1e9)|0); Sync(); Brief(); } }]
  });
}

/* ── 11. 日志 / 提示 / 音效 ────────────────────────────────────────── */
function Log(text, cls){
  G.log.push({ text, cls: cls||"", turn:G.turn });

let AC = null;
let muted = false;
function Sfx(kind){
  if(muted) return;
  try{
    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return; AC = new C(); }
    const now = AC.currentTime;
    const mk = (type, f0, f1, dur, vol)=>{
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, now);
      o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), now+dur);
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now+dur+0.02);
    };
    if(kind==="click") mk("square", 620, 480, 0.05, 0.035);
    else if(kind==="move") mk("triangle", 300, 420, 0.09, 0.045);
    else if(kind==="boom"){ mk("sawtooth", 180, 40, 0.32, 0.12); mk("square", 90, 30, 0.24, 0.07); }
    else if(kind==="gun"){ mk("square", 240, 110, 0.13, 0.075); }
    else if(kind==="win"){ mk("triangle", 520, 880, 0.30, 0.075); }
    else if(kind==="fail"){ mk("sawtooth", 300, 130, 0.30, 0.065); }
    else if(kind==="dawn"){ mk("sine", 420, 700, 0.55, 0.055); }
    else if(kind==="night"){ mk("sine", 500, 260, 0.60, 0.05); }
    else if(kind==="alarm"){ mk("square", 700, 300, 0.5, 0.075); }
  }catch(e){ /* 音频不可用不影响玩 */ }
}

/* ── 12. 粒子 ─────────────────────────────────────────────────────── */
const FX = [];
function Boom(t, color, n){
  if(!t) return;
  const p = hexToPix(t.q, t.r, view.s);
  for(let i=0;i<n;i++){
    const a = rnd()*Math.PI*2, sp = rvar(0.6, 3.2);
    FX.push({ x:p.x, y:p.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 0.6,
              life:1, decay:rvar(0.012,0.03), color, size:rvar(1.4,3.4) });
  }
  shake = Math.min(9, shake + 5);
}
let shake = 0;

/* ── 13. 视图与渲染 ───────────────────────────────────────────────── */
const cv = document.getElementById("cv");
const ctx = cv ? cv.getContext("2d") : null;
const view = { s:30, ox:0, oy:0, dpr:1 };
let terrainCache = null, terrainDirty = true;

function FitView(){
  if(!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  view.dpr = dpr;
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cv.style.width = W+"px"; cv.style.height = H+"px";

  const padL = W > 760 ? 196 : 8, padR = 12, padT = W > 760 ? 56 : 92, padB = 96;
  const availW = Math.max(120, W - padL - padR), availH = Math.max(120, H - padT - padB);
  const cols = CFG.mapW + 0.5, rows = CFG.mapH;
  const sByW = availW / (Math.sqrt(3) * cols);
  const sByH = availH / (1.5 * rows + 0.5);
  view.s = Math.max(13, Math.min(46, Math.min(sByW, sByH)));

  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const t of G.tiles){
    const p = hexToPix(t.q,t.r,view.s);
    minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
  }
  if(minX > maxX){ minX=maxX=minY=maxY=0; }
  view.ox = padL + availW/2 - (minX+maxX)/2;
  view.oy = padT + availH/2 - (minY+maxY)/2;
  terrainDirty = true;
}
function W2S(x,y){ return { x:(x + view.ox), y:(y + view.oy) }; }
function S2W(x,y){ return { x:(x - view.ox), y:(y - view.oy) }; }

function hexPath(c, cx, cy, s, wob){
  c.beginPath();
  for(let i=0;i<6;i++){
    const a = Math.PI/180*(60*i - 30);
    const jitter = ((wob >> (i*3)) & 7) / 7 * 2.0 - 1.0;
    const rr = s + jitter*Math.min(2.0, s*0.055);
    const x = cx + rr*Math.cos(a), y = cy + rr*Math.sin(a);
    i ? c.lineTo(x,y) : c.moveTo(x,y);
  }
  c.closePath();
}

function BuildTerrain(){
  if(!cv) return;
  const w = cv.width, h = cv.height;
  if(!terrainCache) terrainCache = document.createElement("canvas");
  terrainCache.width = w; terrainCache.height = h;
  const c = terrainCache.getContext("2d");
  c.setTransform(view.dpr,0,0,view.dpr,0,0);
  const W = w/view.dpr, H = h/view.dpr;

  // 纸底
  const bg = c.createLinearGradient(0,0,W,H);
  bg.addColorStop(0, "#e2d5b4"); bg.addColorStop(0.55, "#d6c69f"); bg.addColorStop(1, "#c9b892");
  c.fillStyle = bg; c.fillRect(0,0,W,H);
  const nr = Mulberry32(G.seed ^ 0x9e37);
  c.globalAlpha = 0.05;
  for(let i=0;i<900;i++){
    const x = nr()*W, y = nr()*H;
    c.fillStyle = nr() < 0.5 ? "#6b5a3a" : "#fff8e0";
    c.fillRect(x, y, 1.6, 1.6);
  }
  c.globalAlpha = 1;

  const s = view.s;
  // 地形填充
  for(const t of G.tiles){
    const pw = hexToPix(t.q,t.r,s), sp = W2S(pw.x, pw.y);
    hexPath(c, sp.x, sp.y, s*0.985, t.wob);
    c.fillStyle = TERR[t.terr].fill; c.fill();
    c.strokeStyle = "rgba(60,48,30,.28)"; c.lineWidth = 1; c.stroke();
    DrawTerrainGlyph(c, sp.x, sp.y, s, t);
  }
  // 公路
  c.lineCap = "round";
  for(const t of G.tiles){
    if(!t.road) continue;
    const a = hexToPix(t.q,t.r,s), A = W2S(a.x,a.y);
    for(const [nq,nr] of NB(t.q,t.r)){
      const n = T(nq,nr); if(!n || !n.road) continue;
      if(nq*1000+nr < t.q*1000+t.r) continue;
      const b = hexToPix(nq,nr,s), B = W2S(b.x,b.y);
      c.strokeStyle = "rgba(122,96,52,.55)"; c.lineWidth = Math.max(2, s*0.13);
      c.setLineDash([s*0.26, s*0.20]);
      c.beginPath(); c.moveTo(A.x,A.y); c.lineTo(B.x,B.y); c.stroke();
    }
  }
  c.setLineDash([]);
  terrainDirty = false;
}
function DrawTerrainGlyph(c, x, y, s, t){
  c.save();
  c.strokeStyle = TERR[t.terr].ink; c.lineWidth = Math.max(1, s*0.045); c.lineCap = "round";
  const k = s*0.30;
  if(t.terr === "mountain"){
    c.globalAlpha = .75;
    for(let i=-1;i<=1;i++){
      const ox = i*k*0.95, oy = i===0 ? -k*0.30 : k*0.10;
      c.beginPath();
      c.moveTo(x+ox-k*0.62, y+oy+k*0.52);
      c.lineTo(x+ox, y+oy-k*0.62);
      c.lineTo(x+ox+k*0.62, y+oy+k*0.52);
      c.stroke();
    }
  }else if(t.terr === "hill"){
    c.globalAlpha = .6;
    for(let i=-1;i<=1;i+=2){
      c.beginPath();
      c.arc(x+i*k*0.55, y+k*0.16, k*0.52, Math.PI*1.06, Math.PI*1.94);
      c.stroke();
    }
  }else if(t.terr === "forest"){
    c.globalAlpha = .7;
    for(let i=0;i<3;i++){
      const ox = (i-1)*k*0.82, oy = (i===1 ? -k*0.30 : k*0.14);
      c.beginPath(); c.moveTo(x+ox, y+oy+k*0.55); c.lineTo(x+ox, y+oy-k*0.10); c.stroke();
      c.beginPath();
      c.moveTo(x+ox-k*0.42, y+oy+k*0.06);
      c.lineTo(x+ox, y+oy-k*0.62);
      c.lineTo(x+ox+k*0.42, y+oy+k*0.06);
      c.stroke();
    }
  }else if(t.terr === "water"){
    c.globalAlpha = .55;
    for(let i=-1;i<=1;i++){
      c.beginPath();
      c.moveTo(x-k*0.85, y+i*k*0.52);
      c.quadraticCurveTo(x, y+i*k*0.52 - k*0.34, x+k*0.85, y+i*k*0.52);
      c.stroke();
    }
  }else{
    c.globalAlpha = .30;
    for(let i=-1;i<=1;i++){
      c.beginPath();
      c.moveTo(x-k*0.7, y+i*k*0.46);
      c.lineTo(x+k*0.7, y+i*k*0.46);
      c.stroke();
    }
  }
  c.restore();
}

function Render(){
  if(!ctx || !cv) return;
  if(terrainDirty) BuildTerrain();
  const dpr = view.dpr, W = cv.width/dpr, H = cv.height/dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const sh = shake > 0.2 ? shake : 0;
  const dx = sh ? (rnd()-0.5)*sh : 0, dy = sh ? (rnd()-0.5)*sh : 0;
  shake *= 0.85;
  ctx.save(); ctx.translate(dx,dy);

  if(terrainCache) ctx.drawImage(terrainCache, 0,0, W, H);

  const s = view.s;
  DrawRails(ctx, s);
  DrawOverlays(ctx, s);
  DrawFacilities(ctx, s);
  DrawColumns(ctx, s);
  DrawUnits(ctx, s);
  DrawFX(ctx);
  ctx.restore();

  DrawTimeTint(ctx, W, H);
  DrawSweepArrow(ctx, s);
  requestAnimationFrame(Render);
}

function DrawRails(c, s){
  for(const t of G.tiles){
    if(!t.rail) continue;
    const a = hexToPix(t.q,t.r,s), A = W2S(a.x,a.y);
    for(const [nq,nr] of NB(t.q,t.r)){
      const n = T(nq,nr); if(!n || !n.rail) continue;
      if(nq*1000+nr < t.q*1000+t.r) continue;
      const b = hexToPix(nq,nr,s), B = W2S(b.x,b.y);
      const broken = t.railBroken > 0 || n.railBroken > 0;
      c.strokeStyle = broken ? "rgba(150,54,32,.85)" : "rgba(38,32,24,.85)";
      c.lineWidth = Math.max(2.2, s*0.14);
      c.setLineDash(broken ? [s*0.14, s*0.16] : []);
      c.beginPath(); c.moveTo(A.x,A.y); c.lineTo(B.x,B.y); c.stroke();
      c.setLineDash([]);
      if(!broken){
        const steps = 5;
        c.strokeStyle = "rgba(38,32,24,.62)"; c.lineWidth = Math.max(1, s*0.055);
        const ang = Math.atan2(B.y-A.y, B.x-A.x) + Math.PI/2;
        for(let i=1;i<steps;i++){
          const px = A.x + (B.x-A.x)*i/steps, py = A.y + (B.y-A.y)*i/steps;
          const l = s*0.17;
          c.beginPath();
          c.moveTo(px + Math.cos(ang)*l, py + Math.sin(ang)*l);
          c.lineTo(px - Math.cos(ang)*l, py - Math.sin(ang)*l);
          c.stroke();
        }
      }
    }
    if(t.railBroken > 0){
      c.save();
      c.fillStyle = "rgba(160,50,28,.92)";
      c.font = `600 ${Math.round(s*0.42)}px system-ui`;
      c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText("✕", A.x, A.y - s*0.02);
      c.restore();
    }
  }
}

function DrawOverlays(c, s){
  const time = performance.now()/1000;
  // 隐蔽图
  if(coverMode){
    for(const t of G.tiles){
      const p = hexToPix(t.q,t.r,s), P = W2S(p.x,p.y);
      const safe = IsConcealed(t, null);
      hexPath(c, P.x, P.y, s*0.96, t.wob);
      c.fillStyle = safe ? "rgba(90,168,80,.20)" : "rgba(190,60,40,.24)";
      c.fill();
    }
  }
  // 可达格 —— 必须一眼看见（吸取教训：不要做成低透明度的暗示）
  if(REACH && SEL){
    const pulse = 0.5 + 0.5*Math.sin(time*3.2);
    for(const [kk, cost] of REACH.cost){
      const [q,r] = kk.split(",").map(Number);
      const t = T(q,r); if(!t) continue;
      const p = hexToPix(q,r,s), P = W2S(p.x,p.y);
      hexPath(c, P.x, P.y, s*0.93, t.wob);
      c.fillStyle = `rgba(240,206,120,${0.20 + 0.09*pulse})`;
      c.fill();
      c.strokeStyle = `rgba(255,224,150,${0.60 + 0.25*pulse})`;
      c.lineWidth = 1.8; c.stroke();
      c.save();
      c.fillStyle = "rgba(90,66,26,.55)";
      c.font = `${Math.round(s*0.30)}px system-ui`;
      c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText(String(cost), P.x, P.y + s*0.60);
      c.restore();
    }
    // 可打的目标：红圈
    const tgts = AssaultTargets(SEL);
    for(const tg of tgts){
      const q = tg.q, r = tg.r;
      const p = hexToPix(q,r,s), P = W2S(p.x,p.y);
      hexPath(c, P.x, P.y, s*0.96, tg.wob || 0);
      c.strokeStyle = `rgba(226,90,54,${0.72 + 0.24*pulse})`;
      c.lineWidth = 2.6; c.stroke();
    }
  }
  // 悬停
  if(hoverHex){
    const t = T(hoverHex.q, hoverHex.r);
    if(t){
      const p = hexToPix(t.q,t.r,s), P = W2S(p.x,p.y);
      hexPath(c, P.x, P.y, s*0.97, t.wob);
      c.strokeStyle = "rgba(255,255,255,.55)"; c.lineWidth = 1.6; c.stroke();
    }
  }
}

function DrawFacilities(c, s){
  for(const t of G.tiles){
    const p = hexToPix(t.q,t.r,s), P = W2S(p.x,p.y);
    if(t.vill){
      const own = t.vill.side === "ours";
      c.save();
      c.translate(P.x, P.y);
      const k = s*0.34;
      c.fillStyle = t.burn ? "#6a5040" : (own ? "#d9b07a" : "#c9b895");
      c.strokeStyle = "#4a3a22"; c.lineWidth = Math.max(1, s*0.05);
      c.beginPath();
      c.moveTo(-k, k*0.6); c.lineTo(-k, -k*0.15); c.lineTo(0, -k*0.85);
      c.lineTo(k, -k*0.15); c.lineTo(k, k*0.6); c.closePath();
      c.fill(); c.stroke();
      if(own){
        c.fillStyle = "#a4322a";
        c.fillRect(k*0.30, -k*1.55, k*0.86, k*0.52);
        c.strokeStyle = "#5a2018"; c.lineWidth = 1;
        c.beginPath(); c.moveTo(k*0.30, -k*1.62); c.lineTo(k*0.30, k*0.2); c.stroke();
      }
      if(t.burn){
        c.fillStyle = "rgba(210,80,40,.75)";
        c.font = `${Math.round(s*0.36)}px system-ui`;
        c.textAlign = "center";
        c.fillText("焚", 0, -k*1.15);
      }
      c.fillStyle = "rgba(44,34,20,.9)";
      c.font = `${Math.round(Math.max(8, s*0.28))}px "Noto Serif SC",serif`;
      c.textAlign = "center"; c.textBaseline = "top";
      c.fillText(t.vill.name, 0, k*0.75);
      c.restore();
    }
    if(t.fort){
      const f = t.fort;
      c.save(); c.translate(P.x, P.y);
      const k = s*0.40;
      const body = f.puppet ? "#8a7a4a" : "#46525c";
      c.fillStyle = body; c.strokeStyle = "#20272c"; c.lineWidth = Math.max(1, s*0.05);
      if(f.type === "bridge"){
        c.beginPath();
        c.moveTo(-k*1.05, k*0.34); c.lineTo(-k*0.62, -k*0.42);
        c.lineTo(k*0.62, -k*0.42); c.lineTo(k*1.05, k*0.34);
        c.stroke();
        c.fillRect(-k*1.05, k*0.30, k*2.1, k*0.24);
      }else if(f.type === "station"){
        c.fillRect(-k*1.0, -k*0.42, k*2.0, k*0.92); c.strokeRect(-k*1.0, -k*0.42, k*2.0, k*0.92);
        c.beginPath(); c.moveTo(-k*1.15, -k*0.42); c.lineTo(0, -k*1.02); c.lineTo(k*1.15, -k*0.42);
        c.closePath(); c.fill(); c.stroke();
      }else{
        c.fillRect(-k*0.66, -k*0.62, k*1.32, k*1.24);
        c.strokeRect(-k*0.66, -k*0.62, k*1.32, k*1.24);
        c.fillStyle = "#1b2126";
        c.fillRect(-k*0.22, -k*0.30, k*0.44, k*0.34);
      }
      // 守备数字
      c.fillStyle = "rgba(20,24,28,.86)";
      const bw = s*0.62, bh = s*0.30;
      c.fillRect(-bw/2, k*0.72, bw, bh);
      c.fillStyle = f.garrison < f.max*0.6 ? "#ffcf6a" : "#dfe6ea";
      c.font = `600 ${Math.round(Math.max(8, s*0.26))}px system-ui`;
      c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText(String(f.garrison), 0, k*0.72 + bh/2);
      if(f.alert > 0){
        c.fillStyle = "#e8703c";
        for(let i=0;i<f.alert;i++) c.fillRect(-bw/2 + i*(s*0.13), k*0.72 - s*0.12, s*0.10, s*0.08);
      }
      if(f.puppet){
        c.fillStyle = "rgba(230,210,140,.95)";
        c.font = `${Math.round(Math.max(8, s*0.24))}px "Noto Serif SC",serif`;
        c.fillText("伪", 0, -k*1.02);
      }
      c.restore();
    }
  }
}

function DrawColumns(c, s){
  for(const col of G.columns){
    const p = hexToPix(col.q,col.r,s);
    col.ax *= 0.78; col.ay *= 0.78;
    const P = W2S(p.x + col.ax, p.y + col.ay);
    c.save(); c.translate(P.x, P.y);
    const k = s*0.34, sweep = col.kind === "sweep";
    c.fillStyle = sweep ? "#3b464f" : "#586570";
    c.strokeStyle = "#171d22"; c.lineWidth = Math.max(1, s*0.05);
    c.beginPath();
    c.moveTo(0, -k*0.95); c.lineTo(k*0.90, k*0.62); c.lineTo(-k*0.90, k*0.62);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = "rgba(20,24,28,.85)";
    c.fillRect(-s*0.30, k*0.70, s*0.60, s*0.28);
    c.fillStyle = "#dfe6ea";
    c.font = `600 ${Math.round(Math.max(8, s*0.24))}px system-ui`;
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(String(col.str), 0, k*0.70 + s*0.14);
    if(sweep){
      c.fillStyle = "#e8703c";
      c.font = `${Math.round(Math.max(8, s*0.26))}px "Noto Serif SC",serif`;
      c.fillText("讨", 0, -k*1.35);
    }
    c.restore();
  }
}

function DrawUnits(c, s){
  const night = G.phase === "night";
  for(const u of G.units){
    if(!u.alive) continue;
    const p = hexToPix(u.q,u.r,s);
    u.ax *= 0.74; u.ay *= 0.74;
    const P = W2S(p.x + u.ax, p.y + u.ay);
    const R = ROLES[u.role];
    c.save(); c.translate(P.x, P.y);

    if(night){ c.shadowColor = "rgba(255,190,110,.55)"; c.shadowBlur = s*0.5; }
    const k = s*0.36;
    c.fillStyle = R.color; c.strokeStyle = "#2a1410"; c.lineWidth = Math.max(1, s*0.055);
    c.beginPath();
    c.moveTo(-k*0.92, -k*0.72); c.lineTo(k*0.92, -k*0.72);
    c.lineTo(k*0.92, k*0.52); c.lineTo(0, k*0.96); c.lineTo(-k*0.92, k*0.52);
    c.closePath(); c.fill(); c.stroke();
    c.shadowBlur = 0;

    if(SEL === u){
      c.strokeStyle = "#ffd05e"; c.lineWidth = 2.4;
      c.beginPath(); c.arc(0,0, s*0.72, 0, Math.PI*2); c.stroke();
    }
    // 兵种字
    c.fillStyle = "#ffe6c0";
    c.font = `600 ${Math.round(Math.max(9, s*0.32))}px "Noto Serif SC",serif`;
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(u.name[0], 0, -k*0.08);
    // 兵力条
    const bw = s*0.86;
    c.fillStyle = "rgba(20,14,10,.72)"; c.fillRect(-bw/2, k*1.02, bw, s*0.13);
    c.fillStyle = "#e0743c"; c.fillRect(-bw/2, k*1.02, bw*(u.str/u.maxStr), s*0.13);
    // 状态角标
    if(u.ambush){
      c.fillStyle = "#a4d47e";
      c.font = `${Math.round(Math.max(8, s*0.26))}px "Noto Serif SC",serif`;
      c.fillText("伏", k*1.05, -k*0.85);
    }
    if(G.phase === "night" && !IsConcealed(T(u.q,u.r), u)){
      c.fillStyle = "#ff8a5a";
      c.font = `${Math.round(Math.max(9, s*0.34))}px system-ui`;
      c.fillText("!", -k*1.15, -k*0.85);
    }
    c.restore();
  }
}

function DrawFX(c){
  for(let i=FX.length-1;i>=0;i--){
    const f = FX[i];
    f.x += f.vx; f.y += f.vy; f.vy += 0.07; f.life -= f.decay;
    if(f.life <= 0){ FX.splice(i,1); continue; }
    const P = W2S(f.x, f.y);
    c.globalAlpha = Math.max(0, f.life);
    c.fillStyle = f.color;
    c.fillRect(P.x - f.size/2, P.y - f.size/2, f.size, f.size);
  }
  c.globalAlpha = 1;
}

function DrawTimeTint(c, W, H){
  if(G.phase === "night"){
    c.fillStyle = "rgba(22,34,66,.40)"; c.fillRect(0,0,W,H);
    const g = c.createRadialGradient(W/2,H/2, Math.min(W,H)*0.25, W/2,H/2, Math.max(W,H)*0.72);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(6,10,24,.55)");
    c.fillStyle = g; c.fillRect(0,0,W,H);
  }else{
    c.fillStyle = "rgba(255,214,140,.10)"; c.fillRect(0,0,W,H);
  }
}
function DrawSweepArrow(c, s){
  const S = G.sweep;
  if(S.state !== "warned" || !S.from || !S.target) return;
  const a = hexToPix(S.from.q,S.from.r,s), A = W2S(a.x,a.y);
  const b = hexToPix(S.target.q,S.target.r,s), B = W2S(b.x,b.y);
  const t = performance.now()/1000;
  c.save();
  c.strokeStyle = `rgba(226,90,54,${0.45 + 0.3*Math.sin(t*3)})`;
  c.lineWidth = 4; c.setLineDash([14, 10]); c.lineDashOffset = -t*26;
  c.beginPath(); c.moveTo(A.x,A.y); c.lineTo(B.x,B.y); c.stroke();
  c.setLineDash([]);
  const ang = Math.atan2(B.y-A.y, B.x-A.x);
  c.fillStyle = "rgba(226,90,54,.9)";
  c.translate(B.x, B.y); c.rotate(ang);
  c.beginPath(); c.moveTo(0,0); c.lineTo(-16,-8); c.lineTo(-16,8); c.closePath(); c.fill();
  c.restore();
}

/* ── 14. 输入 ─────────────────────────────────────────────────────── */
/* 教训：点击判定必须宽容（阈值 10px），可达格必须显眼，点错要有反馈 */
let ptr = { down:false, id:null, sx:0, sy:0, lx:0, ly:0, moved:false, t0:0 };
const TAP_SLOP = 10;

function CanvasPoint(ev){
  const r = cv.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
function HexAt(sx, sy){
  const w = S2W(sx, sy);
  const h = pixToHex(w.x, w.y, view.s);
  return T(h.q, h.r) ? h : null;
}
function OnDown(ev){
  if(!cv) return;
  if(!AC) Sfx("click");
  const p = CanvasPoint(ev);
  ptr = { down:true, id:ev.pointerId, sx:p.x, sy:p.y, lx:p.x, ly:p.y, moved:false, t0:Date.now() };
  if(cv.setPointerCapture && ev.pointerId != null){ try{ cv.setPointerCapture(ev.pointerId); }catch(e){} }
}
function OnMove(ev){
  if(!cv) return;
  const p = CanvasPoint(ev);
  if(ptr.down){
    const dx = p.x - ptr.sx, dy = p.y - ptr.sy;
    if(!ptr.moved && Math.hypot(dx,dy) > TAP_SLOP) ptr.moved = true;
    if(ptr.moved){ view.ox += p.x - ptr.lx; view.oy += p.y - ptr.ly; terrainDirty = true; }
    ptr.lx = p.x; ptr.ly = p.y;
  }else{
    hoverHex = HexAt(p.x, p.y);
    ShowTip(hoverHex, ev.clientX, ev.clientY);
  }
}
function OnUp(ev){
  if(!cv) return;
  const wasDown = ptr.down, moved = ptr.moved;
  ptr.down = false; ptr.moved = false;
  if(!wasDown || moved) return;
  const p = CanvasPoint(ev);
  TapHex(p.x, p.y);
}
function OnClickFallback(ev){
  // pointer 事件缺失时的兜底（老浏览器 / 合成事件）
  if(ptr.down || ptr.moved) return;
  if(Date.now() - ptr.t0 < 350) return;   // 刚由 pointerup 处理过
  const p = CanvasPoint(ev);
  TapHex(p.x, p.y);
}
function TapHex(sx, sy){
  if(G.over || G.busy) return;
  const h = HexAt(sx, sy);
  if(!h){ return; }
  const t = T(h.q, h.r);

  // 1) 点到自己的部队 → 选中
  const own = G.units.find(u => u.alive && u.q === h.q && u.r === h.r);
  if(own && own !== SEL){ SelectUnit(own); return; }

  // 2) 点到可达格 → 走过去
  if(SEL && REACH && REACH.cost.has(K(h.q,h.r))){ DoMove(SEL, h.q, h.r); return; }

  // 3) 点到相邻的敌人 → 开战斗预览
  if(SEL && SEL.mp > 0){
    if(t.fort && hexDist(SEL.q,SEL.r,h.q,h.r) === 1){ OpenForecast(SEL, t); return; }
    const col = G.columns.find(c => c.q === h.q && c.r === h.r);
    if(col && hexDist(SEL.q,SEL.r,h.q,h.r) === 1){ OpenForecast(SEL, col); return; }
  }

  // 4) 点了够不着的地方 → 明确告诉玩家为什么
  if(SEL){
    if(SEL.mp <= 0) Toast(`${SEL.name} 今夜已无机动力`);
    else if(t.terr === "water") Toast("过不去：河");
    else if(t.fort) Toast("据点要靠上去才能打——先移动到相邻格");
    else Toast("机动力不够，走不到那里");
    Sfx("fail");
  }
}
function SelectUnit(u){
  if(!u || !u.alive) return;
  SEL = u; RefreshReach(); Sfx("click"); Sync();
  if(G.hintStep === 0 && !G.over) SetHint(0);
  else if(G.hintStep === 1) SetHint(2);
}
function OnWheel(ev){
  ev.preventDefault();
  const before = S2W(ev.clientX, ev.clientY);
  view.s = Math.max(13, Math.min(60, view.s * (ev.deltaY < 0 ? 1.12 : 0.89)));
  const after = S2W(ev.clientX, ev.clientY);
  view.ox += (after.x - before.x) * 0; // 保持简单：缩放围绕当前偏移
  terrainDirty = true;
}
function ShowTip(h, cx, cy){
  const el = document.getElementById("tip");
  if(!el) return;
  if(!h){ el.style.display = "none"; return; }
  const t = T(h.q,h.r); if(!t){ el.style.display="none"; return; }
  const safe = IsConcealed(t, null);
  let s = `<div class="th">${PlaceName(t)}</div><span class="ty">${TERR[t.terr].name}</span>`;
  s += ` · 机动 ${TERR[t.terr].cost < 0 ? "不可通行" : TERR[t.terr].cost}`;
  s += `<br>${safe ? '<span style="color:#a4d68a">天亮可隐蔽</span>' : '<span class="tw">天亮会暴露</span>'}`;
  if(t.rail) s += `<br>铁路${t.railBroken > 0 ? `<span class="tw">（已破坏 ${t.railBroken}）</span>` : ""}`;
  if(t.road) s += `<br>公路`;
  if(t.fort) s += `<br><span class="tw">${t.fort.name}</span> 守备 ${t.fort.garrison}${t.fort.puppet ? "（伪军·可策反）" : ""}${t.fort.alert ? " 警戒"+t.fort.alert : ""}`;
  if(t.vill) s += `<br>${t.vill.side === "ours" ? '<span style="color:#a4d68a">堡垒村</span>' : "村庄"}${t.burn ? '<span class="tw">（被焚）</span>' : ""}`;
  el.innerHTML = s;
  el.style.display = "block";
  el.style.left = Math.min(window.innerWidth - 244, cx + 16) + "px";
  el.style.top  = Math.min(window.innerHeight - 120, cy + 14) + "px";
}

/* ── 15. UI 同步 ──────────────────────────────────────────────────── */
function AssaultTargets(u){
  if(!u || u.mp <= 0) return [];
  const out = [];
  for(const [q,r] of NB(u.q,u.r)){
    const t = T(q,r); if(!t) continue;
    if(t.fort) out.push(t);
    const col = G.columns.find(c => c.q === q && c.r === r);
    if(col) out.push(Object.assign(Object.create(null), { q, r, wob:t.wob, __col:col }));
  }
  return out;
}
function Sync(){
  const $ = (id)=>document.getElementById(id);
  if(!$("dayNum")) return;
  $("dayNum").textContent = G.phase === "night" ? `第 ${G.turn} 夜` : `第 ${G.turn} 日`;
  const pt = $("phaseTag");
  pt.textContent = G.phase === "night" ? "夜" : "昼";
  pt.className = G.phase === "night" ? "ph-night" : "ph-day";
  $("railVal").textContent = G.score.railDays;
  $("railFill").style.width = Math.min(100, G.score.railDays*1.6) + "%";
  $("expVal").textContent = Math.round(G.exposure);
  $("expFill").style.width = Math.min(100, G.exposure) + "%";
  $("ammoVal").textContent = G.ammo;
  $("heartVal").textContent = G.heart;
  const dawnBtn = $("btnDawn");
  dawnBtn.disabled = G.busy || G.over;
  const anyMp = G.units.some(u => u.alive && u.mp > 0);
  dawnBtn.classList.toggle("urge", !anyMp && !G.busy && !G.over);

  // 队伍卡
  const ros = $("roster");
  ros.innerHTML = "";
  for(const u of G.units){
    const d = document.createElement("div");
    d.className = "ucard" + (SEL === u ? " sel" : "") + (!u.alive ? " dead" : (u.mp <= 0 ? " spent" : ""));
    d.style.borderLeftColor = ROLES[u.role].color;
    const t = T(u.q,u.r);
    const hidden = u.alive && IsConcealed(t,u);
    d.innerHTML = `<div class="un">${u.name}<em>${ROLES[u.role].label}</em></div>
      <div class="um"><s>兵 ${u.str}</s>${u.alive ? `<span>机动 ${u.mp}/${u.maxMp}</span>` : "<span>阵亡</span>"}</div>
      <div class="hpbar"><i style="width:${Math.round(u.str/u.maxStr*100)}%"></i></div>
      ${u.alive ? `<div class="flag" style="color:${hidden ? "#7fc46a" : "#e0885a"}">${u.ambush ? "伏" : (hidden ? "隐" : "露")}</div>` : ""}`;
    if(u.alive) d.onclick = ()=>SelectUnit(u);
    ros.appendChild(d);
  }
  SyncActions();
}
function SyncActions(){
  const title = document.getElementById("actTitle");
  const acts  = document.getElementById("acts");
  if(!title || !acts) return;
  acts.innerHTML = "";
  if(G.over){ title.textContent = "战役结束"; return; }
  if(G.busy){ title.textContent = "日军行动中……"; return; }
  if(!SEL || !SEL.alive){ title.textContent = "— 点左侧队伍，或直接点地图上的红色部队 —"; return; }

  const u = SEL, t = T(u.q,u.r);
  const safe = IsConcealed(t,u);
  title.innerHTML = `<b>${u.name} · ${u.cmd}</b>
    <span>兵力 ${u.str}/${u.maxStr}</span><span>机动 ${u.mp}/${u.maxMp}</span>
    <span>${PlaceName(t)}</span>
    <span class="cover ${safe ? "cov-safe" : "cov-risk"}">${safe ? "天亮可隐蔽" : "天亮会暴露"}</span>`;

  const mk = (label, cost, cls, enabled, fn, tip)=>{
    const b = document.createElement("button");
    b.className = "abtn" + (cls ? " "+cls : "");
    b.innerHTML = label + (cost ? `<span class="cost">${cost}</span>` : "");
    b.disabled = !enabled;
    if(tip) b.title = tip;
    if(enabled) b.onclick = fn;
    acts.appendChild(b);
    return b;
  };

  // 破袭
  const onRail = t.rail && !t.fort;
  if(onRail){
    const ok = CanSabotage(u);
    mk("破袭铁路", `弹 ${SabCost(u)} · 机动 1`, "hot", ok, ()=>DoSabotage(u),
      ok ? "扒轨炸枕，中断行车" : (G.ammo < SabCost(u) ? "弹药不足" : (t.railBroken >= 3 ? "该段已彻底瘫痪" : "机动力不足")));
  }
  // 夜袭
  for(const tg of AssaultTargets(u)){
    const col = tg.__col;
    const target = col || tg;
    const nm = col ? col.name : tg.fort.name;
    mk(`夜袭 ${nm}`, "", "hot", u.mp > 0, ()=>OpenForecast(u, target), "先看预览再决定");
  }
  // 策反
  for(const tt of TurncoatTargets(u)){
    mk(`策反 ${tt.fort.name}`, "机动 2", "gold", true, ()=>DoTurncoat(u, tt), "不放一枪拿下据点");
  }
  // 设伏
  mk("设伏", "余下机动", "", CanAmbush(u), ()=>DoAmbush(u),
    CanAmbush(u) ? "白天敌人路过就打" : "需站在隐蔽地形、且紧挨公路或铁路");
  // 群众工作
  if(t.vill) mk("发动群众", "机动 2", "", CanMassWork(u), ()=>DoMassWork(u),
    CanMassWork(u) ? "减租减息，把村子变成堡垒村" : (t.vill.worked ? "该村今夜已做过工作" : "机动力不足或村子被焚"));
  // 休整
  if(t.vill && t.vill.side === "ours") mk("休整", "全部机动", "", CanRest(u), ()=>DoRest(u), "补充兵员");
}

/* ── 16. 弹层 ─────────────────────────────────────────────────────── */
function Modal(opt){
  const root = document.getElementById("modalRoot");
  if(!root) return;
  root.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "modal";
  const box = document.createElement("div");
  box.className = "mbox";
  box.innerHTML = `<h2>${opt.title}</h2><h3>${opt.sub||""}</h3>${opt.body||""}`;
  const row = document.createElement("div");
  row.className = "mrow";
  (opt.btns||[{t:"知道了",cls:"pri"}]).forEach(b=>{
    const btn = document.createElement("button");
    btn.className = "mbtn " + (b.cls||"");
    btn.textContent = b.t;
    btn.onclick = ()=>{ if(b.fn) b.fn(); else CloseModal(); };
    row.appendChild(btn);
  });
  box.appendChild(row); wrap.appendChild(box); root.appendChild(wrap);
}
function CloseModal(){ const r = document.getElementById("modalRoot"); if(r) r.innerHTML = ""; }

function OpenForecast(u, target){
  const fc = Forecast(u, target);
  const oc = fc.p >= 0.68 ? "oGood" : (fc.p >= 0.42 ? "oMid" : "oBad");
  Modal({
    title:`夜袭 ${fc.name}`, sub:`${u.name} · ${u.cmd} —— 打之前，先把账算清`,
    body:`
      <div class="fc">
        <div class="fcSide">
          <div class="nm">我 · ${u.name}</div>
          <div class="vl">${Math.round(fc.atk)}</div>
          <div class="sb">${fc.mods.map(m=>`${m[0]} ${m[1]}`).join("<br>")}</div>
        </div>
        <div class="fcVs">对</div>
        <div class="fcSide">
          <div class="nm">敌 · ${fc.label}</div>
          <div class="vl" style="color:#8fb4d8">${Math.round(fc.dfp)}</div>
          <div class="sb">${fc.dmods.map(m=>`${m[0]} ${m[1]}`).join("<br>")}</div>
        </div>
      </div>
      <div class="odds">
        <div class="big ${oc}">${Math.round(fc.p*100)}%</div>
        <div class="lb">得 手 概 率</div>
        <div class="oddsBar"><i style="width:${Math.round(fc.p*100)}%"></i></div>
      </div>
      <div class="fcList">
        我军预计伤亡 <span>${fc.loLoss} ~ ${fc.hiLoss}</span> 人<br>
        消耗弹药 <span>${fc.ammoCost}</span>（现有 ${G.ammo}）${fc.ammoOk ? "" : ' <span style="color:#e07a5a">— 不足，战力打五五折</span>'}<br>
        得手可缴获弹药 <span>+${fc.loot}</span>${fc.isFort && target.fort && target.fort.type === "bridge" ? '<br><span style="color:#f0c860">炸毁铁桥：该段永久中断，不可修复</span>' : ""}<br>
        暴露度 <span>+${fc.isFort ? (target.fort.type === "station" ? CFG.expAssaultStation : CFG.expAssaultFort) : CFG.expAssaultColumn}</span>
      </div>`,
    btns:[
      { t:"再看看", cls:"" },
      { t:"打！", cls:"pri", fn:()=>{ CloseModal(); DoAssault(u, target); } }
    ]
  });
}

function Brief(){
  Modal({
    title:"夜 袭 · 正 太 路", sub:"太行 · 1941年秋 —— 敌后根据地作战",
    body:`
      <p>正太铁路是日军穿过太行山的动脉。沿线据点、公路把根据地切成碎块 —— 这叫<span class="hl">囚笼</span>。
         你带 <span class="hl">五支队伍</span>，在山里，装备远不如人。</p>
      <p><span class="hl">规则只有一条要记住：夜里出击，天亮前回家。</span><br>
         夜间你自由行动；<span class="rd">天亮时若还站在平原、公路或铁路上，日军搜索队就会咬上来。</span><br>
         <span style="color:#a4d68a">山地、林地、自己的村庄</span>随时藏得住人；丘陵也行，但<span class="rd">紧挨据点的丘陵藏不住</span>。
         拿不准就按顶栏的【隐蔽图】看一眼。</p>
      <div class="rule"></div>
      <p style="font-size:12.5px;line-height:2">
        <span class="hl">弹药</span>有限 —— 所以"打不打"才是你真正的资源。每次进攻前都有战力预览，账摊开给你看。<br>
        <span class="hl">暴露度</span>是一本明账 —— 打得越狠涨得越快，满了就招来大扫荡。<br>
        <span class="hl">扫荡的兵是从据点抽走的</span> —— 敌人主力进山那几天，铁路沿线最空虚。<br>
        <span class="hl">队伍会真的死</span> —— 打光就没了，名字进烈士名录。
      </p>
      <p style="color:#9a8a62;font-size:12.5px">
        ${CFG.totalTurns} 个昼夜后结算。<span class="hl">主目标是让这条路瘫掉</span> —— 拔据点、保村子、留住队伍都是副项，
        光把人藏好而铁路照常通车，评级封顶只能到 C。</p>`,
    btns:[{ t:"入 夜 出 发", cls:"pri", fn:()=>{ CloseModal(); SetHint(1); } }]
  });
}

/* ── 17. 启动 ─────────────────────────────────────────────────────── */
function Boot(){
  if(!cv) return;
  NewGame((Math.random()*1e9)|0);
  FitView(); Sync();
  cv.addEventListener("pointerdown", OnDown);
  cv.addEventListener("pointermove", OnMove);
  cv.addEventListener("pointerup", OnUp);
  cv.addEventListener("pointercancel", ()=>{ ptr.down = false; });
  cv.addEventListener("click", OnClickFallback);
  cv.addEventListener("wheel", OnWheel, { passive:false });
  cv.addEventListener("pointerleave", ()=>{
    hoverHex = null;
    const el = document.getElementById("tip"); if(el) el.style.display = "none";
  });
  window.addEventListener("resize", ()=>{ FitView(); SetHint(G.hintStep); });
  document.getElementById("btnDawn").onclick = ()=>Dawn();
  document.getElementById("btnCover").onclick = (e)=>{
    coverMode = !coverMode;
    e.currentTarget.classList.toggle("on", coverMode);
    Sfx("click");
  };
  document.getElementById("btnHelp").onclick = ()=>Brief();
  window.addEventListener("keydown", (e)=>{
    if(e.key === " "){ e.preventDefault(); Dawn(); }
    else if(e.key === "Tab"){
      e.preventDefault();
      const live = G.units.filter(u=>u.alive);
      if(!live.length) return;
      const i = live.indexOf(SEL);
      SelectUnit(live[(i+1) % live.length]);
    }
    else if(e.key === "c" || e.key === "C"){ document.getElementById("btnCover").click(); }
  });
  requestAnimationFrame(Render);
  Brief();
}

/* 测试钩子：供无头回归读取状态、断言链路 */
window.NR = {
  G, CFG, ROLES, TERR, FORTS,
  NewGame, GenMap, Reachable, RefreshReach, DoMove, DoSabotage, DoAssault, DoAmbush,
  DoMassWork, DoTurncoat, DoRest, Forecast, IsConcealed, MoveCost, Dawn, EndGame,
  SelectUnit, TapHex, HexAt, Sync, FitView, hexToPix, pixToHex, hexDist, K, T, NB,
  get SEL(){ return SEL; }, set SEL(v){ SEL = v; },
  get REACH(){ return REACH; },
  get view(){ return view; },
  setSkipAnim(v){ skipAnim = !!v; },
  setMuted(v){ muted = !!v; }
};

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", Boot);
else Boot();
</script>
