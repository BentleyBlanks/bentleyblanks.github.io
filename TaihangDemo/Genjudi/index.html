<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>根据地 · 1937—1945</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#12100b;color:#d9cfb4;font-family:system-ui,"Noto Sans SC",sans-serif;font-size:13px;user-select:none}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
#cv{position:absolute;inset:0;display:block;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:9px;flex-wrap:wrap;

#top .r{white-space:nowrap;font-size:12.5px;color:#a2977c}
#top .r b{color:#f2e8cd;font-weight:600}
#top .r i{font-style:normal;font-size:11px}
.up{color:#8dbf6a}.dn{color:#d9584a}
.tb{background:#2b2418;border:1px solid #574a2e;color:#ddd2b4;border-radius:5px;padding:4px 10px;font-size:12.5px}
.tb:hover{background:#392f1f}
.tb.hot{border-color:#c9a44a;box-shadow:0 0 7px rgba(201,164,74,.45)}
#endBtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:21;background:#6b2118;border:1px solid #c4674f;

#endBtn:hover{background:#87291d}
#endBtn.ok{background:#2f5a28;border-color:#6fbf5a;color:#e8ffd9}
#goal{position:fixed;top:calc(40px + env(safe-area-inset-top));left:10px;z-index:16;max-width:min(330px,54vw);

#goal b{color:#e8c97a}
#goal .k{color:#8dbf6a}
#pin{position:fixed;top:calc(40px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:15;
 background:rgba(28,24,16,.95);border:1px solid #574a2e;border-radius:6px;padding:4px 12px;font-size:12px;white-space:nowrap}
#pin b{color:#e8c97a}
#side{position:fixed;right:8px;top:calc(40px + env(safe-area-inset-top));z-index:18;width:330px;max-height:calc(100vh - 130px);
 overflow-y:auto;background:rgba(28,24,16,.97);border:1px solid #574a2e;border-radius:8px;padding:10px 12px}
#side h3{color:#f2e8cd;font-size:14.5px;margin-bottom:4px}
#side h3 small{color:#a2977c;font-weight:400;font-size:11.5px;margin-left:6px}
#side .row{margin:3px 0;font-size:12.5px;line-height:1.5}
#side .hint{color:#a2977c;font-size:11.5px;line-height:1.5;margin-top:5px}
#side .warn{color:#d9a441;font-size:12px;margin-top:3px}
#side .good{color:#8dbf6a;font-size:12px;margin-top:3px}
#side hr{border:none;border-top:1px solid #3b3222;margin:7px 0}
.ab{display:block;width:100%;text-align:left;margin:3px 0;background:#2b2418;border:1px solid #4a3f28;color:#ddd2b4;
 border-radius:5px;padding:6px 8px;font-size:12px;line-height:1.4}
.ab:hover:not(:disabled){background:#392f1f;border-color:#8a7440}
.ab:disabled{opacity:.4;cursor:default}
.ab .s{display:block;color:#a2977c;font-size:11px;margin-top:1px}
.ab .c{float:right;color:#c9a44a;font-size:11px}
.ab.on{border-color:#c9a44a;background:#3a3020}
.bar{height:7px;background:#1c1810;border:1px solid #3b3222;border-radius:3px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%}
#logW{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:14;width:min(420px,52vw)}
#logH{display:flex;align-items:center;gap:6px;background:rgba(28,24,16,.96);border:1px solid #574a2e;border-radius:6px 6px 0 0;
 padding:3px 9px;font-size:11.5px;color:#a2977c;cursor:pointer}
#logW.cl #logH{border-radius:6px}#logW.cl #logB{display:none}
#logH .u{margin-left:auto;background:#7a2620;border:1px solid #c36a52;color:#ffd9c9;border-radius:8px;padding:0 6px;font-size:10.5px}
#logB{max-height:24vh;overflow-y:auto;background:rgba(22,19,12,.94);border:1px solid #574a2e;border-top:none;
 border-radius:0 0 6px 6px;padding:5px 9px;font-size:11.5px;line-height:1.5}

#logB p.g{color:#8dbf6a}#logB p.b{color:#d9584a}#logB p.j{color:#d8926a}
#logB p.h{color:#e8c97a}#logB p.s{color:#7fb6e0}#logB p.k{color:#c0a0e0}

#mb{width:min(900px,96vw);max-height:90vh;overflow:auto;background:#1c1810;border:1px solid #6b5a34;border-radius:10px;padding:16px 20px}
#mb h2{color:#f2e8cd;font-size:19px;margin-bottom:6px}
#mb h2 small{display:block;color:#a2977c;font-size:12px;font-weight:400;margin-top:3px}
#mb p{margin:6px 0;font-size:12.5px;line-height:1.7}
#mb .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.mb2{background:#5c3d16;border:1px solid #c3a052;color:#ffeccb;padding:7px 16px;border-radius:6px;font-size:13px}
.mb2.gh{background:#2b2418;border-color:#574a2e;color:#ddd2b4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:7px}
.card{border:1px solid #4a3f28;background:#241f14;border-radius:7px;padding:8px 10px;font-size:12px}
.card.ok{cursor:pointer}.card.ok:hover{border-color:#8a7440}
.card.done{border-color:#4f7a3a;background:#1e2716}.card.done .t{color:#8dbf6a}
.card.cur{border-color:#c9a44a;box-shadow:0 0 8px rgba(201,164,74,.4)}
.card.lock{opacity:.42}
.card .t{color:#f2e8cd;font-size:12.5px}
.card .d{color:#a2977c;font-size:11px;margin-top:2px;line-height:1.4}
.card .fx{color:#c9a44a;font-size:11px;margin-top:2px}
.slot{border:1px dashed #6b5a34;border-radius:6px;padding:6px 8px;min-height:46px;background:#211c12;font-size:12px}
.slot.mil{border-color:#8a4a3a}.slot.eco{border-color:#8a7a3a}.slot.pol{border-color:#5a6a8a}
.pc{display:inline-block;border:1px solid #6b5a34;background:#2b2418;border-radius:5px;padding:3px 8px;margin:2px;font-size:11.5px;cursor:pointer}
.pc:hover{border-color:#c9a44a}
.pc.mil{border-left:3px solid #c4674f}.pc.eco{border-left:3px solid #c9a44a}.pc.pol{border-left:3px solid #7f9fd0}
table.h{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
table.h td,table.h th{border-bottom:1px solid #3b3222;padding:4px 6px;text-align:left}
table.h th{color:#a2977c;font-weight:600}
table.h td.n{text-align:right;font-variant-numeric:tabular-nums;color:#f2e8cd}
@media(max-width:760px){
 #side{width:min(90vw,330px);top:auto;bottom:calc(66px + env(safe-area-inset-bottom));max-height:44vh}
 #logW{width:50vw}#logB{max-height:16vh;font-size:10.5px}
 #top{gap:6px;font-size:11.5px;padding:4px 6px}#top .r{font-size:11px}
 #goal{max-width:48vw;font-size:11px;padding:5px 7px}
 #pin{font-size:10.5px;padding:3px 7px;top:calc(38px + env(safe-area-inset-top))}
}
</style>
</head>

<script>

function pxHex(px, py) {

function tap(px, py) {

function updHover(px, py) {
