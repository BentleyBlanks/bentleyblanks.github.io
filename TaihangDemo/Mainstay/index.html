function jpDivisions(y) { return y <= 1937 ? 16 : y === 1938 ? 24 : y === 1939 ? 26 : y === 1940 ? 27 : y === 1941 ? 28 : y === 1942 ? 26 : y === 1943 ? 24 : y === 1944 ? 25 : 26; }
// ══════════ 工具 ══════════
let rng = Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
const key=(q,r)=>q+","+r;
const W=CFG.W,H=CFG.H,SQ3=Math.sqrt(3);
function inb(q,r){return q>=0&&q<W&&r>=0&&r<H}
function nbrs(q,r){const e=r%2===0;const d=e?[[1,0],[-1,0],[0,1],[0,-1],[-1,1],[-1,-1]]:[[1,0],[-1,0],[0,1],[0,-1],[1,1],[1,-1]];const o=[];for(const[a,b]of d){const nq=q+a,nr=r+b;if(inb(nq,nr))o.push([nq,nr])}return o}
function hexCenter(q,r){const s=CFG.hex;return[s*SQ3*(q+0.5*(r&1))+s,s*1.5*r+s]}
function d2s(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+dd}
function s2d(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)}
function cnDate(d){return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日"}

// ══════════ 状态与地图 ══════════
let S = null;
function newGame(seed) {
  rng = mulberry32(seed || 424242);
  // 区域格子: 以 seed 点做 Voronoi 生长, 形成连片"省份"
  const cells = [];
  for (let q = 0; q < W; q++) { cells[q] = []; for (let r = 0; r < H; r++) {
    let best = 0, bd = 1e9;
    for (let i = 0; i < REG.length; i++) {
      const [sq, sr] = REG[i].seed;
      const d = (q - sq) ** 2 * 1.0 + (r - sr) ** 2 * 1.35;
      if (d < bd) { bd = d; best = i; }
    }
    cells[q][r] = bd > 46 ? -1 : best;   // 太远的格子留白(边界外)
  } }
  const regs = REG.map((r, i) => ({
    ...r, idx: i, ctrl: r.ctrl, pop0: r.pop, pop: r.pop,
    jp: (r.jpBase || 0) + (r.city ? 0 : 0.6), pup: r.city ? 1.2 : 0.5,
    sweep: 0, sweepT: 0, warn: 0, pendScale: 0, ruin: 0, cells: [],
  }));
  for (let q = 0; q < W; q++) for (let r = 0; r < H; r++) { const i = cells[q][r]; if (i >= 0) regs[i].cells.push([q, r]); }
  for (const r of regs) {
    let sx = 0, sy = 0;
    for (const [a, b] of r.cells) { const [x, y] = hexCenter(a, b); sx += x; sy += y; }
    r.cx = sx / Math.max(1, r.cells.length); r.cy = sy / Math.max(1, r.cells.length);
  }
  S = {
    date: s2d(CFG.start), endDate: s2d(CFG.end), speed: 0, over: false, result: null, started: false,
    cells, regs, units: [], nextId: 1,
    man: 6, food: 300, ammo: 120, pol: 20, mass: 20, expo: 0,
    focusDone: {}, focusCur: null, focusLeft: 0,
    techDone: {}, techCur: null, techLeft: 0,
    prod: { ammo: 0.5, food: 0.3, gear: 0.2 },
    evDone: {}, phase: 1, hardTimes: false, sweepPower: 1, kmtFront: 100,
    stats: { jpKill: 0, pupKill: 0, ownLoss: 0, sweeps: 0, sweepsHeld: 0, popPeak: 0, defect: 0 },
    log: [],
  };
  // 起手: 三个师的骨干
  addUnit("zhulì", "jcj", "一一五师主力"); addUnit("zhulì", "jsui", "一二〇师主力"); addUnit("zhulì", "taih", "一二九师主力");
  addUnit("difang", "taih", "太行军分区");
  return S;
}
function addUnit(type, regId, name) {
  const t = UT[type];
  const u = { id: S.nextId++, type, name: name || t.name, reg: regId, mission: "fadong",
    str: 100, org: 100, exp: 0, eq: 70 };
  S.units.push(u); return u;
}
function reg(id) { return S.regs.find(r => r.id === id); }
function unitsIn(id) { return S.units.filter(u => u.reg === id); }
function baseArea() { return S.regs.filter(r => r.ctrl >= 50); }
function guerrillaArea() { return S.regs.filter(r => r.ctrl >= 15 && r.ctrl < 50); }
// 根据地人口(百万): 控制度≥50 全额, 15-50 折半
function popControlled() {
  let p = 0;
  for (const r of S.regs) { if (r.ctrl >= 50) p += r.pop * (0.5 + r.ctrl / 200); else if (r.ctrl >= 15) p += r.pop * r.ctrl / 200; }
  return p;
}
function totalPop() { return S.regs.reduce((a, r) => a + r.pop, 0); }
function armySize() { return S.units.reduce((a, u) => a + UT[u.type].man * u.str / 100, 0); }
// 牵制日军师团(中流砥柱的量化): 根据地规模 + 近期作战强度
function pinnedDiv() {
  const y = S.date.getFullYear();
  const tot = jpDivisions(y);
  const popR = popControlled() / totalPop();
  const opsR = clamp(S.opsPressure || 0, 0, 1);
  const r = clamp(popR * 0.62 + opsR * 0.28 + (S.focusDone.baituan ? 0.05 : 0), 0, 0.72);
  return { tot, ours: Math.round(tot * r), ratio: r };
}
function pinnedPuppet() { return clamp(0.55 + popControlled() / totalPop() * 0.55, 0, 0.98); }
function log(msg, cls) {
  S.log.push({ msg, cls, d: d2s(S.date) });
  if (S.log.length > 200) S.log.shift();
  if (typeof pushLog === "function") pushLog(msg, cls);
}
function addKill(s, n) { s.stats.jpKill += n; }
function killOwn(s, frac) {
  for (const u of s.units) { const l = u.str * frac; u.str = Math.max(6, u.str - l); s.stats.ownLoss += l * UT[u.type].man * 10000 / 100; }
}
// ══════════ 修正值(国策/科技的实际效果) ══════════
function M() {
  const f = S.focusDone, t = S.techDone;
  return {
    ctrlMul: 1 + (f.genjudi ? .20 : 0) + (f.fangong ? .35 : 0) + (t.minyun ? .25 : 0) + (f.jidiren ? .15 : 0),
    mtnMul: f.shandi ? 1.25 : 1,
    atkMul: 1 + (t.youji1 ? .15 : 0) + (t.youji2 ? .18 : 0) + (f.fangong ? .25 : 0) + (f.jidiren ? .2 : 0),
    lossMul: (f.shandi ? .85 : 1) * (t.medic ? .72 : 1) * (f.zhengfeng ? .9 : 1),
    upkeepMul: f.jingbing ? .65 : 1,
    foodMul: 1 + (f.jianzu ? .25 : 0) + (f.dashengchan ? .4 : 0),
    ammoMul: 1 + (t.arsenal ? .5 : 0) + (f.dashengchan ? .25 : 0),
    manMul: 1 + (f.jianzu ? .2 : 0) + (t.minyun ? .25 : 0),
    sweepDefPlain: (t.tunnel ? .75 : 1) * (f.didao ? .6 : 1),
    sweepKill: 1 + (t.mine ? .5 : 0) + (f.didao ? .5 : 0),
    defMul: 1 + (f.wuzhuang ? .25 : 0),
    polDay: .12 + (f.luochuan ? .15 : 0) + (f.sansan ? .2 : 0) + (f.zhengfeng ? .35 : 0),
    recover: 1 + (t.medic ? .6 : 0) + (f.dashengchan ? .2 : 0),
    slots: 2 + (t.radio ? 1 : 0),
  };
}
// ══════════ 日推进 ══════════
function tick() {
  if (S.over) return;
  const m = M();
  const day = S.date;
  // 1) 国策 / 研究
  if (S.focusCur) { S.focusLeft--; if (S.focusLeft <= 0) completeFocus(S.focusCur); }
  if (S.techCur) { S.techLeft--; if (S.techLeft <= 0) completeTech(S.techCur); }
  S.pol += m.polDay;
  // 2) 区域演化
  let ops = 0, ammoUse = 0, foodUse = 0;
  for (const r of S.regs) {
    const tb = TERRB[r.terr];
    const us = unitsIn(r.id);
    let ctrlD = 0, expoD = 0;
    for (const u of us) {
      const mi = MISSION[u.mission], ut = UT[u.type];
      const eff = (u.str / 100) * (0.45 + 0.55 * u.org / 100) * (0.5 + 0.5 * u.eq / 100);
      // 控制度: 群众工作是根本, 攻坚拔点直接夺地
      let cg = mi.ctrl * eff * tb.growth * m.ctrlMul * (r.terr === "山地" ? m.mtnMul : 1);
      if (r.city) cg *= 0.35;
      cg *= (0.55 + S.mass / 140);
      ctrlD += cg * CFG.baseGrowth * 6;
      expoD += mi.expo * eff * 0.55;
      // 歼敌
      if (mi.kill > 0) {
        const k = mi.kill * eff * ut.atk * m.atkMul * (1 + u.exp / 260) * 3.4;
        S.stats.jpKill += k * 0.62; S.stats.pupKill += k * 1.5;
        ops += mi.kill * eff * 0.09;
        // 伤亡与消耗
        const loss = mi.risk * eff * m.lossMul * (r.city ? 1.4 : 1) * (1 - Math.min(.35, u.exp / 300)) * 0.55;
        u.str = Math.max(5, u.str - loss);
        u.org = Math.max(8, u.org - loss * 1.6);
        S.stats.ownLoss += loss * ut.man * 100;
        u.exp = Math.min(100, u.exp + 0.055);
        ammoUse += ut.ammo * mi.kill * 0.5;
      }
      // 整训: 恢复
      if (u.mission === "jianshe") { u.str = Math.min(100, u.str + 0.42 * m.recover); u.org = Math.min(100, u.org + 1.1 * m.recover); }
      else { u.org = Math.min(100, u.org + 0.28); }
      foodUse += ut.man * ut.up * m.upkeepMul * 0.16;
      ammoUse += ut.ammo * ut.up * m.upkeepMul * 0.02;
    }
    // 无部队区域: 控制度缓慢衰减(群众自发)
    if (!us.length) ctrlD -= r.ctrl > 0 ? 0.012 : 0;
    // 日军驻军压制
    ctrlD -= r.jp * 0.016 * (r.city ? 2.2 : 1);
    if (r.sweepT > 0) ctrlD -= 0.55 * S.sweepPower * tb.sweep;
    r.ctrl = clamp(r.ctrl + ctrlD, 0, 100);
    S.expo += expoD * 0.02;
    // 人口恢复(被三光过的区域慢慢回血)
    if (r.pop < r.pop0 && r.sweepT <= 0) r.pop = Math.min(r.pop0, r.pop + r.pop0 * 0.00035 * (1 + S.mass / 120));
    if (r.sweepT > 0) r.sweepT--;
  }
  S.opsPressure = (S.opsPressure || 0) * 0.985 + ops * 0.015;
  S.expo = clamp(S.expo * 0.994, 0, 100);
  // 3) 经济
  const pc = popControlled();
  const foodIn = pc * 0.085 * m.foodMul * (S.hardTimes ? 0.72 : 1);
  const ammoIn = (0.2 + pc * 0.035) * m.ammoMul * (S.hardTimes ? 0.8 : 1);
  const manIn = pc * 0.0013 * m.manMul * (1 + S.mass / 180);
  S.food = Math.max(0, S.food + foodIn - foodUse);
  S.ammo = Math.max(0, S.ammo + ammoIn - ammoUse);
  S.man += manIn;

// ══════════ 日军扫荡: 残酷性的主要来源, 但玩家有解 ══════════
function jpSweepLogic() {

  const pressure = (S.expo / 100 * 0.6 + popControlled() / totalPop() * 0.75) * era * S.sweepPower;

  const scale = (0.6 + rng() * 0.7) * era * S.sweepPower * (1 + popControlled() / 22);

}
// 扫荡落地结算
function resolveSweep(tgt) {

  const us = unitsIn(tgt.id);
  let def = 0;

    def += (u.str / 100) * (0.4 + 0.6 * u.org / 100) * UT[u.type].atk * (mi.defend || 0.6) * m.defMul;

  const power = scale * CFG.sweepBase * plainMul;
  const held = def * 26 > power * 0.62;
  // 损失结算
  const ctrlLoss = clamp(power / (def * 6 + 12) * 12, 3, 46) * (held ? 0.45 : 1);

  tgt.ruin = Math.min(1, tgt.ruin + popLoss);
  S.mass = Math.max(0, S.mass - popLoss * 22);

  S.stats.jpKill += killed * 0.55; S.stats.pupKill += killed * 1.2;

  log("⚔ 日军「扫荡」" + tgt.name + "(约" + scale.toFixed(1) + "个师团当量): 控制-" + ctrlLoss.toFixed(0)
    + ", 群众伤亡流离 " + popTxt + " 万" + (held ? " — 我军依托地形与地道顶住了, 歼敌 " + Math.round(killed) + " 人" : " — 未能挡住, 根据地被切割"),
    held ? "h" : "b");
  if (!held && tgt.terr === "平原" && !S.focusDone.didao && !S.techDone.tunnel && !S.tunnelHint) {
    S.tunnelHint = true; log("提示: 平原无险可守 — 研究【地道工程】或推进国策【地道战·地雷战】可大幅减少损失", "s");

}

  const wx = (px + cam.x) / cam.zoom, wy = (py + cam.y) / cam.zoom;
  let best = null, bd = 1e9;
  for (let q = 0; q < W; q++) for (let r = 0; r < H; r++) {
    if (S.cells[q][r] < 0) continue;
    const [cx, cy] = hexCenter(q, r);
    const d = (cx - wx) ** 2 + (cy - wy) ** 2;
    if (d < bd) { bd = d; best = S.cells[q][r]; }
  }
  return bd < (CFG.hex * 1.15) ** 2 ? S.regs[best] : null;
}
function handleTap(px, py) {
  if (!S || !S.started || S.over) return;
  tapDone = true;
  const r = pxToReg(px, py);
  if (!r) { selReg = null; selUnit = null; refresh(); return; }
  // 选中部队时点别的区域 = 调动
  if (selUnit) {
    const u = S.units.find(x => x.id === selUnit);
    if (u && u.reg !== r.id) {
      const cap = M().slots + 2;
      if (unitsIn(r.id).length >= cap) { pushLog(r.name + "容纳不下更多部队(上限 " + cap + ")", "j"); }
      else { u.reg = r.id; u.org = Math.max(20, u.org - 12); log(u.name + " 转移至 " + r.name, "k"); selReg = r.id; refresh(); return; }
    }
  }
  selReg = r.id;
  const us = unitsIn(r.id);
  if (!us.some(u => u.id === selUnit)) selUnit = us.length ? us[0].id : null;
  refresh();
}
cv.addEventListener("pointerdown", e => { drag = true; dmoved = false; tapDone = false; downPt = [e.clientX, e.clientY]; lastPt = [e.clientX, e.clientY]; });
cv.addEventListener("pointermove", e => {
  if (drag && lastPt && downPt) {
    if (Math.abs(e.clientX - downPt[0]) + Math.abs(e.clientY - downPt[1]) > 10) dmoved = true;
    if (dmoved) { cam.x -= e.clientX - lastPt[0]; cam.y -= e.clientY - lastPt[1]; lastPt = [e.clientX, e.clientY]; draw(); return; }
  }
  if (drag || e.pointerType === "touch" || !S || !S.started) return;
  const r = pxToReg(e.clientX, e.clientY);
  const id = r ? r.id : null;
  if (id !== hoverReg) { hoverReg = id; draw(); }
});
cv.addEventListener("pointerleave", () => { if (hoverReg) { hoverReg = null; draw(); } });
cv.addEventListener("pointercancel", () => { drag = false; dmoved = false; });
cv.addEventListener("pointerup", e => { drag = false; if (dmoved || tapDone) return; handleTap(e.clientX, e.clientY); });
cv.addEventListener("click", e => { if (!dmoved && !tapDone) handleTap(e.clientX, e.clientY); });
cv.addEventListener("wheel", e => { e.preventDefault(); const z = clamp(cam.zoom * (e.deltaY > 0 ? .9 : 1.11), .35, 2), wx = (e.clientX + cam.x) / cam.zoom, wy = (e.clientY + cam.y) / cam.zoom; cam.zoom = z; cam.x = wx * z - e.clientX; cam.y = wy * z - e.clientY; draw(); }, { passive: false });
cv.addEventListener("touchmove", e => { if (e.touches.length === 2) { e.preventDefault(); const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (pinchD) { cam.zoom = clamp(cam.zoom * d / pinchD, .35, 2); draw(); } pinchD = d; } }, { passive: false });
cv.addEventListener("touchend", () => { pinchD = 0; });
addEventListener("keydown", e => {
  if (modalOpen()) return;
  if (e.code === "Space") { e.preventDefault(); setSpeed(S.speed ? 0 : 1); }
  if (e.key >= "0" && e.key <= "3") setSpeed(+e.key);
});
for (let i = 0; i < 4; i++) $("s" + i).addEventListener("click", () => setSpeed(i));
$("bFocus").addEventListener("click", showFocus);
$("bTech").addEventListener("click", showTech);
$("bProd").addEventListener("click", showProd);
$("bStat").addEventListener("click", showStat);
$("bHelp").addEventListener("click", showHelp);
$("logH").addEventListener("click", () => toggleLog());
addEventListener("resize", () => { syncCv(); draw(); });
// ══════════ 主循环 ══════════
let acc = 0, last = 0, saveT = 0;
function loop(t) {
  if (!last) last = t;
  const dt = Math.min(500, t - last); last = t;
  if (S && S.started && !S.over && S.speed > 0 && !modalOpen()) {
    acc += dt;
    const per = CFG.tickMs / (S.speed === 1 ? 1 : S.speed === 2 ? 2.4 : 5);
    let n = 0;
    while (acc >= per && n < 12) { acc -= per; tick(); n++; if (S.over || modalOpen()) break; }
    if (n) { refresh(); saveT += n; if (saveT > 60) { saveT = 0; save(); } }
  }
  requestAnimationFrame(loop);
}
// ══════════ 启动 ══════════
applyLog();
syncCv();
newGame();
centerCam();
refresh();
showHelp();
requestAnimationFrame(loop);

</script>
