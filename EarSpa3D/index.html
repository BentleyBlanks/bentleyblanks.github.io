<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- Three.js 0.185.1 is used under the MIT License: https://github.com/mrdoob/three.js/blob/dev/LICENSE -->
<title>采耳物语 · EarSpa3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<meta name="description" content="写实采耳模拟：照明、软化、托起与夹取，观察客人反馈，升级器具并经营工作间。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="Style_Chunk.css?v=ear040-render-settings-20260912">
<style>
  /* 首屏骨架：样式表可能还没到，先给出与基调一致的底色，避免白闪 */
  html { background: #141210; }

  /* 画布尺寸必须在这里兜一层。
     three 的 setSize(w, h, false) **不改画布样式**，只改绘制缓冲；画布的 CSS 尺寸
     得由样式表给。而样式表是异步的——在它生效之前 canvas 是浏览器默认的 300×150，
     于是 ResizeObserver 量到 300×150，就把渲染器也设成 300×150，整局游戏只画在
     左上角一个邮戳大的方块里，画布外全是 body 背景。这个坑花了一整轮排查，
     所以关键尺寸不再依赖异步样式表，直接与 .ear-scene 写一致。 */
  #ear-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

  #ear-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              flex-direction: column; gap: 18px; z-index: 900;
              font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
              color: #d8c2a8; letter-spacing: .18em;
              background: radial-gradient(120% 90% at 50% 20%, #2c241b 0%, #171411 60%, #100f0d 100%); }
  #ear-boot .ring { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #d6b98526; border-top-color: #d6b985;
                    animation: earSpin 1400ms linear infinite; }
  #ear-boot .boot-title { font-family: "Palatino Linotype", "Times New Roman", serif; font-size: 27px; letter-spacing: .2em; }
  #ear-boot .boot-note { font-size: 11px; color: #b3a596; }
  @media (prefers-reduced-motion: reduce) { #ear-boot .ring { animation: none; } }
  @keyframes earSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<!-- 引导期间保留全屏画布，启动后移入 #play-stage；轻量 HUD 沿视口边缘排列。 -->
<div id="ear-stage">
  <canvas id="ear-canvas" class="ear-scene"></canvas>
</div>

<div id="ear-boot" role="status"><div class="boot-title">EAR CARE</div><div class="ring"></div><div class="boot-note">正在准备工作间…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js?v=ear013-fixed-rotation-20260912",
    "./vendor/three/build/three.module.js": "./vendor/three/build/three.module.js?v=ear013-fixed-rotation-20260912"
  }
}
</script>

<script type="module">
  // 引导壳：只负责启动整块采耳入口，并显示可读的启动错误。
  // 真正的游戏逻辑一行都不在这里——这里出错是最难查的那种，保持它足够小。
  const boot = document.getElementById("ear-boot");
  try {
    const mod = await import("./Script_ChunkGame.js?v=ear040-render-settings-20260912");
    await mod.Start();
  } catch (error) {
    console.error(error);
    if (boot) {
      boot.innerHTML = "";
      const box = document.createElement("div");
      box.style.cssText = "max-width:32rem;padding:24px;text-align:center;line-height:1.7";
      const title = document.createElement("div");
      title.style.cssText = "font-size:18px;color:#e0cbb4;margin-bottom:8px";
      title.textContent = "没能启动";
      const detail = document.createElement("div");
      detail.style.cssText = "font-size:13px;color:#b3a596;word-break:break-all";
      detail.textContent = String(error && error.message ? error.message : error);
      box.append(title, detail);
      boot.append(box);
    }
  }
</script>
</body>
</html>
