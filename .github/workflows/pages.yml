# GitHub Pages 部署。
#
# 为什么不用默认的分支构建：站点已经 416MB / 2000+ 个文件（几个 Godot wasm、
# 十几段序章短片、几十兆 BGM），老式 legacy 构建器在这个体量上稳定超时——
# 2026-08-06 起连续 errored，线上因此卡在旧版本好几轮没人发现。
# `.nojekyll` 只是关掉 Jekyll 处理，救不了超时。
#
# Actions 只导出滕县与两件必需的共用草席模型；其他项目、旧首页与完整历史仅在 Git / 本地保留。
name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 组名不能叫 `pages`：那是 GitHub 内建 Pages 部署占用的组，撞上去会被它连坐
# 取消（那次白等了二十分钟——job 一个 runner 都没拿到就 cancelled）。
#
# cancel-in-progress 必须是 **true**。原来写 false，本意是「别打断正在发布的
# 那个」——可**一个卡在 queued、始终分不到 runner 的 job，在并发闸门看来跟
# "正在发布"没有区别**：2026-08-07 有个 job 排了两小时四十分没拿到机器，
# 后面每次推送都堵在它身后（GitHub 只留最新一个 pending、其余 cancelled），
# 线上因此停在两个多小时前的版本，还得手动 gh run cancel 才化开。
# 排队卡死 GitHub 要 24 小时才收，timeout-minutes 也救不了——那只管执行时间。
# 站点按最新提交构建，永远是「最新一版赢」，被顶掉的那个本来就该被顶掉。
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare the publication workspace
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          node Taierzhuang1938/Script_ModuleGraphTest.mjs
          mkdir -p "$RUNNER_TEMP/pages"
          node scripts/Script_PublishScopeTest.mjs
          git archive HEAD Taierzhuang1938 Model/StrawSleepingMat/Model_StrawSleepingMatFlat.glb Model/StrawSleepingMat/Model_StrawSleepingMatRolled.glb | tar -x -C "$RUNNER_TEMP/pages"
      - uses: actions/cache/restore@v4
        id: gpu-assets
        with:
          path: ${{ runner.temp }}/tengxian-gpu-cache
          key: tengxian-gpu-${{ runner.os }}-v1-${{ hashFiles('Taierzhuang1938/Texture/**', 'Taierzhuang1938/Model/**/*.glb', 'Taierzhuang1938/*Publish*.mjs', 'Taierzhuang1938/Script_AstcEncoder.mjs', 'Taierzhuang1938/Script_TextureImportPixels.mjs', 'Taierzhuang1938/Script_TextureImport*.mjs', 'Taierzhuang1938/Data_TextureImportSettings.json', 'Taierzhuang1938/Data_TextureManifest.mjs', 'package.json') }}
          restore-keys: |
            tengxian-gpu-${{ runner.os }}-v1-
      - name: Build and validate GPU publication assets
        run: |
          set -o pipefail
          # Keep live encoder output and expose the actionable error in check annotations.
          if node Taierzhuang1938/Script_BuildPublishAssets.mjs --output-dir "$RUNNER_TEMP/pages/Taierzhuang1938" --cache-dir "$RUNNER_TEMP/tengxian-gpu-cache" 2>&1 | tee "$RUNNER_TEMP/gpu-build.log"; then
            :
          else
            message=$(tail -c 6000 "$RUNNER_TEMP/gpu-build.log")
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            printf '::error title=GPU asset build failed::%s\n' "$message"
            exit 1
          fi
          node Taierzhuang1938/Script_ValidatePublishAssets.mjs --output-dir "$RUNNER_TEMP/pages/Taierzhuang1938"
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/pages/Taierzhuang1938/Data_AssetPublishReport.json")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"### GPU assets\n\n```json\n"+JSON.stringify({summary:r.summary,cache:r.cache,retained:r.skipped.length},null,2)+"\n```\n");'
      - uses: actions/cache/save@v4
        if: steps.gpu-assets.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/tengxian-gpu-cache
          key: ${{ steps.gpu-assets.outputs.cache-primary-key }}
      # 仓库里的 import map 只登记、不写 ?v=：按每个文件此刻的内容盖戳（排在 GPU 资源改写之后、打包读 index.html 之前）。
      - name: Stamp the Tengxian import maps by content
        run: node Taierzhuang1938/Script_StampImportMaps.mjs --output-dir "$RUNNER_TEMP/pages/Taierzhuang1938"
      - name: Build the Tengxian browser entry
        run: |
          node Taierzhuang1938/Script_BuildBrowserBundle.mjs --deploy --output-dir "$RUNNER_TEMP/pages/Taierzhuang1938"
      - name: Verify GPU loaders against published assets
        run: |
          npx playwright-core install --with-deps chromium
          node Taierzhuang1938/Script_PublishAssetsBrowserTest.mjs --software --report="$RUNNER_TEMP/pages/Taierzhuang1938/Data_AssetPublishReport.json"
      # 发布包瘦身：删掉网页不加载的源文件与工具目录（清单与理由在 scripts/Script_PublishPrune.mjs），再报体积；
      # 超过预算就失败（GitHub Pages 规定发布站点不超过 1 GB，现在超，先按预算只降不升）。排在 GPU 资源验收之后、上传之前。
      - name: Prune non-runtime files and check the publication size
        run: |
          node scripts/Script_PublishPrune.mjs --check
          node scripts/Script_PublishPrune.mjs "$RUNNER_TEMP/pages"
          node scripts/Script_PublishScope.mjs "$RUNNER_TEMP/pages"
          node scripts/Script_PublishScope.mjs --check "$RUNNER_TEMP/pages"
          node scripts/Script_PublishPrune.mjs --report "$RUNNER_TEMP/pages"
      - uses: actions/configure-pages@v5
      # 仅上传滕县发布副本；仓库原始首页、其他项目与历史资产继续供本地预览。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - id: deployment
        uses: actions/deploy-pages@v4
