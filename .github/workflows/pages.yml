# GitHub Pages 部署。
#
# 为什么不用默认的分支构建：站点已经 416MB / 2000+ 个文件（几个 Godot wasm、
# 十几段序章短片、几十兆 BGM），老式 legacy 构建器在这个体量上稳定超时——
# 2026-08-06 起连续 errored，线上因此卡在旧版本好几轮没人发现。
# `.nojekyll` 只是关掉 Jekyll 处理，救不了超时。
#
# 走 Actions 就是纯粹的「打包 → 上传 → 发布」，没有 Jekyll，也不受那个超时约束。
name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 组名不能叫 `pages`：那是 GitHub 内建 Pages 部署占用的组，撞上去会被它连坐
# 取消（那次白等了二十分钟——job 一个 runner 都没拿到就 cancelled）。
#
# cancel-in-progress 必须是 **true**。原来写 false，本意是「别打断正在发布的
# 那个」——可**一个卡在 queued、始终分不到 runner 的 job，在并发闸门看来跟
# "正在发布"没有区别**：2026-08-07 有个 job 排了两小时四十分没拿到机器，
# 后面每次推送都堵在它身后（GitHub 只留最新一个 pending、其余 cancelled），
# 线上因此停在两个多小时前的版本，还得手动 gh run cancel 才化开。
# 排队卡死 GitHub 要 24 小时才收，timeout-minutes 也救不了——那只管执行时间。
# 站点没有构建步骤，永远是「最新一版赢」，被顶掉的那个本来就该被顶掉。
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/configure-pages@v5
      # 整个仓库就是站点（没有构建步骤，各 demo 的产物都已提升到服务根，
      # 见 _dev/ 各自的部署说明）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
