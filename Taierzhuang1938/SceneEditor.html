<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>场景编辑器 · 血战滕县</title>
  <link rel="stylesheet" href="./Style_SceneEditor.css?v=20261031240000">
  <!--
    场景编辑器（docs/Data_Scene.md §6）。导入表不在这里另抄一份版本戳：开机先同步读 index.html 里那张 import map
    （线上发布的 index.html 也保留它），插进来再起主程序，模块版本永远跟游戏一致。
  -->
  <script>
    (function () {
      var map = '{"imports":{}}';
      try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "./index.html", false);
        xhr.send();
        var found = /<script type="importmap">([\s\S]*?)<\/script>/.exec(xhr.responseText);
        if (found) map = found[1];
      } catch (error) { console.error("[SceneEditor] 读不到 index.html 的 import map", error); }
      var script = document.createElement("script");
      script.type = "importmap";
      script.textContent = map;
      document.currentScript.after(script);
    })();
  </script>
  <script type="module">import("./Script_SceneEditor.mjs").catch((error) => { document.getElementById("seStatus").textContent = "场景编辑器起不来：" + error.message; console.error(error); });</script>
</head>
<body>
  <header class="seBar">
    <div class="seTitle"><span class="seEyebrow">台儿庄 · 血战滕县</span><h1>场景编辑器</h1></div>
    <label class="seScenePick">场景 <select id="seScene" aria-label="场景"></select></label>
    <div class="seActions">
      <span id="seDirty" class="seDirty">读取中…</span>
      <button id="seUndo" title="撤销（Ctrl+Z）">撤销</button>
      <button id="seRedo" title="重做（Ctrl+Y）">重做</button>
      <button id="seReload" title="丢掉没保存的改动，重新读盘">重新读取</button>
      <button id="seDownload" title="把当前场景存成文件下载">下载</button>
      <button id="seSave" class="sePrimary" title="保存（Ctrl+S）">保存</button>
    </div>
  </header>
  <div id="seBanner" class="seBanner" role="alert" hidden></div>
  <main class="seMain">
    <aside class="seLeft">
      <div class="seTabs" role="tablist">
        <button id="seTabTree" class="seTab selected" role="tab">层级</button>
        <button id="seTabAssets" class="seTab" role="tab">资产</button>
      </div>
      <div id="sePaneTree" class="sePane">
        <input id="seSearch" type="search" placeholder="搜名字、分组、资产、材质…" aria-label="搜物件">
        <div id="seCount" class="seCount"></div>
        <div id="seTree" class="seTree" role="tree" aria-label="场景物件"></div>
      </div>
      <div id="sePaneAssets" class="sePane" hidden>
        <div id="seAssets" class="seAssets"></div>
      </div>
    </aside>
    <section class="seView" aria-label="场景视图">
      <canvas id="seCanvas" tabindex="0"></canvas>
      <div class="seTools">
        <div class="seToolGroup" id="seJumps"><span class="seToolLabel">段落</span></div>
        <div class="seToolGroup">
          <span class="seToolLabel">显示</span>
          <label class="seCheck"><input id="seShowBackdrop" type="checkbox" checked> 远景</label>
          <label class="seCheck"><input id="seShowHidden" type="checkbox"> 隐形墙</label>
        </div>
        <details class="seSignals"><summary>信号 <span id="seSignalCount"></span></summary><div id="seSignalList"></div></details>
        <button id="seBlockout" title="在白盒关卡编辑器里，从画面中心那一点打开">在白盒编辑器里看</button>
      </div>
      <div id="seHud" class="seHud"></div>
      <div class="seHelp">右键按住转视角 · WASD 移动 · Q/E 降/升 · Shift 加速 · 滚轮前后 · 中键平移 · 左键选、拖箭头移动、拖金圈转 · Ctrl 吸附 · F 看选中 · Del 删除 · Ctrl+D 复制</div>
    </section>
    <aside class="seRight">
      <h2>检视</h2>
      <div id="seInspector" class="seInspector"><p class="seMuted">在画面或层级里点一个物件。</p></div>
    </aside>
  </main>
  <footer id="seStatus" class="seStatus" role="status">正在读取场景…</footer>
</body>
</html>
