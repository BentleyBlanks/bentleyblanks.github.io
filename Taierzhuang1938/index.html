      }
    }
  </script>
  <!-- 照 importmap 全表下发 modulepreload：模块图有好几层深，浏览器要先拿到父模块
       才能发现子模块的 import —— 到 GitHub Pages 一层就是一秒多 RTT，实测
       （2026-08-26 OnlineStallAudit）坏网络下 120 秒只到 96 个请求、后几层最后十几秒
       才刚被发现，页面看着就像死在「正在夯地……」。这里让全部模块一口气并行开拉，
       深度不再乘 RTT。importmap 是唯一登记表（新增模块必须登记，见上），
       这段照表读，不许再手写第二份清单。
       连同 importmap 一起，这两段必须排在所有样式表**前面**：pending 的样式表会
       卡住后面内联脚本的执行，Google Fonts 挂住（墙内常态）就等于把下发一起拖死。 -->
  <script>
    {
      const map = JSON.parse(document.querySelector('script[type="importmap"]').textContent);
      for (const url of new Set(Object.values(map.imports))) {
        const link = document.createElement("link");
        link.rel = "modulepreload";
        link.href = url;
        document.head.appendChild(link);
      }
    }
  </script>
  <!-- Google Fonts 走异步换装（media=print 先不参与渲染，到货再换 all）：
       它是唯一的外网样式表，同步写法会在它挂住时把首屏和内联脚本一起卡死；
       异步写法下先用后备字体开机，字体到了自然换上（display=swap 本来就是这个观感）。
       本地预览与浏览器门禁不访问外网，避免把字体网络策略误报成游戏脚本错误。 -->
  <script>
    if (!/^(?:localhost|127(?:\.\d+){3})$/i.test(location.hostname)) {
      const fontPreconnect = document.createElement("link");
      fontPreconnect.rel = "preconnect";
      fontPreconnect.href = "https://fonts.googleapis.com";
      document.head.appendChild(fontPreconnect);
      const fontAssetPreconnect = document.createElement("link");
      fontAssetPreconnect.rel = "preconnect";
      fontAssetPreconnect.href = "https://fonts.gstatic.com";
      fontAssetPreconnect.crossOrigin = "anonymous";
      document.head.appendChild(fontAssetPreconnect);
      const fontStylesheet = document.createElement("link");
      fontStylesheet.rel = "stylesheet";
      fontStylesheet.href = "https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap";
      fontStylesheet.media = "print";
      fontStylesheet.addEventListener("load", () => { fontStylesheet.media = "all"; }, { once: true });
      document.head.appendChild(fontStylesheet);
    }
  </script>
  <!-- 打包字体。加载画面第一屏就要用，预加载省一次 swap 闪；URL 必须与
       Style_Interface.css 的 @font-face 逐字一致，写歪了就是两个 URL、下两遍。
       只预加载常规字重那三个：Bold 与 SemiBold 出现得晚，走 swap 就够。 -->
  <link rel="preload" as="font" type="font/woff2" href="./Font/Font_Title.woff2?v=20260924080000" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="./Font/Font_UiSans_Regular.woff2?v=20260924080000" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="./Font/Font_UiLatin_Regular.woff2?v=20260924080000" crossorigin>
  <link rel="stylesheet" data-interface-theme href="./Style_Interface.css?v=20260924080000">
  <link rel="stylesheet" href="./Style_Game.css?v=20260927150000">
  <!-- 菜单、加载与工具窗共用 Style_Interface.css；各表只定义对应布局。 -->
  <link rel="stylesheet" href="./Style_Menu.css?v=20260923011500">
  <!-- 编辑器套件的样式。出图模式下整棵 DOM 是 display:none，进不了任何一张截图。 -->
  <link rel="stylesheet" href="./Style_Editor.css?v=20260925010101">
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="boot">
    <!-- 加载画面的道具展示台：随机一件游戏内的 TZM 模型，可以拖着转（Script_BootProp）。
         转动跑在 worker 里，主线程建关卡卡多久都不影响它。 -->
    <canvas id="bootProp"></canvas>
    <div id="bootVeil"></div>
    <div id="bootHead">
      <div id="bootTitle">台儿庄：血战滕县</div>
      <div id="bootSub">一九三八年三月十四日 — 十八日 · 山东滕县</div>
    </div>
    <div id="bootCard">
      <div id="bootPropName"></div>
      <div id="bootPropNote"></div>
    </div>
    <!-- 加载画面上**只有「进 城」一个入口**。序章（CS_Chuchuan）2026-09-06 起退出
         选章、要并进第一关，这里原来那条「新版序章预览（开发）」链接跟着摘掉：
         玩家看得见的入口不许指向已经退出正片的内容。审片与出图仍走
         `?preview=CS_Chuchuan`（Script_Main 的 PREVIEW 分支、Script_CutsceneShot、
         Script_EditorTest 第 9 节都从 URL 直达，不依赖这颗按钮）。 -->
    <div id="bootFoot">
      <button id="bootStart" disabled>进 城</button>
      <div id="bootStep">正在夯地……</div>
      <div id="bootBar"><i></i></div>
    </div>
  </div>
  <!-- 主菜单。加载完成后盖在活场景上（Script_Menu 接管相机跑运镜）。
       出图模式与 ?menu=0 下它一直是空的，「进 城」那颗按钮照旧管用 —— 三个冒烟脚本都点它。 -->
  <div id="menu"></div>
  <!-- 开机守望（非模块脚本，模块图挂了它照样活着）。
       Script_Main 的模块图有一百五十多个文件，线上开一次机就是 150+ 个请求：
       任何一个没拉下来，整张图一行都不会执行 —— 页面无声钉死在「正在夯地……」，
       控制台有错、玩家看不见。这里兜三类死法：
       ① 模块脚本加载失败（刷新后最常见，多半是瞬断）→ 无声自动重刷一次，再断才亮明牌；
       ② 顶层抛异常（WebGL 上下文建不出来是刷新后的常客，也按瞬态处理）；
       ③ 模块图迟迟不到（慢网和断连分不清）→ 只亮牌给「重试」，不自动刷。
       进了游戏（#boot.gone）以后这里一概不插手。必须排在主模块 script 前面，
       不然接不到它的 error 事件。 -->
  <script>
    (() => {
      const AUTO_KEY = "tzBootAutoRetried";
      const BootVisible = () => {
        const boot = document.getElementById("boot");
        return !!boot && !boot.classList.contains("gone");
      };
      // 隐私模式下 sessionStorage 会抛；读不到就当「已经重试过」，宁可不自动刷。
      const Store = {
        get: () => { try { return sessionStorage.getItem(AUTO_KEY); } catch { return "1"; } },
        set: () => { try { sessionStorage.setItem(AUTO_KEY, "1"); } catch {} },
        clear: () => { try { sessionStorage.removeItem(AUTO_KEY); } catch {} },
      };
      let shown = false;
      let waiting = false;
      const Fail = (reason, transient, pending = false) => {
        if (!BootVisible()) return;
        if (transient && !Store.get()) { Store.set(); location.reload(); return; }
        const step = document.getElementById("bootStep");
        if (!step) return;
        if (!shown || waiting) step.textContent = (pending ? "加载较慢：" : "启动失败：") + reason;
        waiting = pending;
        shown = true;
        if (document.getElementById("bootRetry")) return;
        const button = document.createElement("button");
        button.id = "bootRetry";
        button.textContent = "重 试";
        button.style.cssText = "pointer-events:auto;cursor:pointer;"
          + "border:1px solid rgba(230,223,205,0.3);background:rgba(10,10,9,0.5);"
          + "color:#e6dfcd;font:inherit;font-size:13px;letter-spacing:0.2em;padding:6px 26px;";
        button.onclick = () => { Store.clear(); location.reload(); };
        step.after(button);
      };
      window.__bootGuardFail = Fail;
      window.__bootGuardDismiss = () => {
        Store.clear();
        shown = false;
        waiting = false;
        const button = document.getElementById("bootRetry");
        if (button) button.remove();
      };
      window.addEventListener("error", (event) => {
        const target = event.target;
        // 资源型：模块图里任何一个文件拉不下来，error 落在 <script> 元素上。
        // 样式与字体（LINK）失败不致命，不接手。
        if (target && target.tagName === "SCRIPT") {
          const file = String(target.src || "").split("/").pop().split("?")[0];
          Fail(`脚本没拉下来（${file || "未知文件"}），多半是网络瞬断`, true);
          return;
        }
        if (event.message) Fail(event.message, /webgl/i.test(event.message));
      }, true);
      setTimeout(() => {
        if (!window.__bootMainAlive) Fail("主程序仍在下载，请稍候；长时间没有变化时可重试", false, true);
      }, 25000);
    })();
  </script>
  <script type="module" src="./Script_Main.mjs?v=20260926213000"></script>
</body>
</html>
