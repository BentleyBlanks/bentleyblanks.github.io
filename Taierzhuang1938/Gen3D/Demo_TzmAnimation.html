<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeneratedSoldier TZM 骨骼动画演示</title>
  <style>
    body { margin: 0; overflow: hidden; background: #f5f5f5; font-family: system-ui, sans-serif; }
    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.92);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 320px;
      z-index: 10;
    }
    #ui h1 { margin: 0 0 6px; font-size: 15px; }
    #ui p { margin: 4px 0; font-size: 12px; color: #444; }
    #ui button { margin: 4px 4px 0 0; padding: 5px 10px; font-size: 12px; cursor: pointer; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three/build/three.module.js",
      "three/": "../vendor/three/"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <h1>GeneratedSoldier.tzm.json</h1>
    <p>来源：ImageGen 参考图 → 混元3D 图生3D → GlbToTzm 转换</p>
    <p>动画：运行时逐关节写 rotation（与《血战台儿庄》Actor 系统一致）</p>
    <p>三角面：<span id="tri">-</span> | Draw Call：<span id="draw">-</span></p>
    <button id="idle">Idle</button>
    <button id="walk">Walk</button>
    <button id="aim">Aim Rifle</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { LoadModel } from "../Script_MeshLoad.mjs";

    // 简单材质库（TZM 按材质名取）
    const materials = {
      uniform: new THREE.MeshStandardMaterial({ color: 0x7a8fa3, roughness: 0.9 }),
      skin: new THREE.MeshStandardMaterial({ color: 0xdabfa3, roughness: 0.8 }),
      steel: new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.7, roughness: 0.4 }),
      wood: new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.8 }),
      shoe: new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 }),
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f5f5);
    scene.fog = new THREE.Fog(0xf5f5f5, 3, 10);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);

    // 手动轨道（不依赖 examples/jsm 的 OrbitControls）。模型正面朝 -Z，
    // 故初始把相机放在 -Z 一侧看正面。
    const orbit = { target: new THREE.Vector3(0, 1.05, 0), radius: 2.9, theta: 0.0, phi: 1.15 };
    function updateCamera() {
      const r = orbit.radius;
      const x = orbit.target.x + r * Math.sin(orbit.phi) * Math.sin(orbit.theta);
      const y = orbit.target.y + r * Math.cos(orbit.phi);
      const z = orbit.target.z + r * Math.sin(orbit.phi) * Math.cos(orbit.theta);
      camera.position.set(x, y, z);
      camera.lookAt(orbit.target);
    }
    updateCamera();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(2, 4, 2);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    scene.add(dir);

    // 地面
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    let actor = null;
    let mode = "idle";

    async function init() {
      const built = await LoadModel("GeneratedSoldier_20260819_223107.tzm.json", { materials, batch: true });
      if (!built) {
        document.querySelector("#ui p").textContent = "模型加载失败，见 console";
        return;
      }
      actor = built;
      actor.root.position.y = 0;
      scene.add(actor.root);
      document.getElementById("tri").textContent = actor.tris;
      document.getElementById("draw").textContent = actor.draws;
    }

    function get(n) {
      return actor && actor.nodes.get(n);
    }

    function animate(t) {
      requestAnimationFrame(animate);
      const s = t * 0.001;
      if (actor) {
        if (mode === "idle") {
          poseIdle(s);
        } else if (mode === "walk") {
          poseWalk(s);
        } else if (mode === "aim") {
          poseAim(s);
        }
      }
      updateCamera();
      renderer.render(scene, camera);
    }

    function poseIdle(s) {
      const hips = get("hips");
      const chest = get("chest");
      const neck = get("neck");
      const head = get("head");
      const shoulderL = get("shoulderL");
      const elbowL = get("elbowL");
      const shoulderR = get("shoulderR");
      const elbowR = get("elbowR");
      if (hips) {
        hips.position.y = Math.sin(s * 1.5) * 0.01;
        hips.rotation.y = Math.sin(s * 0.5) * 0.03;
      }
      if (chest) {
        chest.rotation.x = Math.sin(s * 1.2) * 0.015;
        chest.rotation.y = Math.sin(s * 0.4) * 0.02;
      }
      if (neck) neck.rotation.y = Math.sin(s * 0.6 + 1) * 0.04;
      if (head) head.rotation.x = Math.sin(s * 1.1) * 0.02;
      if (shoulderL) { shoulderL.rotation.z = 0.05 + Math.sin(s) * 0.02; shoulderL.rotation.x = 0; }
      if (elbowL) elbowL.rotation.x = -0.1 + Math.sin(s * 1.3) * 0.03;
      if (shoulderR) { shoulderR.rotation.z = -0.05 - Math.sin(s) * 0.02; shoulderR.rotation.x = 0; }
      if (elbowR) elbowR.rotation.x = -0.1 + Math.sin(s * 1.3 + 1) * 0.03;
      resetLegs();
    }

    function poseWalk(s) {
      resetUpper();
      const hips = get("hips");
      if (hips) {
        hips.position.y = Math.abs(Math.sin(s * 4)) * 0.025;
        hips.rotation.y = Math.sin(s * 1) * 0.04;
      }
      const chest = get("chest");
      if (chest) chest.rotation.y = Math.sin(s * 1 + Math.PI) * 0.04;

      const thighL = get("thighL");
      const calfL = get("calfL");
      const thighR = get("thighR");
      const calfR = get("calfR");
      if (thighL) thighL.rotation.x = Math.sin(s * 4) * 0.45;
      if (calfL) calfL.rotation.x = Math.max(0, Math.sin(s * 4 - 0.8)) * 0.65;
      if (thighR) thighR.rotation.x = Math.sin(s * 4 + Math.PI) * 0.45;
      if (calfR) calfR.rotation.x = Math.max(0, Math.sin(s * 4 + Math.PI - 0.8)) * 0.65;

      const shoulderL = get("shoulderL");
      const shoulderR = get("shoulderR");
      const elbowL = get("elbowL");
      const elbowR = get("elbowR");
      if (shoulderL) { shoulderL.rotation.x = Math.sin(s * 4 + Math.PI) * 0.35; shoulderL.rotation.z = 0; }
      if (elbowL) elbowL.rotation.x = -0.2 + Math.abs(Math.sin(s * 4)) * 0.25;
      if (shoulderR) { shoulderR.rotation.x = Math.sin(s * 4) * 0.35; shoulderR.rotation.z = 0; }
      if (elbowR) elbowR.rotation.x = -0.2 + Math.abs(Math.sin(s * 4 + Math.PI)) * 0.25;
    }

    function poseAim(s) {
      resetUpper();
      const hips = get("hips");
      const chest = get("chest");
      const shoulderL = get("shoulderL");
      const elbowL = get("elbowL");
      const shoulderR = get("shoulderR");
      const elbowR = get("elbowR");
      if (hips) {
        hips.position.y = Math.sin(s * 0.5) * 0.005;
        hips.rotation.y = 0.25;
      }
      if (chest) {
        chest.rotation.y = 0.35 + Math.sin(s * 0.6) * 0.02;
        chest.rotation.x = -0.05;
      }
      // 双手持枪指向胸前
      if (shoulderL) { shoulderL.rotation.x = -1.0; shoulderL.rotation.z = -0.1; }
      if (elbowL) elbowL.rotation.x = -1.4;
      if (shoulderR) { shoulderR.rotation.x = -1.0; shoulderR.rotation.z = 0.1; }
      if (elbowR) elbowR.rotation.x = -1.4;
      resetLegs();
    }

    function resetLegs() {
      for (const n of ["thighL", "calfL", "thighR", "calfR"]) {
        const node = get(n);
        if (node) node.rotation.x = 0;
      }
    }

    function resetUpper() {
      const neck = get("neck");
      const head = get("head");
      if (neck) neck.rotation.y = 0;
      if (head) head.rotation.x = 0;
    }

    document.getElementById("idle").addEventListener("click", () => mode = "idle");
    document.getElementById("walk").addEventListener("click", () => mode = "walk");
    document.getElementById("aim").addEventListener("click", () => mode = "aim");

    // 鼠标拖拽旋转 / 滚轮缩放（手动轨道）
    let dragging = false;
    let lastX = 0, lastY = 0;
    const canvas = renderer.domElement;
    canvas.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener("pointerup", () => { dragging = false; });
    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      orbit.theta -= dx * 0.005;
      orbit.phi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.phi - dy * 0.005));
    });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      orbit.radius = Math.max(1.2, Math.min(8, orbit.radius + e.deltaY * 0.002));
    }, { passive: false });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
    animate(0);
  </script>
</body>
</html>
