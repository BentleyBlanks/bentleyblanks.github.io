<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../">
  <title>枪械检查台 · 血战滕县</title>
  <link rel="icon" href="./Icon_TabSeal32.png">
  <link rel="stylesheet" data-interface-theme href="./Style_Interface.css?v=20261124TimedGrenade">
  <link rel="stylesheet" href="./Style_Editor.css?v=20261125ToolsDecouple">
  <link rel="stylesheet" href="./AdvancedTools/Style_WeaponInspection.css?v=20261128CatalogSides">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js" } }
  </script>
  <script type="module" src="./AdvancedTools/Script_WeaponInspection.mjs?v=20261128CatalogSearch"></script>
</head>
<body class="uiToolSurface edThemedSurface">
  <header class="tool-header">
    <h1>枪械检查台</h1>
    <div class="segmented-switch" role="group" aria-label="视口布局">
      <button type="button" data-layout="single" aria-pressed="true" aria-controls="inspectionViews">单视口</button>
      <button type="button" data-layout="split" aria-pressed="false" aria-controls="inspectionViews">双视口</button>
    </div>
    <a id="controlCenter" class="edMenuMainMenu" href="./AdvancedTools/ControlCenter.html">← 控制中心</a>
  </header>

  <main class="workspace edHome">
    <aside class="catalog" aria-labelledby="catalogTitle">
      <header class="catalog-header">
        <h2 id="catalogTitle">模型列表</h2>
        <output id="catalogCount" for="modelSearch"></output>
      </header>
      <div class="segmented-switch catalog-sides" role="group" aria-label="阵营筛选">
        <button type="button" data-catalog-side="all" aria-pressed="true" aria-controls="modelList">全部</button>
        <button type="button" data-catalog-side="nra" aria-pressed="false" aria-controls="modelList">川军</button>
        <button type="button" data-catalog-side="ija" aria-pressed="false" aria-controls="modelList">日军</button>
      </div>
      <div class="search">
        <input id="modelSearch" type="search" aria-label="搜索模型名称或编号" placeholder="搜索名称或编号" autocomplete="off">
      </div>
      <div id="modelList" class="model-list"></div>
    </aside>

    <div class="viewports" id="inspectionViews">
    <section class="reference" id="referencePane" aria-label="原画视口" hidden>
      <div class="reference-bar">
        <button type="button" class="edBtn" id="addReferences">导入图片</button>
        <input type="file" id="referenceFiles" accept="image/*,.avif,.webp,.svg" multiple hidden>
        <div class="reference-zoom" role="group" aria-label="原画缩放">
          <button type="button" class="edBtn" id="referenceZoomOut" aria-label="缩小">−</button>
          <button type="button" class="edBtn" id="referenceZoomIn" aria-label="放大">＋</button>
          <button type="button" class="edBtn" id="referenceFit">适配</button>
        </div>
      </div>
      <div class="reference-stage" id="referenceView" tabindex="0" aria-label="原画预览，拖动平移，滚轮或正负号缩放，Home 适配">
        <span class="reference-empty" id="referenceEmpty">拖入原画或贴图</span>
        <output class="reference-info" id="referenceInfo" hidden></output>
      </div>
      <footer class="reference-footer">
        <div id="referenceList" class="reference-list" role="group" aria-label="已导入图片"></div>
        <button type="button" class="edBtn" id="removeReference" aria-label="移除当前图片" title="移除当前图片" hidden>×</button>
        <p class="reference-status" id="referenceStatus" role="status" hidden></p>
      </footer>
    </section>

    <section id="inspectionBench" class="bench" aria-label="模型视口">
      <div class="view-bar" role="group" aria-label="渲染通道">
        <span aria-hidden="true">通道</span>
        <button type="button" class="edBtn on" data-channel="beauty" aria-pressed="true">完整</button>
        <button type="button" class="edBtn" data-channel="normal" aria-pressed="false" title="视空间着色法线，包含法线贴图">法线</button>
        <button type="button" class="edBtn" data-channel="tangent" aria-pressed="false" title="视空间切线方向">切线</button>
        <button type="button" class="edBtn" data-channel="albedo" aria-pressed="false" title="材质底色">Albedo</button>
        <button type="button" class="edBtn" data-channel="roughness" aria-pressed="false" title="粗糙度">Roughness</button>
        <button type="button" class="edBtn" data-channel="metallic" aria-pressed="false" title="金属度">Metallic</button>
        <button type="button" class="edBtn" data-channel="ao" aria-pressed="false" title="材质环境光遮蔽">AO</button>
        <button type="button" class="edBtn" data-channel="reflection" aria-pressed="false" title="台架环境镜面反射，提亮显示">Reflection</button>
        <button type="button" class="edBtn" data-channel="shadow" aria-pressed="false" title="主灯可见度，白色无遮挡，黑色遮挡">Shadow</button>
      </div>

      <div class="stage">
        <canvas id="view" tabindex="0" aria-label="三维模型，方向键旋转，Shift 加方向键平移，正负号缩放，Home 适配" aria-describedby="viewHint"></canvas>
        <div class="view-presets" role="group" aria-label="观察视角">
          <button type="button" id="orbitPreset" class="edBtn on" aria-pressed="true">外观</button>
          <button type="button" id="firstPersonPreset" class="edBtn" aria-pressed="false" disabled>第一人称持枪</button>
          <output id="firstPersonInfo" class="preset-info" hidden></output>
        </div>
        <span class="mount mount-muzzle" id="muzzleLabel" hidden>枪口</span>
        <span class="mount mount-grip" id="gripLabel" hidden>前握</span>
        <div class="scale" id="viewScale" hidden><span id="scaleValue"></span></div>
        <div class="stage-status" id="stageStatus">
          <span id="loadMessage" role="status">正在载入模型…</span>
          <button type="button" class="edBtn" id="retryLoad" hidden>重试</button>
        </div>
      </div>

      <footer class="bench-footer">
        <div class="overlays" role="group" aria-label="预览叠层">
          <button type="button" class="edBtn on" id="gridToggle" aria-pressed="true">网格</button>
          <button type="button" class="edBtn" id="wireframeToggle" aria-pressed="false">线框</button>
          <button type="button" class="edBtn" id="mountToggle" aria-pressed="false">挂点</button>
          <button type="button" class="edBtn" id="bayonetToggle" aria-pressed="false" hidden>刺刀预览</button>
        </div>
        <div id="viewHint">
          <span><kbd>左键</kbd> 旋转</span>
          <span><kbd>右键</kbd> 平移</span>
          <span><kbd>滚轮</kbd> 缩放</span>
          <span><kbd>Home</kbd> 适配</span>
        </div>
      </footer>
    </section>
    </div>

    <aside class="details" aria-labelledby="modelName">
      <section class="model-overview" aria-labelledby="modelName">
        <header class="model-heading">
          <h2 id="modelName"></h2>
          <p id="modelFullName"></p>
          <code id="modelId"></code>
        </header>
        <dl class="inspector-metrics model-facts">
          <div><dt>类别</dt><dd id="modelKind"></dd></div>
          <div><dt>阵营</dt><dd id="modelSide"></dd></div>
          <div><dt>三角面</dt><dd id="modelTriangles"></dd></div>
        </dl>
        <div class="bounds">
          <h3>模型尺寸 <small>mm</small></h3>
          <dl class="inspector-metrics">
            <div><dt>横向</dt><dd id="sizeX">—</dd></div>
            <div><dt>竖向</dt><dd id="sizeY">—</dd></div>
            <div><dt>纵深</dt><dd id="sizeZ">—</dd></div>
          </dl>
        </div>
        <dl class="model-source"><dt>模型文件</dt><dd id="modelFile"></dd></dl>
      </section>
      <p class="edNote warn" id="resourceNote" role="status" hidden></p>
      <div id="modelInspector" hidden></div>
    </aside>
  </main>
</body>
</html>
