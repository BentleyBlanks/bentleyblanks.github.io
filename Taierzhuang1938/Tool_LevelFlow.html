<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>遭遇设计 · 血战滕县</title>
  <link rel="stylesheet" href="./Style_SceneEditor.css?v=20261101230000">
  <link rel="stylesheet" href="./Style_LevelFlow.css?v=20261112Encounter2">
  <script>
    (function () {
      var request = new XMLHttpRequest();
      request.open("GET", "./index.html", false);
      request.send();
      var match = /<script type="importmap">([\s\S]*?)<\/script>/.exec(request.responseText);
      var map = document.createElement("script");
      map.type = "importmap";
      map.textContent = match ? match[1] : '{"imports":{}}';
      document.currentScript.after(map);
    })();
  </script>
  <script type="module" src="./Script_LevelFlow.mjs"></script>
</head>
<body class="lfBody">
  <header class="lfHeader"><div class="lfBrand"><span>血战滕县 · 第一关</span><h1>遭遇设计</h1></div><div id="frameHeading"></div><span id="saveStatus">本机草稿</span><a href="./index.html?editor=tools">返回高级工具</a></header>
  <div class="lfToolbar">
    <div class="lfToolGroup"><button id="fitStage">本段</button><button id="fitAll">全图</button><button id="followPlayer" aria-pressed="false">跟随战场</button></div>
    <div class="lfToolGroup" id="drawTools"><button data-mode="select" class="selected">选择</button><button data-mode="arrow">箭头</button><button data-mode="rect">框</button><button data-mode="text">文字</button></div>
    <div class="lfToolGroup"><button id="undoFlow" title="Ctrl+Z">撤销</button><button id="redoFlow" title="Ctrl+Shift+Z">重做</button></div>
    <div class="lfToolGroup lfExport"><button id="copyFrame">复制定位</button><button id="exportFrame" class="sePrimary">导出标注图</button><button id="exportProject">导出工程</button><button id="importProject">导入</button><input id="importFile" type="file" accept=".json,.png" hidden></div>
  </div>
  <main class="lfWorkspace">
    <section class="lfViewport"><canvas id="flowMap" tabindex="0" aria-label="遭遇地图，选择区域后可拖动，箭头框和文字标注绑定当前帧"></canvas><div id="mapTooltip" class="lfTooltip" hidden></div><div id="mapReadout"></div><div class="lfMapLegend"><i class="player"></i>顺子 <i class="friend"></i>我方 <i class="enemy"></i>日军 <span class="trigger"></span>触发区 <span class="spawn">△</span>生成区</div><div id="mapLoading">载入空间底图…</div></section>
    <aside class="lfInspector">
      <div class="lfTabs"><button data-tab="script" class="selected">原文</button><button data-tab="edit">布设</button><button data-tab="notes">标注</button></div>
      <section id="scriptPane" class="lfPane"><div class="lfSourceHeading"><span id="beatId"></span><span id="stageStatus"></span></div><h2 id="beatTitle"></h2><div id="sourcePassage"></div><a id="sourceLink" target="_blank" rel="noopener">打开 Notion 原稿 ↗</a></section>
      <section id="editPane" class="lfPane" hidden><div class="lfInline"><select id="objectList" aria-label="当前布设"></select><button id="focusObject" title="定位选中的区域">定位</button></div><div class="lfInline"><button id="addTrigger">＋触发区</button><button id="addGroup">＋生成区</button></div><form id="objectForm"></form><div id="objectPreview" class="lfPreviewStatus"></div><div id="objectActions" class="lfInline" hidden><button id="addRoutePoint">加路点</button><button id="deleteObject">删除</button></div></section>
      <section id="notesPane" class="lfPane" hidden><div class="lfNoteHint">标注后导出 PNG 原文件，可连同帧时间、坐标和布设一起回读。</div><label class="lfField">文字<textarea id="annotationText" rows="3" placeholder="选中标注后填写"></textarea></label><div class="lfInline"><button id="deleteAnnotation">删除选中</button></div><div id="annotationFrames"></div></section>
    </aside>
  </main>
  <footer class="lfTimeline">
    <div class="lfTransport"><button id="previousBeat">上一拍</button><button id="playFlow" class="sePrimary">播放</button><button id="nextBeat">下一拍</button><output id="flowTime"></output><select id="flowSpeed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select><label><input id="loopStage" type="checkbox">循环本段</label><div class="lfLayers"><label><input data-layer="fire" type="checkbox" checked>火力</label><label><input data-layer="triggers" type="checkbox" checked>触发</label><label><input data-layer="spawns" type="checkbox" checked>生成</label><label><input data-layer="routes" type="checkbox" checked>路线</label><label><input data-layer="names" type="checkbox" checked>人名</label></div></div>
    <div id="timelineStages" class="lfStages" aria-label="阶段"></div><input id="flowSeek" type="range" min="0" max="1870" step="0.05" value="0" aria-label="全程时间轴"><div id="timelineBeats" class="lfBeats" aria-label="当前阶段逐拍时间轴"></div>
  </footer>
  <div id="flowError" role="status" hidden></div>
</body>
</html>
