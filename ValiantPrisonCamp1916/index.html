<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1e18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Valiant Prison Camp 1916 — 勇敢的心第三章战俘营越狱白盒：澡堂肩带、滑轮急救包、洗衣围巾、番茄砸肉、喂狗取钳、探照灯剪网。">
  <title>战俘营 · 1916</title>
  <link rel="stylesheet" href="./Style_Game.css?v=20260803a">
  <style>
    .titleHeroCamp {
      position: absolute; inset: 0; z-index: -1;
      background:
        linear-gradient(105deg, rgba(14,16,12,.9) 0%, rgba(14,16,12,.35) 50%, rgba(14,16,12,.15) 100%),
        repeating-linear-gradient(90deg, #2a3228 0 28px, #323a30 28px 56px),
        linear-gradient(#3a4238, #1a1e18);
    }
    .titleHeroCamp::after {
      content: "";
      position: absolute; left: 8%; right: 8%; bottom: 18%; height: 42%;
      background:
        linear-gradient(#4a4034, #3a342c);
      clip-path: polygon(0 40%, 8% 0, 22% 35%, 35% 5%, 48% 38%, 62% 8%, 78% 42%, 90% 10%, 100% 45%, 100% 100%, 0 100%);
      opacity: .55;
    }
    #Goals {
      list-style: none; margin: 0; padding: 8px 10px;
      font-size: 12px; line-height: 1.45; color: var(--ink);
      max-width: 16rem;
      background: rgba(240,226,196,.92);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 rgba(0,0,0,.3);
    }
    #Goals li { opacity: .8; margin: 2px 0; }
    #Goals li.done { opacity: 1; color: #3d5240; text-decoration: line-through; }
    .hud { gap: 10px; }
    .hand {
      width: auto; min-width: 48px; height: auto; min-height: 48px;
      padding: 6px 10px; font-size: .7rem; max-width: 14rem; text-align: left;
    }
    .hearts {
      width: auto; padding: 4px 10px; background: rgba(240,226,196,.92);
      border: 2px solid var(--ink); color: var(--ink); font-weight: 700; font-size: .75rem;
      clip-path: none;
    }
  </style>
</head>
<body>
  <main id="Shell" class="shell">
    <canvas id="GameCanvas" class="canvas" tabindex="0" aria-label="战俘营"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="paperGrain" aria-hidden="true"></div>

    <section id="Title" class="overlay title">
      <div class="titleHeroCamp" aria-hidden="true"></div>
      <a class="mark" href="../"><b>战俘营</b><span>勇敢的心 · 第三章</span></a>
      <div class="titleCard">
        <p class="eyebrow">一九一六年 · 德国战俘营</p>
        <h1>越狱<br><em>罂粟花田</em></h1>
        <p class="lead">卡尔要从营里弄到剪线钳，再躲开探照灯剪开铁丝网。澡堂、厨房、洗衣房、宿舍、医务室——一件一件来。</p>
        <button id="BtnPlay" class="btn primary" type="button">开始</button>
        <p class="hintKeys">A/D 走 · S 蹲 · 空格 跳 · E 互动 · F 扔番茄</p>
      </div>
    </section>

    <section id="Prologue" class="overlay prologue" hidden>
      <article class="prologueCard" aria-live="polite">
        <div class="prologueArt" style="display:flex;align-items:flex-end;justify-content:center;background:#3a4238;">
          <div style="width:70%;height:85%;background:linear-gradient(#4a5a48,#2a3228);border:3px solid #1a1612;position:relative;">
            <div style="position:absolute;left:20%;right:20%;top:12%;height:18%;background:#c8b090;border-radius:50% 50% 40% 40%;"></div>
            <div style="position:absolute;left:15%;right:15%;top:32%;bottom:0;background:repeating-linear-gradient(180deg,#e8dfc8 0 10px,#3a4a38 10px 20px);"></div>
          </div>
        </div>
        <div class="prologueCopy">
          <p class="eyebrow">第三章 · 战俘营</p>
          <p id="PrologueSpeaker" class="prologueSpeaker">卡尔</p>
          <blockquote id="PrologueLine" class="prologueLine">……</blockquote>
          <button id="BtnPrologue" class="btn primary" type="button">往下说</button>
        </div>
      </article>
    </section>

    <section id="Win" class="overlay win" hidden>
      <div class="titleHeroCamp dim" aria-hidden="true" style="filter:brightness(.55);"></div>
      <div class="titleCard inkCard">
        <p class="eyebrow">逃出去了</p>
        <h1>铁丝网外</h1>
        <p class="lead">探照灯还在扫。先离开这片营区——前方是罂粟花田。</p>
        <button id="BtnReplay" class="btn primary" type="button">再来一次</button>
      </div>
    </section>

    <section id="Hud" class="hud" hidden>
      <div id="Hearts" class="hearts" aria-label="街道"></div>
      <div id="Hand" class="hand" aria-label="手里"></div>
      <ul id="Goals" aria-label="目标"></ul>
      <div id="BarkBox" class="barkBox" hidden>
        <div>
          <p id="BarkSpeaker" class="barkSpeaker"></p>
          <p id="Bark" class="bark"></p>
        </div>
      </div>
    </section>

    <div id="Touch" class="touch" hidden aria-label="触屏操作">
      <div class="touchCluster touchLeft">
        <button type="button" data-k="left" aria-label="左移">◀</button>
        <button type="button" data-k="right" aria-label="右移">▶</button>
        <button type="button" data-k="crouch" aria-label="蹲下">蹲</button>
      </div>
      <div class="touchCluster touchRight">
        <button type="button" data-k="jump" aria-label="跳">跳</button>
        <button type="button" data-k="act" aria-label="互动">E</button>
        <button type="button" data-k="throw" aria-label="扔">扔</button>
      </div>
    </div>
  </main>
  <script type="module" src="./Script_Game.mjs?v=20260803a"></script>
</body>
</html>
