<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>太行·1942 — 反扫荡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { background: #14100a; color: #d8c9a0; font-family: system-ui, "Noto Sans SC", sans-serif; font-size: 14px; user-select: none; }
button { font-family: inherit; cursor: pointer; }
.hidden { display: none !important; }
#cv { position: absolute; inset: 0; display: block; touch-action: none; }
#topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px 12px; background: rgba(18,14,8,.94); border-bottom: 1px solid #55482a; padding-top: calc(7px + env(safe-area-inset-top)); }
#topbar .res { white-space: nowrap; cursor: default; }
#topbar .res b { color: #f0e4c0; }
#topbar .d { color: #8a8058; font-size: 12px; }
.tbtn { background: #2a2516; border: 1px solid #6b5a30; color: #e8d9ae; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.tbtn:hover { background: #3a3320; }
.tbtn.glow { border-color: #cdaa4a; box-shadow: 0 0 8px rgba(205,170,74,.45); }
#endTurnBtn { position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 11; background: #5e1d18; border: 1px solid #c36a52; color: #ffd9c9; font-size: 16px; padding: 12px 22px; border-radius: 9px; }
#endTurnBtn:hover { background: #7a2620; }
#opBanner { position: fixed; top: calc(46px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 9; max-width: min(94vw, 640px); background: rgba(90,20,16,.94); border: 1px solid #a04338; color: #f0d0c0; border-radius: 7px; padding: 6px 14px; font-size: 13px; line-height: 1.5; text-align: center; }
#opBanner.prep { background: rgba(96,72,16,.94); border-color: #a08338; color: #f0e0b0; }
#opBanner.retreat { background: rgba(24,52,26,.94); border-color: #4a7a3c; color: #cfe0b0; }
#sidePanel { position: fixed; right: 10px; top: calc(52px + env(safe-area-inset-top)); z-index: 12; width: 305px; max-height: calc(100vh - 160px); overflow-y: auto; background: rgba(24,19,11,.96); border: 1px solid #6b5a30; border-radius: 9px; padding: 11px 13px; }
#sidePanel h3 { color: #f0e4c0; font-size: 15px; margin-bottom: 6px; }
#sidePanel h3 small { color: #8a8058; font-weight: 400; font-size: 12px; margin-left: 7px; }
#sidePanel .row { margin: 4px 0; font-size: 13px; line-height: 1.45; }
#sidePanel .hint { color: #8a8058; font-size: 12px; line-height: 1.5; margin-top: 6px; }
#sidePanel .warn { color: #d8a441; font-size: 12.5px; margin-top: 4px; }
#sidePanel .bad { color: #e2564d; font-size: 12.5px; margin-top: 4px; }
#sidePanel hr { border: none; border-top: 1px solid #3a3826; margin: 8px 0; }
.abtn { display: block; width: 100%; text-align: left; margin: 4px 0; background: #2a2516; border: 1px solid #4a452c; color: #d8c9a0; border-radius: 6px; padding: 6px 9px; font-size: 12.5px; line-height: 1.45; }
.abtn:hover:not(:disabled) { background: #3a3320; border-color: #8a7440; }
.abtn:disabled { opacity: .45; cursor: default; }
.abtn .sub { display: block; color: #8a8058; font-size: 11.5px; }
.abtn .cost { float: right; color: #b89a58; font-size: 11.5px; }
#logBox { position: fixed; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 8; width: min(430px, 62vw); max-height: 32vh; overflow-y: auto; background: rgba(18,14,8,.88); border: 1px solid #3f3722; border-radius: 8px; padding: 7px 11px; font-size: 12.5px; line-height: 1.55; pointer-events: auto; }
#logBox p { margin: 2px 0; color: #b7a97f; }
#logBox p.good { color: #9fbc52; }
#logBox p.bad { color: #e2564d; }
#logBox p.jp { color: #d88a6a; }
#logBox p.hl { color: #e8cf90; }
#logBox p.intel { color: #8fd2e8; }
#modalWrap { position: fixed; inset: 0; z-index: 30; background: rgba(8,6,3,.78); display: flex; align-items: center; justify-content: center; padding: 16px; }
#modalBox { width: min(640px, 94vw); max-height: 88vh; overflow-y: auto; background: #201a10; border: 1px solid #8a7440; border-radius: 11px; padding: 20px 24px; line-height: 1.65; box-shadow: 0 12px 44px rgba(0,0,0,.6); }
#modalBox h2 { color: #f0e4c0; margin-bottom: 9px; }
#modalBox h2 small { display: block; color: #8a8058; font-size: 13px; font-weight: 400; margin-top: 3px; }
#modalBox p { margin: 7px 0; font-size: 13.5px; }
#modalBox .mbtns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
.mbtn { background: #5e3d18; border: 1px solid #c3a052; color: #ffe9c9; padding: 9px 20px; border-radius: 7px; font-size: 14.5px; }
.mbtn.ghost { background: #2a2516; border-color: #6b5a30; color: #d8c9a0; }
.rosterRow { display: flex; justify-content: space-between; gap: 8px; padding: 4px 6px; border-bottom: 1px dashed #3a3322; font-size: 13px; }
.rosterRow .st { color: #8a8058; }
.rosterRow.dead { color: #6a6046; }
.rosterRow.dead .nm { text-decoration: line-through; }
.rosterRow.dead .st { color: #9fbc52; }
.card { border: 1px solid #7a5a30; background: #241d10; border-radius: 9px; padding: 12px 15px; margin: 10px 0; }
.card .big { font-size: 19px; color: #ffd766; }
.card .loot { color: #9fbc52; font-size: 13.5px; margin-top: 6px; line-height: 1.7; }
.frag { display: inline-block; background: #1c2a30; border: 1px solid #3a6a7a; color: #8fd2e8; border-radius: 5px; padding: 1px 8px; margin: 2px 3px; font-size: 12.5px; }
.frag.unknown { background: #221e12; border-color: #4a452c; color: #6a6046; }
@media (max-width: 640px) {
  #sidePanel { width: min(86vw, 305px); top: auto; bottom: calc(76px + env(safe-area-inset-bottom)); max-height: 44vh; }
  #logBox { width: 58vw; max-height: 22vh; font-size: 11.5px; }
  #opBanner { font-size: 11.5px; padding: 5px 10px; }
  #topbar { gap: 7px; font-size: 12.5px; }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="topbar">
  <span class="res">🌾粮 <b id="uiGrain">0</b></span>
  <span class="res">👥兵员 <b id="uiMen">0</b></span>
  <span class="res">🔫军械 <b id="uiArms">0</b></span>
  <span class="res">📡情报 <b id="uiIntel">0</b></span>
  <span class="res d" id="uiDate"></span>
  <button class="tbtn" id="rosterBtn">📋 敌情台账</button>
  <button class="tbtn" id="helpBtn">📖 打法</button>
</div>
<div id="opBanner" class="hidden"></div>
<div id="sidePanel" class="hidden"></div>
<div id="logBox"></div>
<div id="modalWrap" class="hidden"><div id="modalBox"></div></div>
<button id="endTurnBtn">结束回合 ▶</button>
<script>
"use strict";
// ═══════════《太行·1942 — 反扫荡》═══════════
// 设计核心: 日军不是天气, 是一个有台账、有计划、会疲劳、要回家的对手。
// 玩家的胜利来自: 情报拼图 → 迟滞破坏 → 避其锐气 → 击其惰归。十六字诀即玩法。

const CFG = {
  W: 24, H: 18, hex: 44,
  totalTurns: 36,                 // 1942年1月上旬 → 12月下旬(每回合一旬)
  startGrain: 80, startMen: 30, startArms: 22, startIntel: 2,
  grainCap: 300, menCap: 120, armsCap: 150, intelCap: 30,
  // 民心: 村庄唯一属性。≥50=根据地村(产出+可招兵), ≥60=情报网(视野+每旬+1情报)
  heartOwn: 50, heartIntel: 60,
  villageGrain: 5, villageMen: 2,  // 根据地村每旬产出(×民心系数)
  upkeep: { reg: 2, mil: 1, cmd: 1, wk: 0 },
  // 战斗
  dmgBase: 30, dmgDiv: 12, counterMult: 0.9,
  ambushMult: 2.2,                // 伏击首击倍率(无反击)
  terrainDef: { mountain: 6, forest: 4, hills: 3, plain: 0 },
  // 敌方
  companyStr: 30, companyHp: 100, puppetStr: 9, puppetHp: 100, stragglerStr: 5,
  fatiguePerTurn: 8, fatigueFloor: 0.5,     // 战力系数 = max(0.5, 1-疲劳/100)
  stragglerAt: 45,                // 疲劳≥此值开始掉队
  opFirstTurn: 5, opGapMin: 7, opGapMax: 10,
  bigSweepTurn: 13,               // 五一大扫荡(5月上旬), 合击总部
  reinforceTurn: 22, reinforceWarn: 20,
  combTurns: 3,                   // 清剿阶段时长
  burnHeart: 40, burnTurns: 6,    // 烧村: -民心, N旬内产出归零
  mineCost: 4, mineDmg: 30,       // 地雷: 伤纵队+误期1旬
  railCutTurns: 5, sabotageLoot: 8,
  depotDelay: 2,                  // 烧屯粮: 战役推迟
  intelFragCost: 6,               // 花情报买一层敌情
  reliefDelay: 1,                 // 围点打援: 攻据点后N旬援军出动
};

// ── 历史数据: 独立混成第四旅团(晋东南日军, 关家垴冈崎大队所属) ──
const JP_BRIGADE = "独立混成第四旅团";
const JP_COMPANY_NAMES = ["伊藤中队","佐佐木中队","冈田中队","小林中队","山口中队","河野中队","松井中队","饭田中队","竹内中队","荒木中队","土屋中队"];
const OP_NAMES = ["第四次治安强化·剔抉扫荡","晋冀豫边区肃正作战","辗转剔抉·驻剿作战","秋季晋东南讨伐作战","冬季治安强化作战"];
const BIG_OP_NAME = "五一大扫荡·铁壁合围";
// 缴获表: 打死日军中队按此开单, 具体到枪 — 战果必须有形。
const LOOT_JP = [["三八式步枪", 38, 52], ["歪把子机枪", 1, 3], ["掷弹筒", 1, 2], ["王八盒子", 2, 5], ["罐头给养", 6, 14], ["军用地图与文件", 1, 1]];
const LOOT_PUP = [["杂式步枪", 6, 10], ["手榴弹", 4, 9]];
const VNAMES = ["李家庄","王家峪","赵家坳","马家沟","石门村","柳树沟","黑石崖","桃花寨","大杨庄","南坡村","北岭村","东塬村","西沟村","孙家铺","青石口","枣林坪"];
const TOWN_NAME = "辽县城";
const STATION_NAMES = ["武安车站", "涉县车站"];

// ── 随机 & 六边形 ──
let rng = Math.random;
function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const key = (q, r) => q + "," + r;
const W = CFG.W, H = CFG.H, SQRT3 = Math.sqrt(3);
function inb(q, r) { return q >= 0 && q < W && r >= 0 && r < H; }
function nbrs(q, r) {
  const even = r % 2 === 0;
  const d = even ? [[1,0],[-1,0],[0,1],[0,-1],[-1,1],[-1,-1]] : [[1,0],[-1,0],[0,1],[0,-1],[1,1],[1,-1]];
  const out = [];
  for (const [dq, dr] of d) { const nq = q + dq, nr = r + dr; if (inb(nq, nr)) out.push([nq, nr]); }
  return out;
}
function axial(q, r) { return [q - (r - (r & 1)) / 2, r]; }
function hexDist(q1, r1, q2, r2) {
  const [a1, b1] = axial(q1, r1), [a2, b2] = axial(q2, r2);
  return (Math.abs(a1 - a2) + Math.abs(b1 - b2) + Math.abs(a1 + b1 - a2 - b2)) / 2;
}
function hexCenter(q, r) { const s = CFG.hex; return [s * SQRT3 * (q + 0.5 * (r & 1)) + s, s * 1.5 * r + s]; }
function dateStr(t) {
  const m = Math.floor((t - 1) / 3) + 1, x = ["上旬", "中旬", "下旬"][(t - 1) % 3];
  return "1942年" + m + "月" + x;
}

// ── 地图生成: 西山东川, 铁路纵贯东部, 公路自铁路探入山区(公路=敌军的血管, 也是你的伏击场) ──
function genMap() {
  const tiles = [];
  for (let q = 0; q < W; q++) { tiles[q] = []; for (let r = 0; r < H; r++) {
    // 大势: 西部山地, 中部丘陵森林, 东部平原
    let t;
    const n = rng();
    if (q < 5) t = n < 0.62 ? "mountain" : (n < 0.85 ? "hills" : "forest");
    else if (q < 10) t = n < 0.3 ? "mountain" : n < 0.58 ? "forest" : n < 0.85 ? "hills" : "plain";
    else if (q < 15) t = n < 0.13 ? "mountain" : n < 0.4 ? "hills" : n < 0.62 ? "forest" : "plain";
    else t = n < 0.1 ? "hills" : n < 0.2 ? "forest" : "plain";
    tiles[q][r] = { terrain: t, road: false, rail: false, railCut: 0, village: null, sh: null, mine: false, disc: false };
  } }
  // 铁路: q≈19 纵贯, 蜿蜒 ±1
  let rq = 19;
  const railTiles = [];
  for (let r = 0; r < H; r++) {
    rq = clamp(rq + ri(-1, 1), 18, 20);
    tiles[rq][r].rail = true; tiles[rq][r].terrain = "plain";
    railTiles.push([rq, r]);
  }
  // 县城(铁路中段) + 两座车站
  const town = railTiles[Math.floor(H / 2)];
  tiles[town[0]][town[1]].sh = { kind: "town", name: TOWN_NAME, hp: 280, str: 34, garrison: [] };
  const st1 = railTiles[3], st2 = railTiles[H - 4];
  tiles[st1[0]][st1[1]].sh = { kind: "station", name: STATION_NAMES[0], hp: 120, str: 14, garrison: [] };
  tiles[st2[0]][st2[1]].sh = { kind: "station", name: STATION_NAMES[1], hp: 120, str: 14, garrison: [] };
  // 公路: 从县城与车站向西探入, 尽头设炮楼(囚笼的爪子)
  const roadFrom = (sx, sy, len, bias) => {
    let q = sx, r = sy;
    const path = [];
    for (let i = 0; i < len; i++) {
      const opts = nbrs(q, r).filter(([a, b]) => a < q || (a === q && Math.abs(b - (sy + bias)) < Math.abs(r - (sy + bias))));
      if (!opts.length) break;
      opts.sort((p1, p2) => (p1[0] - p2[0]) + Math.abs(p1[1] - (sy + bias)) * 0.4 - ((p2[0] - q) + Math.abs(p2[1] - (sy + bias)) * 0.4));
      const [nq, nr] = opts[0];
      q = nq; r = nr;
      if (tiles[q][r].terrain === "mountain") tiles[q][r].terrain = "hills"; // 公路劈山
      tiles[q][r].road = true;
      path.push([q, r]);
    }
    return path;
  };
  const pillboxAt = (q, r, i) => { if (!tiles[q][r].sh && !tiles[q][r].village) tiles[q][r].sh = { kind: "pillbox", name: "炮楼·" + "甲乙丙丁戊"[i], hp: 150, str: 18, garrison: [] }; };
  const p1 = roadFrom(st1[0], st1[1], 7, 1); if (p1.length) pillboxAt(p1[p1.length - 1][0], p1[p1.length - 1][1], 0);
  const p2 = roadFrom(town[0], town[1], 8, -2); if (p2.length) pillboxAt(p2[p2.length - 1][0], p2[p2.length - 1][1], 1);
  const p3 = roadFrom(town[0], town[1], 6, 3); if (p3.length) pillboxAt(p3[p3.length - 1][0], p3[p3.length - 1][1], 2);
  const p4 = roadFrom(st2[0], st2[1], 7, -1); if (p4.length) pillboxAt(p4[p4.length - 1][0], p4[p4.length - 1][1], 3);
  // 村庄: 中西部散布
  const villages = [];
  let vi = 0, guard = 0;
  while (villages.length < 13 && guard++ < 900) {
    const q = ri(1, 15), r = ri(1, H - 2);
    const t = tiles[q][r];
    if (t.village || t.sh || t.rail || t.terrain === "mountain") continue;
    if (villages.some(([a, b]) => hexDist(q, r, a, b) < 2)) continue;
    if (t.road && rng() < 0.5) continue;
    t.village = { name: VNAMES[vi++ % VNAMES.length], heart: q < 8 ? ri(45, 62) : ri(20, 42), burned: 0, cadre: false };
    villages.push([q, r]);
  }
  // 总部: 靠西但必须"站得住脚" — 至少3个非山地邻格, 否则部队一出生就被山困死
  const passableAround = (q, r) => nbrs(q, r).filter(([a, b]) => tiles[a][b].terrain !== "mountain" && !tiles[a][b].sh).length;
  villages.sort((a, b) => a[0] - b[0]);
  let hqPick = villages.find(([q, r]) => passableAround(q, r) >= 3) || villages[0];
  const hq = { q: hqPick[0], r: hqPick[1] };
  // 再兜底: 硬凿出3条出山的路(山村也总得有条驮道)
  let opened = passableAround(hq.q, hq.r);
  for (const [a, b] of nbrs(hq.q, hq.r)) {
    if (opened >= 3) break;
    if (tiles[a][b].terrain === "mountain") { tiles[a][b].terrain = "hills"; opened++; }
  }
  tiles[hq.q][hq.r].village.heart = 78;
  tiles[hq.q][hq.r].village.hq = true;
  return { tiles, hq, town: { q: town[0], r: town[1] }, stations: [{ q: st1[0], r: st1[1] }, { q: st2[0], r: st2[1] }] };
}

// ═══════════ 状态 ═══════════
let state = null;
const UT_P = {
  // 机动力是游击队的命: 走得比敌人快才谈得上"敌进我退". 山地耗2, 其余耗1。
  reg: { name: "主力连", glyph: "连", str: 15, mp: 4, cost: { grain: 25, men: 20, arms: 16 }, desc: "拔点与歼灭的主力。正面仍打不过满员日军中队 — 等它疲了再动手。" },
  mil: { name: "民兵队", glyph: "民", str: 7, mp: 4, cost: { grain: 10, men: 8, arms: 4 }, desc: "便宜。埋雷、袭扰、配合合围。" },
  cmd: { name: "武工队", glyph: "武", str: 9, mp: 5, cost: { grain: 15, men: 10, arms: 8, intel: 4 }, hidden: true, desc: "敌后之敌后: 破袭、贴近敌军侦察(+情报)、烧屯粮。日军难以主动发现它。" },
  wk:  { name: "工作队", glyph: "工", str: 0, mp: 4, cost: { grain: 10, men: 5 }, desc: "到村庄点【驻村发动群众】: 民心+6/旬。民心≥50=根据地村, ≥60=情报网(帮你盯日军)。" },
};
function newGame(seed) {
  rng = mulberry32(seed || ((Date.now() % 1e9) | 0));
  const g = genMap();
  state = {
    turn: 1, over: false, result: null,
    grain: CFG.startGrain, men: CFG.startMen, arms: CFG.startArms, intel: CFG.startIntel,
    tiles: g.tiles, hq: g.hq, town: g.town, stations: g.stations,
    units: [], nextUid: 1,
    jp: {
      companies: JP_COMPANY_NAMES.slice(0, 9).map((n, i) => ({ id: i, name: n, status: "garrison", deadTurn: 0, deadBy: "" })),
      nameIdx: 9, puppets: 10,
      op: null, nextOpTurn: CFG.opFirstTurn + ri(0, 1), opIdx: 0, reinforced: false,
      relief: [],
    },
    stats: { jpKilled: 0, pupKilled: 0, grainBack: 0, burnedVillages: 0, minesHit: 0, ambushes: 0, reliefKilled: 0 },
  };
  spawnP("reg", g.hq.q, g.hq.r); spawnP("mil", g.hq.q, g.hq.r); spawnP("wk", g.hq.q, g.hq.r);
  revealAround(g.hq.q, g.hq.r, 3);
}
function spawnP(type, q, r) {
  let sq = q, sr = r;
  if (unitAt(sq, sr, "p")) {
    // 向外 BFS 找空位(原来只看直接邻格, 山村会找不到 → 单位静默消失)
    const seen = new Set([key(q, r)]);
    const queue = [[q, r]];
    let found = null;
    while (queue.length && !found) {
      const [cq, cr] = queue.shift();
      for (const [a, b] of nbrs(cq, cr)) {
        const kk = key(a, b);
        if (seen.has(kk)) continue;
        seen.add(kk);

    + "<p><b>敌进我退</b>: 纵队锋芒正锐时(战力30+)正面硬顶=关家垴。躲进山里, 让它扑空。<br><b>敌驻我扰</b>: 地雷埋在它必经的公路上; 伏击(密林/山地设伏)自动痛击路过纵队。<br><b>敌疲我打</b>: 纵队每旬疲劳+8, 战力掉到六成, 还会掉队送人头 — 疲了再上主力。<br><b>敌退我追</b>: 清剿结束它满载回撤 — 全歼回撤纵队夺回粮食, 这是最解恨的一仗。</p>"
    + "<p><b>斗智三件套</b>: ①情报拼图(情报网村+武工队+研判)拼出合击点→提前疏散+路上布雷设伏; ②烧屯粮/破铁路→敌战役推迟、出动后疲劳更快; ③围点打援→佯攻炮楼引援军上路, 在半路密林全歼之。</p>"
    + "<p><b>政治即军事</b>: 工作队驻村拉民心 — ≥50成根据地村(产粮兵), ≥60建情报网(帮你盯死日军动向)。但根据地越红火, 越招大扫荡: 5月的铁壁合围直扑总部, 是躲不掉的历史。</p>"
    + "<p style='color:#8a8058'>操作: 点选部队→绿格移动 · 侧栏按钮攻击/设伏/埋雷/破袭 · 点村庄招兵 · 顶栏看台账 · Enter结束回合</p>"
    + "<div class='mbtns'>" + (hasSaveGame() ? "<button class='mbtn ghost' onclick='continueGame()'>继续上局</button>" : "") + "<button class='mbtn' onclick='startNew()'>" + (state && state.started ? "开打" : "新开一局") + "</button></div>");
}
function hasSaveGame() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function continueGame() { if (loadGame()) { state.started = true; closeModal(); computeVis(); centerCam(); updateTop(); updateBanner(); draw(); log("── 进度恢复 · " + dateStr(state.turn) + " ──", "hl"); } }
function startNew() {
  newGame();
  state.started = true;
  closeModal(); computeVis(); centerCam(); updateTop(); updateBanner(); draw();
  log("═══ 1942年1月 · 太行军分区 ═══", "hl");
  log("上级通报: " + JP_BRIGADE + "盘踞铁路沿线, 囚笼正在收紧。你的任务: 熬过1942, 并让敌人为每一次扫荡付出代价", "hl");
  log("【怎么动】点部队→地图亮起金色虚线格→点任意亮格就走过去。想打仗: 走到敌人旁边, 用右侧栏的攻击按钮。", "good");
  log("先手三步: ①工作队进邻村【驻村发动群众】(民心≥60就是你的雷达) ②民兵去公路埋雷 ③主力藏进山林设伏", "good");
  // 开局自动选中一支部队 — 让"可移动"这件事第一眼就看得见, 不必先猜
  const first = state.units.find(u => u.side === "p" && UT_P[u.type].str > 0) || state.units.find(u => u.side === "p");
  if (first) { sel = { kind: "unit", id: first.id }; reach = reachableMap(first); renderPanel(); draw(); }
}
function renderPanel() {
  const pn = $("sidePanel");
  if (!sel) { pn.classList.add("hidden"); return; }
  pn.classList.remove("hidden");
  let html = "";
  const u = getSel();
  if (u) {
    const ut = UT_P[u.type];
    html += "<h3>" + ut.name + "<small>HP " + Math.round(u.hp) + " · 机动 " + u.mp + "/" + ut.mp + "</small></h3>";
    const nreach = reach ? Object.keys(reach).length : 0;
    html += "<div class='row' style='color:" + (nreach ? "#cdff72" : "#8a8058") + "'>" + (nreach ? "➜ 地图上 " + nreach + " 格已亮起(金色虚线) — 点它们即可移动" : (u.attacked ? "本旬已行动, 下旬恢复机动" : "本旬机动力已用尽")) + "</div>";
    if (ut.str) html += "<div class='row'>战力 " + pStr(u, "atk").toFixed(1) + "(攻) / " + pStr(u, "def").toFixed(1) + "(守)</div>";
    html += "<div class='hint'>" + ut.desc + "</div>";
    if (u.ambush) html += "<div class='row' style='color:#9fbc52'>🌿 设伏中 — 敌纵队行经邻格将遭我猝然打击(移动会撤伏)</div>";
    if (u.rooted) html += "<div class='row' style='color:#9fbc52'>🌱 驻村工作中 — 民心+6/旬</div>";
    if (u.attacked && !u.ambush && !u.rooted) html += "<div class='warn'>本旬已行动</div>";
    // 攻击按钮: 相邻的每个目标一个按钮, 带预估 — 数字替你说话
    if (ut.str && !u.attacked) {
      for (const [aq, ar] of nbrs(u.q, u.r)) {
        const col = state.units.find(x => x.side === "j" && x.kind === "col" && x.q === aq && x.r === ar && seenByPlayer(x));
        if (col) {
          const cs = colStr(col);
          const exp = Math.round(expectDmg(pStr(u, "atk"), cs * 0.55 + terrDef(aq, ar)) * (u.ambush ? CFG.ambushMult : 1));
          const back = u.ambush ? 0 : Math.round(expectDmg(cs, pStr(u, "def")) * CFG.counterMult);
          const fresh = col.fatigue < 30;
          html += "<button class='abtn' onclick='uiAttack(\"col\"," + aq + "," + ar + ")'>⚔ 攻击敌纵队(战力" + Math.round(cs) + (col.fatigue >= CFG.stragglerAt ? "·已疲惫" : fresh ? "·生力军!" : "") + ") <span class='cost'>预计-" + exp + (back ? " / 反击-" + back : " / 无反击") + "</span><span class='sub'>" + (fresh && !u.ambush ? "⚠ 敌锋芒正锐, 硬拼吃大亏 — 等它疲了、或用伏击" : col.state === "retreat" ? "★ 击其惰归! 满载回撤之敌, 打!" : "可以下手") + "</span></button>";
        }
        const st = state.units.find(x => x.side === "j" && x.kind === "strag" && x.q === aq && x.r === ar && seenByPlayer(x));
        if (st) html += "<button class='abtn' onclick='uiAttack(\"strag\"," + aq + "," + ar + ")'>⚔ 解决掉队之敌 <span class='cost'>稳赢</span></button>";
        const sh = state.tiles[aq][ar].sh;
        if (sh && visSet.has(key(aq, ar))) {
          const exp2 = Math.round(expectDmg(pStr(u, "atk"), sh.str * 0.8) * (u.ambush ? CFG.ambushMult : 1));
          html += "<button class='abtn' onclick='uiAttack(\"sh\"," + aq + "," + ar + ")'>⚔ " + (sh.kind === "depot" ? "🔥 烧" : "攻打") + sh.name + "(" + Math.round(sh.hp) + "耐久) <span class='cost'>预计-" + exp2 + "</span><span class='sub'>" + (sh.kind === "depot" ? "烧掉屯粮 = 敌战役推迟、行军更疲" : sh.kind === "pillbox" ? "攻楼必引援军 — 想清楚: 是要楼, 还是要半路打援?" : "坚固据点, 宜围点打援消耗其兵力") + "</span></button>";
        }
      }
    }
    html += "<hr>";
    if (ut.str && !u.attacked) html += "<button class='abtn' onclick='actionAmbush()'>🌿 设伏 <span class='cost'>耗本旬</span><span class='sub'>密林/丘陵/山地/村落; 敌纵队路过邻格自动遭我首击×" + CFG.ambushMult + "(无反击), 姿态跨旬保持</span></button>";
    if ((u.type === "mil" || u.type === "cmd") && !u.attacked) html += "<button class='abtn' onclick='actionMine()'>💣 埋地雷 <span class='cost'>军械-" + CFG.mineCost + "</span><span class='sub'>埋在公路/铁路; 敌纵队踩中: 伤" + CFG.mineDmg + "+误期一旬</span></button>";
    if (ut.str && !u.attacked) html += "<button class='abtn' onclick='actionSabotage()'>💥 破袭铁路 <span class='cost'>军械+" + CFG.sabotageLoot + "</span><span class='sub'>站在铁路上; 断敌输送: 集结期破袭可推迟敌战役、可迟滞敌增援</span></button>";
    if (u.type === "cmd" && !u.attacked) html += "<button class='abtn' onclick='actionRecon()'>🕵 化装侦察 <span class='cost'>情报+3</span><span class='sub'>贴近敌军/据点时可用</span></button>";
    if (u.type === "wk" && !u.rooted) html += "<button class='abtn' onclick='actionRoot()'>🌱 驻村发动群众 <span class='cost'>耗本旬</span><span class='sub'>民心+6/旬; ≥50根据地村, ≥60情报网(盯死日军)</span></button>";
    html += "<button class='abtn' onclick='actionDisband()'>✖ 解散 <span class='cost'>兵员+5</span></button>";
  } else if (sel.kind === "tile") {
    const t = state.tiles[sel.q][sel.r];
    if (t.village) {
      const v = t.village;
      html += "<h3>" + v.name + (v.hq ? "(总部)" : "") + "<small>民心 " + Math.round(v.heart) + "/100</small></h3>";
      html += "<div class='row'>" + (v.burned > 0 ? "🔥 遭烧掠, " + v.burned + "旬后恢复生产" : v.heart >= CFG.heartIntel ? "📡 情报网村庄 — 每旬+1情报, 监视周边敌军动向" : v.heart >= CFG.heartOwn ? "🚩 根据地村庄 — 产粮产兵, 可招募" : "中立村庄 — 派工作队驻村发动群众") + "</div>";
      if (v.heart >= CFG.heartOwn && v.burned <= 0) {
        html += "<hr><div class='row'><b>组建队伍</b> <span style='color:#8a8058;font-size:11px'>(资源一次性扣除)</span></div>";
        for (const tp of ["mil", "reg", "cmd", "wk"]) {
          const c = UT_P[tp].cost;
          const can = state.grain >= (c.grain || 0) && state.men >= (c.men || 0) && state.arms >= (c.arms || 0) && state.intel >= (c.intel || 0);
          const cost = [c.grain ? "粮" + c.grain : "", c.men ? "人" + c.men : "", c.arms ? "械" + c.arms : "", c.intel ? "报" + c.intel : ""].filter(Boolean).join(" ");
          html += "<button class='abtn' " + (can ? "" : "disabled") + " onclick='actionRecruit(\"" + tp + "\")'>" + UT_P[tp].name + (UT_P[tp].str ? "(战" + UT_P[tp].str + ")" : "") + " <span class='cost'>" + cost + "</span><span class='sub'>" + UT_P[tp].desc + "</span></button>";
        }
      }
    } else if (t.sh && visSet.has(key(sel.q, sel.r))) {
      html += "<h3>" + t.sh.name + "<small>" + (t.sh.pup ? "伪军守备" : "日军据点") + " · 耐久" + Math.round(t.sh.hp) + "</small></h3>";
      html += "<div class='hint'>" + (t.sh.kind === "depot" ? "敌战役的粮秣所系 — 烧了它, 敌人推迟出动、行军挨饿。" : t.sh.kind === "pillbox" ? "囚笼的爪子。攻打必引援军沿公路来救 — 围点打援: 醉翁之意不在楼。" : t.sh.kind === "station" ? "敌兵力输送枢纽, 扫荡多由此集结出动。" : "敌旅团部驻地, 守备森严。") + "</div>";
    } else {
      const TN = { plain: "平原", hills: "丘陵", forest: "密林", mountain: "山地" };
      html += "<h3>" + TN[t.terrain] + "<small>" + (t.road ? "公路 " : "") + (t.rail ? "铁路 " : "") + sel.q + "," + sel.r + "</small></h3>";
      html += "<div class='hint'>" + ({ plain: "无掩护。敌纵队在平原/公路上跑得快。", hills: "+3防御, 可设伏。", forest: "+4防御, 伏击的家。", mountain: "+6防御, 敌行军极慢 — 你的堡垒。" })[t.terrain] + (t.road ? "<br>敌军行军动脉 — 地雷与伏击的好地方。" : "") + (t.rail ? "<br>敌输送命脉 — 可破袭。" : "") + "</div>";
    }
  }
  pn.innerHTML = html;
}
function uiAttack(kind, q, r) {
  const u = getSel();
  if (!u || u.attacked && !u.ambush) return;
  playerAttack(u, kind, q, r);
  computeVis(); renderPanel(); updateTop(); updateBanner(); draw();
  flushReports();
  if (state.over) return;
}
// ═══════════ 输入 ═══════════
let dragging = false, dragMoved = false, lastPt = null, pinchD = 0;
function pxToHex(px, py) {
  const wx = (px + cam.x) / cam.zoom, wy = (py + cam.y) / cam.zoom;
  let best = null, bd = 1e9;
  for (let q = 0; q < W; q++) for (let r = 0; r < H; r++) { const [cx, cy] = hexCenter(q, r); const d = (cx - wx) ** 2 + (cy - wy) ** 2; if (d < bd) { bd = d; best = [q, r]; } }
  return bd < (CFG.hex * 1.1) ** 2 ? best : null;
}
// 点击判定: 阈值放宽到10px(3px 会把触屏轻微抖动的点按当成拖动吃掉), 且按到"按下点"的
// 总位移判定, 而不是逐帧增量。另有 click 兜底, 保证任何环境下都点得动。
let downPt = null, tapHandled = false;
function handleTap(px, py) {
  if (!state || !state.started || state.over) return;
  tapHandled = true; // 同一次按下只处理一次(pointerup 与随后的 click 是同一次点击)
  const h = pxToHex(px, py);
  if (!h) { deselect(); return; }
  const [q, r] = h;
  const u = getSel();
  if (u && reach && reach[key(q, r)]) { moveSelTo(q, r); return; }
  const own = state.units.find(x => x.side === "p" && x.q === q && x.r === r);
  if (own) {
    sel = { kind: "unit", id: own.id };
    reach = own.attacked ? null : reachableMap(own);
    const n = reach ? Object.keys(reach).length : 0;
    if (n) log("选中" + UT_P[own.type].name + " — 地图上" + n + "格亮起(金框), 点其中任意一格即可移动(剩余机动 " + own.mp + ")", "hl");
    else log("选中" + UT_P[own.type].name + " — " + (moveBlockReason(own, own.q, own.r + 1) || "本旬无法再移动"), "jp");
    renderPanel(); draw(); return;
  }
  // 选中着部队却点了不可达的地方: 必须说清为什么, 不许静默
  if (u) {
    const why = moveBlockReason(u, q, r);
    if (why) log(why, "jp");
  }
  sel = { kind: "tile", q, r }; reach = null; renderPanel(); draw();
}
cv.addEventListener("pointerdown", e => { dragging = true; dragMoved = false; tapHandled = false; downPt = [e.clientX, e.clientY]; lastPt = [e.clientX, e.clientY]; });
cv.addEventListener("pointermove", e => {
  if (!dragging || !lastPt || !downPt) return;
  const totalDx = e.clientX - downPt[0], totalDy = e.clientY - downPt[1];
  if (Math.abs(totalDx) + Math.abs(totalDy) > 10) dragMoved = true;
  if (dragMoved) { cam.x -= e.clientX - lastPt[0]; cam.y -= e.clientY - lastPt[1]; lastPt = [e.clientX, e.clientY]; draw(); }
});
cv.addEventListener("pointercancel", () => { dragging = false; dragMoved = false; });
cv.addEventListener("pointerup", e => {
  dragging = false;
  if (dragMoved || tapHandled) return;
  handleTap(e.clientX, e.clientY);
});
// 兜底: 某些环境(触屏手势拦截、pointer 事件被吞)下 pointerup 不达, click 仍能让你点得动
cv.addEventListener("click", e => { if (!dragMoved && !tapHandled) handleTap(e.clientX, e.clientY); });
cv.addEventListener("wheel", e => { e.preventDefault(); const z = clamp(cam.zoom * (e.deltaY > 0 ? 0.9 : 1.11), 0.45, 2.2); const wx = (e.clientX + cam.x) / cam.zoom, wy = (e.clientY + cam.y) / cam.zoom; cam.zoom = z; cam.x = wx * z - e.clientX; cam.y = wy * z - e.clientY; draw(); }, { passive: false });
cv.addEventListener("touchmove", e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinchD) { const z = clamp(cam.zoom * d / pinchD, 0.45, 2.2); cam.zoom = z; draw(); }
    pinchD = d;
  }
}, { passive: false });
cv.addEventListener("touchend", () => { pinchD = 0; });
addEventListener("keydown", e => { if (e.key === "Enter" && $("modalWrap").classList.contains("hidden")) endTurn(); });
$("endTurnBtn").addEventListener("click", endTurn);
$("rosterBtn").addEventListener("click", showRoster);
$("helpBtn").addEventListener("click", showHelp);
addEventListener("resize", () => { syncCanvas(); draw(); });
function centerCam() {
  const [cx, cy] = hexCenter(state.hq.q, state.hq.r);
  cam.zoom = innerWidth < 640 ? 0.62 : 0.95;
  cam.x = cx * cam.zoom - innerWidth / 2;
  cam.y = cy * cam.zoom - innerHeight / 2;
}
// ═══════════ 启动 ═══════════
syncCanvas();
newGame();
computeVis();
centerCam();
updateTop();
draw();
showHelp();

</script>
