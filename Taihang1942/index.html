<canvas id="cv"></canvas>

<script>
"use strict";
// ═══════ 太行·1942 — 敌后根据地 ═══════
// 文明六内核 + 抗战皮: 建村扩张 / 工人改良 / 生产队列 / 整训科技 / 边界扩张 /
// 攻城拔点 / 征服胜利。日军是"有城可打、可被你一座座拔掉"的对手, 而不是刷你的天气。

const CFG = {
  W: 26, H: 20, hex: 46,
  totalTurns: 44, startYear: 1942, startMonth: 1,
  cityRadius: 2, borderStart: 1, cultPerBorder: 24, foodPerPop: 11, popMax: 8,
  baseCityHp: 60, hpPerPop: 8, hpPerWall: 25,
  healInCity: 25, healOwnLand: 12, healWild: 5, fortifyDef: 5,
  dmgBase: 30, dmgDiv: 13, counter: 0.85,
  raidFirst: 7, raidEvery: 6, sweepTurns: [15, 26, 37],
  captureHeal: 0.45, mineCost: 6, mineDmg: 26,
};
const TERR = {
  plain:    { name: "平原", food: 2, prod: 1, def: 0, col: "#5b6437", move: 1 },
  hills:    { name: "丘陵", food: 1, prod: 2, def: 4, col: "#6b6142", move: 2 },
  forest:   { name: "密林", food: 1, prod: 2, def: 5, col: "#3d5033", move: 2 },
  mountain: { name: "山地", food: 0, prod: 1, def: 8, col: "#5f574a", move: 3 },
};
const RES = {
  wheat: { name: "麦田", food: 2, prod: 0, on: ["plain"], icon: "🌾" },
  iron:  { name: "铁矿", food: 0, prod: 2, on: ["hills", "mountain"], icon: "⛏" },
  horse: { name: "骡马", food: 1, prod: 1, on: ["plain", "hills"], icon: "🐴" },
};
const IMP = {
  farm:   { name: "农田",   food: 2, prod: 0, on: ["plain", "hills"], turns: 2 },
  lumber: { name: "伐木场", food: 0, prod: 2, on: ["forest"], turns: 2 },
  mine:   { name: "矿场",   food: 0, prod: 2, on: ["hills", "mountain"], turns: 3, arms: 1 },
};
const BLD = {
  granary:  { name: "谷仓",     cost: 24, food: 2, desc: "+2粮/回合" },
  hall:     { name: "村公所",   cost: 22, cult: 2, need: "qunzhong", desc: "+2民心/回合(扩边界)" },
  school:   { name: "冬学夜校", cost: 28, sci: 3, desc: "+3学识/回合" },
  workshop: { name: "被服厂",   cost: 32, prod: 2, desc: "+2工分/回合" },
  tunnel:   { name: "地道网",   cost: 34, wall: 1, need: "didao", desc: "城防+25, 劫掠减半" },
  clinic:   { name: "卫生所",   cost: 28, heal: 10, need: "weisheng", desc: "驻军每回合额外+10" },
  arsenal:  { name: "兵工厂",   cost: 42, arms: 2, need: "binggong", desc: "+2军械/回合" },
};
const UT = {
  settler: { name: "工作队", gl: "工", side: "p", str: 0,  mp: 3, cost: 26, pop: 1, desc: "走到空地点【建立根据地】—— 你唯一的扩张手段" },
  worker:  { name: "建设队", gl: "建", side: "p", str: 0,  mp: 3, cost: 18, desc: "修农田/伐木场/矿场, 修复被劫掠的改良" },
  scout:   { name: "侦察员", gl: "侦", side: "p", str: 6,  mp: 4, cost: 14, vis: 3, desc: "视野3, 探路" },
  militia: { name: "民兵队", gl: "民", side: "p", str: 14, mp: 3, cost: 22, desc: "便宜耐用, 守土主力" },
  guer:    { name: "游击队", gl: "游", side: "p", str: 20, mp: 4, cost: 32, need: "maque", terrBonus: 6, desc: "密林/山地作战+6" },
  cmd:     { name: "武工队", gl: "武", side: "p", str: 24, mp: 5, cost: 38, need: "poxi", hide: true, desc: "隐蔽(日军不会主动打它) · 可破袭铁路" },
  regular: { name: "主力连", gl: "连", side: "p", str: 32, mp: 3, cost: 46, need: "zhenggui", desc: "攻坚拔点的拳头" },
  crack:   { name: "主力团", gl: "团", side: "p", str: 46, mp: 3, cost: 56, need: "gongjian", siege: 1.6, desc: "攻城×1.6 — 打县城的本钱" },
  puppet:  { name: "伪军小队", gl: "伪", side: "j", str: 12, mp: 3, siege: 0.7 },
  squad:   { name: "日军小队", gl: "日", side: "j", str: 22, mp: 3, siege: 0.95 },
  coy:     { name: "日军中队", gl: "中", side: "j", str: 34, mp: 3, siege: 1.15 },
  armor:   { name: "装甲车",   gl: "装", side: "j", str: 40, mp: 5, road: true, siege: 1.2 },
};
const TECH = {
  qunzhong: { name: "群众路线", cost: 14,  desc: "可建村公所 · 工作队-20%造价" },
  maque:    { name: "麻雀战",   cost: 22,  desc: "解锁游击队(密林山地+6)" },
  dilei:    { name: "地雷战",   cost: 30,  need: ["maque"], desc: "民兵可埋地雷" },
  didao:    { name: "地道战",   cost: 40,  need: ["maque"], desc: "可建地道网(城防+25)" },
  poxi:     { name: "破袭战",   cost: 42,  need: ["dilei"], desc: "解锁武工队 · 可破袭铁路" },
  weisheng: { name: "战地卫生", cost: 36,  need: ["didao"], desc: "可建卫生所" },
  binggong: { name: "兵工生产", cost: 50,  need: ["poxi"], desc: "可建兵工厂(+2军械)" },
  zhenggui: { name: "正规化",   cost: 62, need: ["poxi"], desc: "解锁主力连(战32)" },
  gongjian: { name: "攻坚战",   cost: 78, need: ["zhenggui"], desc: "解锁主力团 · 方可强攻县城" },
};
const VN = ["王家峪","李家庄","赵家坳","马家沟","石门村","柳树沟","黑石崖","桃花寨","大杨庄","南坡村","北岭村","东塬村","西沟村","孙家铺","青石口","枣林坪","苇子峪","麻田镇"];
const JPN = ["炮楼·甲","炮楼·乙","炮楼·丙","炮楼·丁","据点·东关","据点·西寨"];
const TOWN = "辽县城";

let rng = Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
const pick=a=>a[Math.floor(rng()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const key=(q,r)=>q+","+r;
const W=CFG.W,H=CFG.H,SQ3=Math.sqrt(3);
function inb(q,r){return q>=0&&q<W&&r>=0&&r<H}
function nbrs(q,r){const e=r%2===0;const d=e?[[1,0],[-1,0],[0,1],[0,-1],[-1,1],[-1,-1]]:[[1,0],[-1,0],[0,1],[0,-1],[1,1],[1,-1]];const o=[];for(const[a,b]of d){const nq=q+a,nr=r+b;if(inb(nq,nr))o.push([nq,nr])}return o}
function ax(q,r){return[q-(r-(r&1))/2,r]}
function hexDist(q1,r1,q2,r2){const[a1,b1]=ax(q1,r1),[a2,b2]=ax(q2,r2);return(Math.abs(a1-a2)+Math.abs(b1-b2)+Math.abs(a1+b1-a2-b2))/2}
function inRing(q,r,rad){const o=[];for(let a=0;a<W;a++)for(let b=0;b<H;b++)if(hexDist(q,r,a,b)<=rad)o.push([a,b]);return o}
function hexCenter(q,r){const s=CFG.hex;return[s*SQ3*(q+0.5*(r&1))+s,s*1.5*r+s]}
function dateStr(t){const i=CFG.startMonth-1+(t-1);return(CFG.startYear+Math.floor(i/12))+"年"+(i%12+1)+"月"}

// ═══════ 地图生成 ═══════
function genMap() {
  const tiles = [];
  for (let q = 0; q < W; q++) { tiles[q] = []; for (let r = 0; r < H; r++) {
    const n = rng();
    let t;
    if (q < 6) t = n < .5 ? "mountain" : n < .8 ? "hills" : "forest";
    else if (q < 12) t = n < .22 ? "mountain" : n < .5 ? "hills" : n < .78 ? "forest" : "plain";
    else if (q < 18) t = n < .1 ? "mountain" : n < .34 ? "hills" : n < .58 ? "forest" : "plain";
    else t = n < .08 ? "hills" : n < .18 ? "forest" : "plain";
    tiles[q][r] = { t, res: null, imp: null, impWork: 0, pillaged: false, road: false, rail: false, railCut: 0,
      city: null, owner: null, disc: false, mine: false };
  } }
  // 资源
  for (let q = 0; q < W; q++) for (let r = 0; r < H; r++) {
    const tile = tiles[q][r];
    if (rng() > .14) continue;
    const opts = Object.keys(RES).filter(k => RES[k].on.includes(tile.t));
    if (opts.length) tile.res = pick(opts);
  }
  // 铁路(东侧纵贯) + 县城 + 车站
  let rq = 21;
  const railT = [];
  for (let r = 0; r < H; r++) { rq = clamp(rq + ri(-1, 1), 20, 22); tiles[rq][r].rail = true; tiles[rq][r].t = "plain"; railT.push([rq, r]); }
  const townT = railT[Math.floor(H / 2)];
  // 公路: 从铁路向西探入(日军的爪子, 也是你的伏击场)
  const roads = [];
  const roadFrom = (sq, sr, len, bias) => {
    let q = sq, r = sr; const path = [];
    for (let i = 0; i < len; i++) {
      const opts = nbrs(q, r).filter(([a]) => a < q);
      if (!opts.length) break;
      opts.sort((p1, p2) => (p1[0] - p2[0] + Math.abs(p1[1] - (sr + bias)) * .5) - (p2[0] - q + Math.abs(p2[1] - (sr + bias)) * .5));
      const [nq, nr] = opts[0]; q = nq; r = nr;
      if (tiles[q][r].t === "mountain") tiles[q][r].t = "hills";
      tiles[q][r].road = true; path.push([q, r]);
    }
    roads.push(path); return path;
  };
  return { tiles, railT, townT, roadFrom };
}
// ═══════ 状态 ═══════
let state = null;
function newGame(seed) {
  rng = mulberry32(seed || ((Date.now() % 1e9) | 0));
  const g = genMap();
  const tiles = g.tiles;
  state = {
    turn: 1, over: false, result: null, started: false,
    tiles, sci: 0, cult: 0, arms: 12,
    research: null, techs: {}, nameIdx: 0,
    cities: [], units: [], nextId: 1,
    jp: { raidAt: CFG.raidFirst, sweepIdx: 0, alert: null, killed: 0, lostCities: 0 },
    stats: { jpKilled: 0, cityFounded: 0, captured: 0, imps: 0, pillaged: 0, techs: 0 },
  };
  // 日军城市: 县城(首府) + 若干炮楼(沿公路末端/丘陵)
  const town = g.townT;
  addCity(town[0], town[1], "j", TOWN, { capital: true, pop: 5, hp: 260 });
  const p1 = g.roadFrom(town[0], town[1], 12, -3), p2 = g.roadFrom(town[0], town[1], 8, 3);
  const st1 = g.railT[3], st2 = g.railT[H - 4];
  const p3 = g.roadFrom(st1[0], st1[1], 11, 2), p4 = g.roadFrom(st2[0], st2[1], 7, -2);
  let ji = 0;
  for (const p of [p1, p2, p3, p4]) {
    if (!p.length) continue;
    const [q, r] = p[p.length - 1];
    if (tiles[q][r].city) continue;
    addCity(q, r, "j", JPN[ji++ % JPN.length], { pop: 2, hp: 100 });
  }
  // 玩家首村: 西部山区, 挑周边好地的
  let best = null, bs = -1;
  for (let q = 2; q < 8; q++) for (let r = 2; r < H - 2; r++) {
    const t = tiles[q][r];
    if (t.city || t.t === "mountain") continue;
    let s = 0, pass = 0;
    for (const [a, b] of inRing(q, r, 2)) {
      const tt = tiles[a][b];
      s += TERR[tt.t].food * 2 + TERR[tt.t].prod + (tt.res ? 3 : 0);
      if (tt.t !== "mountain") pass++;
    }
    if (pass < 8) continue;
    if (s > bs) { bs = s; best = [q, r]; }
  }
  if (!best) best = [4, Math.floor(H / 2)];
  const hq = addCity(best[0], best[1], "p", VN[state.nameIdx++], { pop: 2, capital: true });
  state.hqId = hq.id;
  // 起手部队: 一民兵 + 一工作队(拓荒) + 一建设队
  spawn("militia", best[0], best[1], "p");
  spawn("settler", best[0], best[1], "p");
  spawn("worker", best[0], best[1], "p");
  // 敌军驻防
  for (const c of state.cities) if (c.side === "j") spawn(c.capital ? "coy" : "puppet", c.q, c.r, "j", { garrison: c.id });
  computeVis();
  return state;
}
function addCity(q, r, side, name, o) {

  log("═══ 1942年1月 · 太行根据地 ═══", "hl");
  log("上级指示: 发展生产、武装群众, 最后夺回" + TOWN + "。你有一个村、一支民兵、一个工作队、一个建设队。", "hl");
  log("先做三件事: ①点村庄安排生产 ②建设队修农田 ③工作队走远点【建立根据地】", "good");
  const c = myCities()[0];
  if (c) { sel = { kind: "city", id: c.id }; renderPanel(); }
}
function centerCam() {
  const c = myCities()[0] || { q: 4, r: 8 };
  const [cx, cy] = hexCenter(c.q, c.r);
  cam.zoom = innerWidth < 700 ? .62 : .9;
  cam.x = cx * cam.zoom - innerWidth / 2;
  cam.y = cy * cam.zoom - innerHeight / 2;
}
// ═══════ 输入 ═══════
let dragging = false, dragMoved = false, lastPt = null, downPt = null, tapDone = false, pinchD = 0;
function pxToHex(px, py) {
  const wx = (px + cam.x) / cam.zoom, wy = (py + cam.y) / cam.zoom;
  let best = null, bd = 1e9;
  for (let q = 0; q < W; q++) for (let r = 0; r < H; r++) { const [cx, cy] = hexCenter(q, r); const d = (cx - wx) ** 2 + (cy - wy) ** 2; if (d < bd) { bd = d; best = [q, r]; } }
  return bd < (CFG.hex * 1.05) ** 2 ? best : null;
}
function handleTap(px, py) {
  if (!state || !state.started || state.over) return;
  tapDone = true;
  const h = pxToHex(px, py);
  if (!h) { deselect(); return; }
  const [q, r] = h;
  const u = getSelUnit();
  const tapCity = cityAt(q, r);
  // 同格循环选择: 村庄 → 驻军1 → 驻军2 …(城里往往既要看生产又要调兵, 一格点得到全部)
  const here = [];
  if (tapCity && tapCity.side === "p") here.push({ kind: "city", id: tapCity.id });
  for (const pu of state.units) if (pu.side === "p" && pu.q === q && pu.r === r) here.push({ kind: "unit", id: pu.id });
  if (here.length && (!u || (u.q === q && u.r === r))) {
    let idx = sel ? here.findIndex(x => x.kind === sel.kind && x.id === sel.id) : -1;
    const nx = here[(idx + 1) % here.length];
    sel = nx;
    reach = null;
    if (nx.kind === "unit") { const nu = state.units.find(x => x.id === nx.id); if (nu && !nu.acted) reach = reachable(nu); }
    renderPanel(); draw(); return;
  }
  if (u && !u.acted) {
    if (hexDist(u.q, u.r, q, r) === 1 && UT[u.type].str > 0) {
      const foe = unitAtSide(q, r, "j"), fc = cityAt(q, r);
      if ((foe && vis(q, r)) || (fc && fc.side === "j")) { attack(u, q, r); reach = null; computeVis(); refreshAll(); return; }
    }
    if (reach && reach[key(q, r)]) {
      u.mp = Math.max(0, u.mp - reach[key(q, r)].cost); u.q = q; u.r = r; u.fort = false; u.work = null; u.path = null;
      const cc = cityAt(q, r);
      if (cc && cc.side !== "p" && cc.hp <= 0) captureCity(cc, "p");
      reach = u.mp > 0 ? reachable(u) : null;
      computeVis();
      // 移进自家村庄 = 顺手把生产面板亮出来(两个意图一次满足)
      const inCity = cityAt(u.q, u.r);
      if (inCity && inCity.side === "p") { sel = { kind: "city", id: inCity.id }; reach = null; }
      refreshAll(); return;
    }
  }
  const own = state.units.find(x => x.side === "p" && x.q === q && x.r === r);
  if (own) { selectUnit(own); return; }
  const c = cityAt(q, r);
  if (c && (c.side === "p" || vis(q, r))) { sel = { kind: "city", id: c.id }; reach = null; renderPanel(); draw(); return; }
  if (u && !u.acted) { if (moveTo(u, q, r)) { reach = u.mp > 0 ? reachable(u) : null; refreshAll(); return; } }
  sel = { kind: "tile", q, r }; reach = null; renderPanel(); draw();
}
function updateHover(px, py) {
  const u = getSelUnit();
  const h = pxToHex(px, py);
  if (!u || u.acted || !h) { if (hover) { hover = null; draw(); } return; }
  const [q, r] = h;
  if (hover && hover.q === q && hover.r === r) return;
  if (u.q === q && u.r === r) { hover = null; draw(); return; }
  if (hexDist(u.q, u.r, q, r) === 1 && UT[u.type].str > 0) {
    const foe = unitAtSide(q, r, "j"), fc = cityAt(q, r);
    if (foe && vis(q, r)) { hover = { q, r, kind: "attack", label: "⚔ 预计 -" + expDmg(uStr(u, "atk", q, r), uStr(foe, "def")) + " / 挨 -" + Math.round(expDmg(uStr(foe, "atk"), uStr(u, "def")) * CFG.counter) }; draw(); return; }
    if (fc && fc.side === "j") { const e = expSiege(u, fc); hover = { q, r, kind: "attack", label: "⚔ 攻城 预计 -" + e + (e <= 8 ? " (啃不动·需主力团)" : "") }; draw(); return; }
  }
  const path = farPath(u, q, r);
  if (!path) { hover = { q, r, kind: "blocked", label: "✖ 过不去" }; draw(); return; }
  hover = { q, r, kind: "move", path, label: pathTurns(u, path) <= 1 ? "本回合抵达" : pathTurns(u, path) + " 回合" };
  draw();
}
cv.addEventListener("pointerdown", e => { dragging = true; dragMoved = false; tapDone = false; downPt = [e.clientX, e.clientY]; lastPt = [e.clientX, e.clientY]; });
cv.addEventListener("pointermove", e => {
  if (dragging && lastPt && downPt) {
    if (Math.abs(e.clientX - downPt[0]) + Math.abs(e.clientY - downPt[1]) > 10) dragMoved = true;
    if (dragMoved) { cam.x -= e.clientX - lastPt[0]; cam.y -= e.clientY - lastPt[1]; lastPt = [e.clientX, e.clientY]; hover = null; draw(); return; }
  }
  if (dragging) return;
  if (e.pointerType === "touch") { if (hover) { hover = null; draw(); } return; }
  updateHover(e.clientX, e.clientY);
});
cv.addEventListener("pointerleave", () => { if (hover) { hover = null; draw(); } });
cv.addEventListener("pointercancel", () => { dragging = false; dragMoved = false; });
cv.addEventListener("pointerup", e => { dragging = false; if (dragMoved || tapDone) return; handleTap(e.clientX, e.clientY); });
cv.addEventListener("click", e => { if (!dragMoved && !tapDone) handleTap(e.clientX, e.clientY); });
cv.addEventListener("wheel", e => { e.preventDefault(); const z = clamp(cam.zoom * (e.deltaY > 0 ? .9 : 1.11), .4, 2), wx = (e.clientX + cam.x) / cam.zoom, wy = (e.clientY + cam.y) / cam.zoom; cam.zoom = z; cam.x = wx * z - e.clientX; cam.y = wy * z - e.clientY; draw(); }, { passive: false });
cv.addEventListener("touchmove", e => { if (e.touches.length === 2) { e.preventDefault(); const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (pinchD) { cam.zoom = clamp(cam.zoom * d / pinchD, .4, 2); draw(); } pinchD = d; } }, { passive: false });
cv.addEventListener("touchend", () => { pinchD = 0; });
addEventListener("keydown", e => { if (e.key === "Enter" && $("modalWrap").classList.contains("hidden")) { endTurn(); } });
$("endTurnBtn").addEventListener("click", endTurn);
$("techBtn").addEventListener("click", showTech);
$("foeBtn").addEventListener("click", showFoe);
$("helpBtn").addEventListener("click", showHelp);
$("logHead").addEventListener("click", () => toggleLog());
addEventListener("resize", () => { syncCanvas(); draw(); });
// ═══════ 启动 ═══════
applyLog();
syncCanvas();
newGame();
computeVis();
centerCam();
refreshAll();
showHelp();

</script>
