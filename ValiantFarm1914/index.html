<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2218">
  <meta name="description" content="Valiant Farm 1914 — 勇敢的心式一关：扔罐头、使唤狗、救人。">
  <title>瓦尔奈农场 · 1914</title>
  <link rel="stylesheet" href="./Style_Game.css?v=20260802c">
</head>
<body>
  <main id="Shell" class="shell">
    <canvas id="GameCanvas" class="canvas" tabindex="0" aria-label="瓦尔奈农场"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <section id="Title" class="overlay title">
      <a class="mark" href="../"><b>瓦尔奈农场</b><span>向勇敢的心致敬</span></a>
      <div class="titleCard">
        <p class="eyebrow">一九一四年 · 法国乡下</p>
        <h1>农场<br><em>救人</em></h1>
        <p class="lead">房子塌了，卫生员还在里面。把人弄出来。</p>
        <button id="BtnPlay" class="btn primary" type="button">开始</button>
        <p class="hintKeys">A/D 走 · S 蹲 · 空格 跳 · E 互动/唤狗 · F 扔</p>
      </div>
    </section>

    <section id="Prologue" class="overlay prologue" hidden>
      <article class="prologueCard" aria-live="polite">
        <p class="eyebrow">开场</p>
        <p id="PrologueSpeaker" class="prologueSpeaker">埃米尔</p>
        <blockquote id="PrologueLine" class="prologueLine">……</blockquote>
        <button id="BtnPrologue" class="btn primary" type="button">往下说</button>
      </article>
    </section>

    <section id="Win" class="overlay win" hidden>
      <div class="titleCard">
        <p class="eyebrow">撤出来了</p>
        <h1>人在车上</h1>
        <p class="lead">狗跟在脚边。今天先活下去——往后再说。</p>
        <button id="BtnReplay" class="btn primary" type="button">再来一次</button>
      </div>
    </section>

    <section id="Hud" class="hud" hidden>
      <div id="Hearts" class="hearts" aria-label="体力"></div>
      <div id="Hand" class="hand" aria-label="手里"></div>
      <div id="BarkBox" class="barkBox" hidden>
        <p id="BarkSpeaker" class="barkSpeaker"></p>
        <p id="Bark" class="bark"></p>
      </div>
    </section>

    <div id="Touch" class="touch" hidden>
      <button type="button" data-k="left">◀</button>
      <button type="button" data-k="right">▶</button>
      <button type="button" data-k="crouch">蹲</button>
      <button type="button" data-k="jump">跳</button>
      <button type="button" data-k="act">E</button>
      <button type="button" data-k="throw">扔</button>
    </div>
  </main>
  <script type="module" src="./Script_Game.mjs?v=20260802c"></script>
</body>
</html>
