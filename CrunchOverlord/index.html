<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>牛马指挥官 · Crunch Overlord</title>
  <link rel="stylesheet" href="./Style_Game.css?v=2" />
</head>
<body>
  <div id="stage">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <header id="hud" class="hidden">
      <div class="hud-cell">
        <span class="hud-label">月份</span>
        <span class="hud-value" id="hudMonth">M01</span>
      </div>
      <div class="hud-cell">
        <span class="hud-label">现金</span>
        <span class="hud-value" id="hudCash">¥88,888</span>
      </div>
      <div class="hud-cell hud-wide">
        <span class="hud-label">流水目标 <span id="hudGoalText"></span></span>
        <div class="hud-bar"><i id="hudGoalFill"></i></div>
      </div>
      <div class="hud-cell hud-wide">
        <span class="hud-label" id="hudProjectName">《?》</span>
        <div class="hud-bar"><i id="hudProjectFill"></i></div>
      </div>
      <div class="hud-cell">
        <span class="hud-label">老板头发</span>
        <span class="hud-value" id="hudHair">100%</span>
      </div>
      <div class="hud-cell">
        <span class="hud-label">全员效率</span>
        <span class="hud-value" id="hudSpeed">100%</span>
      </div>
    </header>

    <div id="bossBanner" class="hidden"></div>
    <div id="selectionHint" class="hidden"></div>
    <div id="toastStack"></div>

    <div id="tutorialTip" class="hidden">
      <span id="tutorialText"></span>
      <button id="tutorialSkip" type="button">跳过引导</button>
    </div>

    <nav id="commandBar" class="hidden">
      <div class="cmd-row">
        <span class="cmd-tag">压榨</span>
        <button id="pieButton" type="button"><b>画大饼 [Q]</b><small>全员提速8秒 · 饼凉全员掉士气</small></button>
        <button id="bossCodeButton" type="button"><b>亲自写代码 [W]</b><small>进度+10 · 掉头发 · 送BUG</small></button>
        <button id="footbathButton" type="button"><b>报销足浴 [E]</b><small>¥1,999 · 选中的牛马士气+35</small></button>
        <button id="releaseButton" type="button"><b>发售！[R]</b><small>进度满可按 · BUG越多评分越低</small></button>
      </div>
      <div class="cmd-row">
        <span class="cmd-tag">老板的生活</span>
        <button id="spaButton" type="button"><b>老板去足疗 [A]</b><small>¥888 · 头发+18 · 离岗牛马摸鱼</small></button>
        <button id="clubButton" type="button"><b>高端会所 [S]</b><small>¥8,888 · 可能拉到投资 · 全员看到朋友圈</small></button>
        <button id="stockButton" type="button"><b>杀入股市 [D]</b><small>¥20,000 · 纯赌 · 老板离岗</small></button>
      </div>
    </nav>

    <div id="titleScreen">
      <h1>牛马指挥官</h1>
      <p class="subtitle">CRUNCH OVERLORD · 你不用做游戏，你只需要让别人做游戏</p>
      <ul class="howto">
        <li><b>点牛马 → 点目标</b>：修红色 BUG，或冲进度</li>
        <li><b>直接点黄色需求瘤</b>：老板亲自砍需求，策划会哭</li>
        <li><b>老板也有生活</b>：足疗生发、会所拉投资、股市搏一搏</li>
        <li><b>但是</b>：老板一出门，牛马集体摸鱼（效率减半、士气回升）</li>
        <li><b>目标</b>：流水 ¥500,000 · 别破产 · 别把人全逼走</li>
      </ul>
      <button id="startButton" type="button">上任 CEO</button>
      <p class="tiny">手机请横屏 · 老板的视野必须是宽的</p>
    </div>

    <div id="endScreen" class="hidden">
      <h1 id="endTitle"></h1>
      <p id="endReason"></p>
      <div id="endStats"></div>
      <button id="restartButton" type="button">再开一家公司</button>
    </div>
  </div>

  <div id="rotateHint" class="hidden">
    <div class="rotate-card">📱↻<br />横屏体验更佳<br /><span>老板的格局必须是宽的</span></div>
  </div>

  <script type="module" src="./Script_Game.mjs?v=2"></script>
</body>
</html>
