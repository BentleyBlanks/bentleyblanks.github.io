<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161a">
<title>地下长城 · 冀中1942 —— 双层六角回合制策略</title>
<meta name="description" content="以冀中平原地道战为题材的原创回合制策略白盒：规划并运用地道网络，对抗敌军的侦察、封锁与扫荡。双层六角战场，PC 优先。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314161a'/%3E%3Cpath d='M16 4l10 6v12l-10 6-10-6V10z' fill='none' stroke='%23d8d5cc' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='none' stroke='%23c04938' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./Style_Game.css?v=5">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.mjs",
  "three/addons/": "./vendor/three/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app">
  <canvas id="worldCanvas" aria-label="双层六角三维战场" role="img"></canvas>
  <div id="uiRoot" class="ui-root">
    <header id="topBar" class="tf-topbar"></header>
    <div id="fixtureBadge" class="tf-fixture-badge" hidden>夹具模式 · 仅渲染不可玩</div>
    <div id="toastStack" class="tf-toasts"></div>
    <div id="bannerBox" class="tf-banner" hidden></div>
    <aside id="ledgerPanel" class="tf-ledger"></aside>
    <aside id="infoPanel" class="tf-info"></aside>
    <button id="logToggle" class="tf-log-toggle" type="button">日志</button>
    <aside id="logDrawer" class="tf-log" hidden></aside>
    <div id="endTurnBox" class="tf-endturn"></div>
    <div id="hintCard" class="tf-hint" hidden></div>
    <div id="menuPanel" class="tf-menu" hidden></div>
    <div id="modalRoot" class="tf-modal-root" hidden></div>
  </div>
</div>

<div id="bootScreen" class="boot">
  <div class="boot-inner">
    <h1 class="boot-title">地下长城 · 冀中1942</h1>
    <p class="boot-subtitle">敌在头顶搜庄 · 你在地下调兵</p>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <p id="bootHint" class="boot-hint">正在装配战场……</p>
    <p class="boot-note">
      本作为原创虚构作品：场景是综合化的冀中平原敌后村落群，村名一律虚构。<br>
      群众伤亡、被抓、房屋被焚、粮食被夺只进代价账本，绝不转化为任何资源或奖励。
    </p>
  </div>
</div>

<div id="pcGate" aria-hidden="true">
  <div>
    <p class="gate-title">地下长城 · 冀中1942</p>
    <p class="gate-body">本作为桌面端设计（1280×720 起）。<br>请在电脑上打开，并尽量放大浏览器窗口。</p>
    <button class="gate-enter" type="button"
      onclick="this.closest('#pcGate').classList.add('gate-dismissed')">仍要进入</button>
  </div>
</div>

<noscript>
  <div class="boot"><div class="boot-inner"><h1 class="boot-title">地下长城 · 冀中1942</h1>
  <p class="boot-hint">本页需要启用 JavaScript 与 WebGL 才能运行。</p></div></div>
</noscript>

<script type="module">
  const bootBar = document.getElementById("bootBar");
  const bootHint = document.getElementById("bootHint");
  const bootScreen = document.getElementById("bootScreen");
  let progress = 0;
  const tick = setInterval(() => {
    progress = Math.min(88, progress + 4);
    if (bootBar) bootBar.style.width = progress + "%";
  }, 120);

  function Fail(message, error) {
    clearInterval(tick);
    if (bootHint) {
      bootHint.textContent = message;
      bootHint.classList.add("boot-hint-error");
    }
    if (error) console.error(error);
  }

  try {
    const probe = document.createElement("canvas");
    if (!probe.getContext("webgl2") && !probe.getContext("webgl")) throw new Error("WebGL unavailable");
  } catch (error) {
    Fail("此设备或浏览器不支持 WebGL，无法运行三维战场。", error);
  }

  import("./Script_Main.mjs?v=5")
    .then((module) => module.StartGame({
      canvas: document.getElementById("worldCanvas"),
      uiRoot: document.getElementById("uiRoot"),
      OnProgress(value, hint) {
        progress = Math.max(progress, value * 100);
        if (bootBar) bootBar.style.width = progress + "%";
        if (hint && bootHint) bootHint.textContent = hint;
      },
    }))
    .then(() => {
      clearInterval(tick);
      if (bootBar) bootBar.style.width = "100%";
      bootScreen.classList.add("boot-done");
      setTimeout(() => bootScreen.remove(), 800);
    })
    .catch((error) => Fail("启动失败：" + (error?.message ?? error), error));
</script>
</body>
</html>
